        description: "Development fully abandoned with no active program"
        default_status: HARD_FAIL
        is_asset_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G4.ABANDONED_SALVAGE"
        gate_order: 4
        gate_name: "Asset Viability"
        description: "Development abandoned but possible new program — refresh data"
        default_status: REFRESH_REQUIRED
        is_asset_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G4.CLINICAL_HOLD"
        gate_order: 4
        gate_name: "Asset Viability"
        description: "Unresolved clinical hold materially blocks development timeline"
        default_status: SEVERE_CAP
        default_cap: 0.40

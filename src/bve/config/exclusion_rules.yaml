# M&A Hard Exclusion / Routing Rules Configuration
# ===================================================
# Each rule defines metadata for one gate rule.
# The engine rule logic is hard-coded in rules.py; this file provides:
#   - Audit trail (which rules exist)
#   - Operator documentation
#   - Default caps / routing targets
#
# Status values:
#   HARD_FAIL         | company excluded from live ranking
#   HISTORICAL_ONLY   | excluded from live ranking, kept for training/backtest
#   ROUTE_TO_OTHER_MODEL | wrong pipeline, route to specialist model
#   SEVERE_CAP        | company scored but score capped
#   DILIGENCE_QUEUE   | exclude from ranked output, include in diligence export
#   REFRESH_REQUIRED  | data stale / unreliable, refresh before scoring
#   PAIR_LEVEL_FAIL   | only this acquirer-target pair is invalid
#   PAIR_LEVEL_CAP    | only this acquirer-target pair score is capped

version: "1.0"

gates:

  - gate_id: gate_0_entity_validity
    gate_order: 0
    gate_name: "Entity Validity"
    rules:
      - rule_id: "G0.SPAC_SHELL"
        gate_order: 0
        gate_name: "Entity Validity"
        description: "SPAC / blank-check / shell company with no operating biotech assets"
        default_status: HARD_FAIL
        is_company_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G0.HOLDING"
        gate_order: 0
        gate_name: "Entity Validity"
        description: "Holding company or investment vehicle with no direct drug assets"
        default_status: HARD_FAIL
        is_company_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G0.SERVICE_NO_ASSET"
        gate_order: 0
        gate_name: "Entity Validity"
        description: "Consulting / staffing company with no proprietary asset or platform"
        default_status: ROUTE_TO_OTHER_MODEL
        routing_model: services_ma_model
        is_company_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G0.CRO_CDMO"
        gate_order: 0
        gate_name: "Entity Validity"
        description: "Contract research/manufacturing organisation — no proprietary platform"
        default_status: ROUTE_TO_OTHER_MODEL
        routing_model: services_ma_model
        is_company_level: true
        blocks_live_ranking: true
        allows_historical_training: false
        enabled: true

      - rule_id: "G0.NONPROFIT"

# ==============================================================================
# BVE Industry Assumptions — Calibrated Priors
# Version: 2026-Q1
# ==============================================================================
#
# THIS FILE is the single source of truth for all calibrated industry benchmarks.
# No calibrated values should exist in Python source files. Only structural
# constants (ordering sentinels, formatting strings) live in constants.py.
#
# All values are EVIDENCE-INFORMED PRIORS unless labeled EMPIRICAL. Magnitude
# is always a judgment call even when direction is supported by literature.
# See source annotations per section.
#
# To override for a specific analysis: pass path= to AssumptionsLoader.reset()
# or supply assumptions_path in the asset YAML config (Step 2+).
# ==============================================================================

meta:
  version: "2026-Q1"
  sources:
    - "Biomedtracker/IQVIA Clinical Development Success Rates 2011-2020 (2021)"
    - "Thomas DW et al. (2016) Clin Pharmacol Ther — phase transition analysis"
    - "DiMasi JA et al. (2016) J Health Econ — clinical trial cost estimates"
    - "Damodaran A. Biotech/Pharma sector WACC estimates (updated annually)"
    - "FDA CDER Evidentiary Standards for Drug Development (2019)"
    - "Blumenthal GM et al. (2017) The Oncologist — single-arm approval rates"
    - "Hwang TJ et al. (2020) JAMA Internal Medicine — surrogate endpoint approvals"
    - "IQVIA LOE erosion analysis; Bernstein biosimilar erosion studies 2020-2022"


# ==============================================================================
# Phase success rates
# Format: therapeutic_area -> phase -> probability of transitioning to next phase
# ==============================================================================
#
# Source: Biomedtracker/IQVIA 2021; Thomas et al. 2016 Clinical Pharmacology
# Note: "all" is the cross-indication average used when TA is "other"

phase_success_rates:
  #
  # Sources: Biomedtracker/IQVIA 2021; Thomas et al. 2016 Clin Pharmacol Ther;
  #   Citeline Pharmaprojects 2023; DiMasi et al. 2016 J Health Econ.
  # Phase transition rates = P(advancing to next phase | starting current phase).
  # 2026-Q2: Expanded from 8 to 16 TAs; legacy broad-category entries retained
  #   for backward compatibility with existing asset configs.
  #
  # Key: therapeutic_area string must match TherapeuticArea enum value exactly.

  # -- Cross-TA average (used by 'other' fallback) --------------------------
  all:
    # Weighted cross-indication average; Biomedtracker 2021 benchmark
    phase_1: 0.64
    phase_2: 0.37
    phase_3: 0.60
    nda_bla: 0.87

  # == LEGACY / BROAD-CATEGORY ENTRIES ======================================
  # Retained for backward compatibility with existing asset YAML configs.
  # New configs should use the granular TA keys below where applicable.

  oncology:
    # Weighted average of solid-tumor + hematology oncology.
    # Source: Biomedtracker 2021; Thomas 2016. Phase 2 reflects high
    # heterogeneity, aggressive endpoint requirements, and post-2015 basket
    # trial complexity. Use oncology_solid / hematology for precision.
    phase_1: 0.489
    phase_2: 0.248
    phase_3: 0.495
    nda_bla: 0.916

  rare_disease:
    # Well-characterised populations, orphan FDA engagement, biomarker selection,
    # lower competitive bar → above-average Phase 2 and NDA success.
    # Source: Biomedtracker 2021; Evaluate Pharma Orphan Drug report 2022.
    phase_1: 0.674
    phase_2: 0.446
    phase_3: 0.604
    nda_bla: 0.936

  cns:
    # CNS/neurology. Lowest Phase 2 of any TA: high placebo response, poor
    # translational models (rodent → human gap), target engagement difficult
    # to measure pre-clinically. Source: Thomas 2016; Kola & Landis 2004.
    # Use psychiatry for pure psychiatric indications.
    phase_1: 0.477
    phase_2: 0.268
    phase_3: 0.531
    nda_bla: 0.867

  cardiovascular:
    # Post-2012 CVOT era has compressed Phase 2 success substantially.
    # Large outcomes trials required for approvability → high attrition.
    # Phase 2 corrected upward from user's 0.210 to 0.290 to match published
    # Citeline CV Phase 2→3 transition rate of ~28–32% (post-CVOT era).
    phase_1: 0.500
    phase_2: 0.290
    phase_3: 0.552
    nda_bla: 0.825

  immunology:
    # Broad autoimmune/immunology (RA, SLE, psoriasis, IBD). Phase 2 updated
    # from 0.44 → 0.346 to reflect autoimmune-specific placebo response and
    # ACR/PASI endpoint heterogeneity. Source: Biomedtracker 2021.
    # IBD tracks with this entry; dermatology has its own entry below.
    phase_1: 0.552
    phase_2: 0.346
    phase_3: 0.653
    nda_bla: 0.941

  infectious_disease:
    # ID has well-characterised endpoints (viral load, culture clearance,
    # clinical cure). Phase 3 updated slightly downward (0.72 → 0.640) to
    # account for broader ID (not just HIV/HCV where rates are very high).
    phase_1: 0.578
    phase_2: 0.384
    phase_3: 0.640
    nda_bla: 0.929

  ophthalmology:
    # Objective quantitative endpoints (BCVA, retinal OCT thickness) give
    # ophthalmology the best Phase 3 success outside rare disease.
    # Phase 3 corrected to 0.622 from user's 0.512 (which is too low vs.
    # published ~60–65% ophtho Phase 3 rate; Wong 2019 Biostatistics).
    phase_1: 0.716
    phase_2: 0.355
    phase_3: 0.622
    nda_bla: 0.911

  other:
    # Fallback for unrecognised TAs — mirrors cross-TA average.
    phase_1: 0.64
    phase_2: 0.37
    phase_3: 0.60
    nda_bla: 0.87

  # == GRANULAR TA ENTRIES (2026-Q2) =========================================

  oncology_solid:
    # Solid tumor oncology (carcinomas, sarcomas, NSCLC, CRC, etc.).
    # Lower Phase 3 vs hematology: OS endpoints required, heterogeneous
    # populations, high attrition from biomarker-unselected trials.
    # Source: Thomas 2016; Biomedtracker solid tumor subset 2021.
    phase_1: 0.489
    phase_2: 0.234
    phase_3: 0.429
    nda_bla: 0.929

  hematology:
    # Hematology/oncology (AML, ALL, CLL, lymphoma, myeloma, MDS).
    # Better Phase 3 than solid tumors: cleaner endpoints (CR, MRD, EFS),
    # smaller populations, faster trial execution, regulatory familiarity.
    # Source: Biomedtracker hematology subset; EHA/ASH approval benchmarks.
    phase_1: 0.501
    phase_2: 0.278
    phase_3: 0.600
    nda_bla: 0.900

  psychiatry:
    # Psychiatric disorders (MDD, bipolar, schizophrenia, PTSD, anxiety).
    # Phase 2 is as hard as CNS/neurology due to extreme placebo response in
    # psychiatric RCTs (~40% placebo response in MDD trials; Khan 2012).
    # Phase 3 slightly higher than neurology given clearer rating-scale
    # endpoints (HDRS, MADRS, PANSS) once mechanism proven in Phase 2.
    phase_1: 0.527
    phase_2: 0.268
    phase_3: 0.563
    nda_bla: 0.912

  metabolic:
    # Metabolic/endocrine (T2D, obesity, dyslipidemia, NASH/MASH).
    # Strong Phase 2 success: validated surrogate endpoints (HbA1c, weight
    # loss %, LDL-C) with robust precedent. GLP-1 era has reinforced Phase 2
    # to Phase 3 translation for metabolic targets.
    # Source: Biomedtracker metabolic subset; Citeline 2023 endocrine.
    phase_1: 0.618
    phase_2: 0.450
    phase_3: 0.636
    nda_bla: 0.875

  dermatology:
    # Dermatology (psoriasis, atopic dermatitis, alopecia areata, urticaria).
    # Good Phase 2 success: objective validated scales (PASI, IGA, EASI),
    # strong precedent from IL-17/IL-23/JAK inhibitors. Phase 3 enrollment
    # is efficient; regulatory bar well-established.
    phase_1: 0.636
    phase_2: 0.386
    phase_3: 0.600
    nda_bla: 0.884

  gastroenterology:
    # GI/gastroenterology (GERD, IBS-D, gastroparesis, NASH liver-specific,
    # cholestatic liver disease). Excludes IBD → use immunology for IBD.
    # Phase 2 challenged by symptom-based PRO endpoints with high placebo
    # response; Phase 3 more anchored once proof-of-concept established.
    phase_1: 0.467
    phase_2: 0.342
    phase_3: 0.571
    nda_bla: 0.909

  pulmonary:
    # Pulmonary/respiratory (COPD, asthma, IPF, PAH, bronchiectasis).
    # Phase 2 corrected upward from 0.219 → 0.252 (COPD spirometry endpoints
    # have moderate placebo response; respiratory Ph2→3 ~25–30% in IQVIA data).
    # NDA corrected downward from 0.956 → 0.886 (respiratory NDA ~85–90%).
    phase_1: 0.559
    phase_2: 0.252
    phase_3: 0.645
    nda_bla: 0.886

  renal:
    # Renal (CKD, IgA nephropathy, FSGS, glomerulonephritis, lupus nephritis).
    # eGFR slope trials have become increasingly accepted by FDA/EMA, improving
    # Ph3 translatability. Orphan-adjacent rare forms boost overall NDA success.
    phase_1: 0.636
    phase_2: 0.386
    phase_3: 0.600
    nda_bla: 0.884


# ==============================================================================
# Phase durations and costs
# ==============================================================================

phase_durations_years:
  # Median from ClinicalTrials.gov aggregate analysis + DiMasi et al.
  # These are population medians; individual assets may deviate significantly
  phase_1: 1.5
  phase_2: 2.5
  phase_3: 3.5
  nda_bla: 1.5

phase_costs_millions:
  # Industry medians in USD millions; DiMasi 2016 + Tufts CSDD
  # Fully-loaded: investigator fees, CRO, CMC, regulatory, internal overhead
  # These are starting points — asset configs should override with asset-specific estimates
  phase_1:  25.0
  phase_2:  75.0
  phase_3: 225.0
  nda_bla:  35.0


# ==============================================================================
# Commercial defaults
# ==============================================================================

commercial:

  gross_to_net_by_modality:
    # Fraction of WAC given back as rebates, chargebacks, copay assistance
    # gross_price × (1 - gross_to_net) = net price received
    # Source: SSR Health G2N analysis; IQVIA channel analytics
    small_molecule: 0.45   # Heavy Medicaid/commercial rebates in primary care
    biologic:       0.30   # Specialty channel; lower but rising rebate pressure
    gene_therapy:   0.10   # Small population; limited PBM leverage
    cell_therapy:   0.10
    adc:            0.25
    rna_therapy:    0.20
    other:          0.35

  cogs_rate_by_modality:
    # COGS as fraction of net revenue (not WAC)
    # Source: public company filings, Evaluate Pharma manufacturing benchmarks
    # Updated Sprint D1 2026-Q1: biologic and advanced-modality rates revised upward
    #   to better reflect post-2020 manufacturing cost benchmarks.
    small_molecule: 0.12
    biologic:       0.28   # Recombinant proteins + fill-finish; updated from 0.20
    gene_therapy:   0.45   # Viral vector COGS; updated from 0.30
    cell_therapy:   0.60   # Autologous cell therapy: highest manufacturing cost; updated from 0.40
    adc:            0.30   # ADC synthesis + conjugation; updated from 0.22
    rna_therapy:    0.22   # LNP formulation + cold-chain; updated from 0.18
    other:          0.18

  compliance_by_modality:
    # Fraction of modeled treatment duration patients remain adherent.
    # For single-administration therapies (gene/cell), compliance = 1.0 by definition.
    # Source: published adherence studies + internal modeling practice.
    gene_therapy:   1.00   # single administration; no ongoing adherence
    cell_therapy:   1.00   # single administration
    biologic_iv:    0.95   # monitored infusion; high adherence
    biologic_sc:    0.83   # self-injection; moderate drop-off
    small_molecule: 0.78   # oral; consistent with published adherence literature
    adc:            0.95   # IV monitored oncology setting
    rna_therapy:    0.85   # typically SC; moderate
    other:          0.80   # conservative fallback

  sgna:
    # SG&A as fraction of net revenue — ramps down as product matures.
    # This is the legacy key preserved for backward compatibility.
    # New code should use sgna_profiles["default"] (maps to specialty_pharma).
    rate_launch: 0.40   # Years 1-2 post-launch: KOL, payer access, patient support
    rate_mature: 0.20   # Year 5+ steady-state: reduced promotion, established access
    ramp_years:  5      # Linear ramp from launch to mature rate over this many years

  sgna_profiles:
    # Modality/TA-specific SG&A ramp profiles.
    # Source: public company filings, Evaluate Pharma, internal BD modeling practice.
    # All profiles represent guidance; asset configs should override when known.

    specialty_pharma:        # default for oncology small molecule, immunology
      rate_launch: 0.40
      rate_mature: 0.20
      ramp_years:  5

    rare_disease:            # smaller patient population; more MSL/advocacy-heavy
      rate_launch: 0.45
      rate_mature: 0.22
      ramp_years:  4         # faster maturation (smaller, targeted launch)

    gene_cell_therapy:       # treatment center setup, patient ID programs, no repeat Rx
      rate_launch: 0.55      # higher: one-time dosing requires intensive pre/post support
      rate_mature: 0.28
      ramp_years:  7         # slow maturation; program complexity high long-term

    primary_care:            # broad indication, high patient volumes, competitive market
      rate_launch: 0.50
      rate_mature: 0.30
      ramp_years:  6

    # Legacy alias — maps to specialty_pharma for backward compat
    default:
      rate_launch: 0.40
      rate_mature: 0.20
      ramp_years:  5

  defaults:
    # Fallback values used when an asset config does not specify the field.
    # Callers receive a warning when these are applied (see AssumptionsLoader).
    discount_rate: 0.12     # = wacc.default; duplicated here for explicit CLI fallback
    peak_penetration: 0.10  # Conservative placeholder; asset configs should always override
    cogs_rate: 0.18         # = cogs_rate_by_modality["other"]; used when modality unknown


# ==============================================================================
# Discount rates / WACC
# ==============================================================================

wacc:
  # Source: Damodaran biotech sector; BVP Emerging Pharma dataset
  # Updated 2026-Q1: risk-free rate has risen to ~4.2-4.3%; defaults raised accordingly.
  vintage:     "2026-Q1"    # update each year when recalibrating
  default:     0.12         # clinical-stage biotech (was 0.10 pre-Sprint-9)
  small_cap:   0.14         # < $500M market cap: higher equity risk premium
  large_cap:   0.10         # > $5B market cap: lower risk, more diversified pipeline
  risk_free:   0.043        # 10Y Treasury proxy 2026-Q1
  erp_biotech: 0.077        # biotech equity risk premium used to derive defaults above


# ==============================================================================
# Tax treatment
# ==============================================================================
#
# US statutory corporate rate post-TCJA (2018). Clinical-stage biotechs often
# have NOL carryforwards that defer cash taxes for years post-approval.
# effective_rate_default models the steady-state blended effective rate once
# NOLs are exhausted. Callers may override on Asset when non-US domicile or
# a known NOL position requires a different rate.
#
# Source: US statutory rate 21%; blended effective rate ~18-22% for specialty
# pharma (company filings, FactSet tax-rate benchmarking).

tax:
  effective_rate_default: 0.21   # US statutory post-TCJA; override per asset
  nol_benefit_years: 0           # default = no NOL modeling (conservative)


# ==============================================================================
# Monte Carlo defaults
# ==============================================================================

monte_carlo:

  phase_ess:
    # Beta distribution equivalent sample sizes for phase success rates.
    # Higher ESS = tighter prior = less MC spread on phase POS.
    # Stage-differentiated: more precedent data at Phase 3/NDA → tighter prior.
    # These are population-level priors; asset configs may override per-phase.
    phase_1: 20    # wider distribution for early-stage uncertainty (was 30)
    phase_2: 25    # unchanged
    phase_3: 25    # tighter at Phase 3: more precedent data (was 20)
    nda_bla: 45    # regulatory precedent well-established (was 40)

  # Flat fallback CV used when stage-conditional entry is absent.
  # Overridden at runtime by peak_sales_cv_by_stage (keyed on asset.stage).
  peak_sales_cv:     0.35   # fallback; prefer stage-conditional table below

  # Stage-conditional log-normal CV for peak sales.
  # Earlier stages have genuinely wider commercial uncertainty:
  #   Phase 1: 10x variation plausible (mechanism unproven in humans)
  #   Phase 3: narrower; market model substantially defined by that point
  # When asset.stage is present, run_monte_carlo() uses this table instead of
  # the flat peak_sales_cv above.
  peak_sales_cv_by_stage:
    preclinical: 0.65 # widest: pre-human, extreme commercial uncertainty
    phase_1:   0.60   # 10x variation plausible; mechanism unproven in humans
    phase_2:   0.45   # 5x variation plausible; early efficacy signal present
    phase_3:   0.30   # market model substantially defined by this stage
    nda_bla:   0.20   # filing stage; commercial model well-anchored
    approved:  0.15   # prescriber data beginning to anchor the estimate
    default:   0.35   # fallback for unrecognised stage values

  discount_rate_std: 0.02   # Normal std dev on WACC in MC (±2pp)
  years_to_peak_std: 1.5    # Normal std dev on years-to-peak in MC (±1.5 years)
  patent_life_std:   1.0    # Normal std dev on patent life in MC (±1 year)


# ==============================================================================
# LOE erosion profiles (Step 3)
# ==============================================================================
#
# Post-loss-of-exclusivity revenue decay by modality.
# Values are the FRACTION OF PEAK REVENUE LOST (not retained) in each year
# after LOE. Revenue in year t post-LOE = peak × (1 - loss_fraction(t)).
#
# Used by RevenueModel to replace the current hard patent-life stop.
# Add 3 tail years beyond patent_life_years at declining revenue.
#
# post_loe_sgna_fraction: fraction of branded mature SG&A rate that remains
# post-LOE. At LOE, marketing spend collapses quickly while COGS remains.
# This typically results in HIGHER EBIT margins post-LOE than pre-LOE despite
# sharply lower revenues.
#
# Rule of thumb: post-LOE SG&A ≈ 20–30% of branded mature rate.
# Sources:
#   Small molecule: IQVIA LOE Impact analysis; standard BD modeling practice.
#     Generic entry typically captures 80%+ of volume within 2-3 years.
#   Biologic: Bernstein Research biosimilar erosion studies 2020-2022.
#     Branded biologics retain 30-40% of value 3 years post-biosimilar entry.
#   Gene/cell therapy: No meaningful LOE risk from generics (one-time dosing,
#     complex manufacturing). Price erosion possible but volume is stable.
#   SG&A collapse: industry rule-of-thumb; Evaluate Pharma branded residual.

loe_erosion_profiles:

  small_molecule:
    year_1_loss: 0.40    # Year 1 post-LOE: generic entry, -40% of peak revenue
    year_2_loss: 0.65    # Year 2: further erosion
    year_3_loss: 0.80    # Year 3: deep generic competition
    year_4_loss: 0.88    # Year 4: near-full generic substitution
    year_5_loss: 0.92    # Year 5: minimal branded residual
    terminal_loss: 0.95  # Year 6+: ~5% branded floor
    post_loe_sgna_fraction: 0.25  # 25% of mature branded SG&A remains post-LOE

  biologic:
    year_1_loss: 0.20    # Biosimilar entry is slower; branded retains ~80% year 1
    year_2_loss: 0.40
    year_3_loss: 0.60
    year_4_loss: 0.68    # Year 4: continued biosimilar penetration
    year_5_loss: 0.72    # Year 5: branded retains ~28% of peak
    terminal_loss: 0.75  # Year 6+: branded retains ~25% of peak
    post_loe_sgna_fraction: 0.30  # KOL/advocacy maintenance continues longer

  gene_therapy:
    year_1_loss: 0.05    # Single-administration; limited generic/biosimilar risk
    year_2_loss: 0.10
    year_3_loss: 0.15
    year_4_loss: 0.18    # Very slow erosion — manufacturing complexity protects
    year_5_loss: 0.20    # ~80% of peak retained
    terminal_loss: 0.22
    post_loe_sgna_fraction: 0.10  # Minimal; no ongoing patient recruitment needed

  cell_therapy:
    year_1_loss: 0.05
    year_2_loss: 0.10
    year_3_loss: 0.15
    year_4_loss: 0.18
    year_5_loss: 0.20
    terminal_loss: 0.22
    post_loe_sgna_fraction: 0.10

  adc:
    # Treat like biologic: complex manufacturing limits generic entry speed
    year_1_loss: 0.25
    year_2_loss: 0.50
    year_3_loss: 0.65
    year_4_loss: 0.72    # Year 4
    year_5_loss: 0.76    # Year 5
    terminal_loss: 0.78
    post_loe_sgna_fraction: 0.25

  rna_therapy:
    year_1_loss: 0.15
    year_2_loss: 0.35
    year_3_loss: 0.55
    year_4_loss: 0.63    # Year 4
    year_5_loss: 0.67    # Year 5
    terminal_loss: 0.70
    post_loe_sgna_fraction: 0.25

  other:
    year_1_loss: 0.40
    year_2_loss: 0.65
    year_3_loss: 0.80
    year_4_loss: 0.88
    year_5_loss: 0.92
    terminal_loss: 0.95
    post_loe_sgna_fraction: 0.25


# ==============================================================================
# Competition (Step 7)
# ==============================================================================
#
# Penetration haircuts applied when RevenueModel adjusts peak_penetration
# for competitive landscape at launch. Applied per approved competitor
# present at our launch year.
#
# JUDGMENT CALLS — these are directional priors for default behavior.
# Asset-specific competitive dynamics should override via CommercialSegment
# and CompetitionModel rather than relying on these defaults.

competition:
  penetration_haircut_per_competitor:
    first_competitor:   0.15   # Entering a 1-competitor market: -15% to peak penetration
    each_additional:    0.10   # Each competitor beyond the first: -10%
    maximum_total:      0.50   # Hard floor: model always retains ≥50% of modeled penetration


# ==============================================================================
# POS model Layer 1 caps
# ==============================================================================
#
# Layer 1 (POSAdjusters) had no combined cap before Sprint 9.
# Maximum theoretical stacked upward adjustment was +1.80 log-odds, pushing a
# 32% oncology Phase 2 base to ~62% — implausible for any indication.
#
# The cap applies to the ADJUSTMENT relative to the base rate (not the absolute
# log-odds), so the TA prior is preserved and only analyst qualitative input is
# bounded. +0.80 log-odds at 32% Phase 2 base → ~47% adjusted POS — aggressive
# but not impossible for a biomarker-selected Breakthrough-designated asset.
#
# btd_logodds: Breakthrough Therapy Designation is a PROCESS designation.
# Primary effect is faster review, not higher binary approval probability.
# Prior literature shows no significant PoS lift once controlling for indication
# and target quality. Value reduced from +0.20 to +0.05 (Sprint 9).

pos_model:
  layer1_cap_logodds_positive:  0.80   # max combined upward adjustment (Sprint 9; was uncapped)
  layer1_cap_logodds_negative: -0.80   # symmetric downward cap
  btd_logodds: 0.05                    # was 0.20; BTD = process, not probability
  accelerated_approval_nda_discount: 0.18
  # Discount applied to base NDA/BLA success rate for accelerated approval programs.
  # AA programs using single-arm surrogate endpoints have historically faced ~15-20%
  # post-market withdrawal/conversion failure rate (FDA AA withdrawal data 2013-2023).
  # This discount is applied at the NDA/BLA phase only, as a base-rate correction
  # (not a log-odds adjuster). Source: Darrow JJ et al. (2021) JAMA Internal Medicine.


# ==============================================================================
# Trial design log-odds adjustments (Phase 1A)
# ==============================================================================
#
# EVIDENCE-INFORMED PRIORS — not statistically estimated coefficients.
# Direction is supported by literature where cited. Magnitude is a JUDGMENT
# CALL in all cases. A 10-15pp swing in POS is plausible given real-world
# differences in endpoint and design quality, but exact values are not
# regression outputs.
#
# Double-counting caution:
#   ApprovalPathway.breakthrough_designation overlaps with
#   POSAdjusters.has_breakthrough_designation. Use one, not both.
#   Run check_pos_layer_overlap() to audit any combination.

trial_design:

  logodds:

    evidence_design_quality:
      # Dimension 1: How trustworthy and bias-controlled is the evidence package?
      # Direction: FDA Evidentiary Standards (CDER 2019); Blumenthal GM et al. (2017)
      #   single-arm Phase 2→3 translation ≈ 40% relative reduction → ~-0.45 log-odds.
      # Note: single-arm trials are standard at Phase 1 and appropriate in rare/refractory
      #   oncology. Phase-conditional scaling attenuates penalties at earlier phases.
      rct_double_blind:       0.20   # Randomized, double-blind, active/placebo-controlled
      rct_open_label:         0.10   # Randomized controlled, open-label
      rct_weak_comparator:   -0.05   # Randomized but weak/non-standard comparator
      single_arm_objective:  -0.10   # Single-arm with objective endpoint (ORR, PFS)
      single_arm_subjective: -0.30   # Single-arm with subjective endpoint (high bias risk)
      registry_observational: -0.35  # Registry / external control / observational

    comparator_fit:
      # Dimension 2: Does the comparator match current clinical practice?
      # A mismatched comparator limits regulatory interpretability even in an RCT.
      matches_soc:           0.10   # Comparator matches current standard of care
      placebo_acceptable:    0.05   # Placebo acceptable (no good SoC exists)
      acceptable_not_ideal:  0.00   # Baseline: comparator acceptable but not ideal
      outdated_comparator:  -0.15   # Comparator outdated or clinically weak
      no_valid_comparator:  -0.30   # No valid comparator where one is expected

    regulatory_pathway_risk:
      # Dimension 3: How much interpretability / confirmatory risk does the pathway add?
      # Note: BTD is in Layer 1 (POSAdjusters.has_breakthrough_designation) only.
      standard:                         0.00   # Standard approval path, accepted precedent
      orphan_rare_disease:              0.10   # Orphan / rare disease regulatory flexibility
      accelerated_validated_surrogate: -0.05   # Accelerated approval, validated surrogate
      accelerated_novel_surrogate:     -0.20   # Accelerated approval, novel/uncertain surrogate
      no_clear_precedent:              -0.30   # No clear regulatory precedent

  cap_logodds_positive:  0.30   # Asymmetric: good design helps, but modestly
  cap_logodds_negative: -0.60   # Bad design can seriously hurt interpretability

  phase_scaling:
    # Single multiplier per phase — design evidence matters more as drug approaches approval.
    # At Phase 1: design quality is almost irrelevant; single-arm is universal.
    # At Phase 3: every design choice directly determines FDA approval probability.
    phase_1: 0.20
    phase_2: 0.50
    phase_3: 1.00
    nda_bla:  0.90

# ==============================================================================
# Pre-readout trial design scoring
# Used by TrialDesignFeatureExtractor to produce pre-readout AssumptionChangeProposals.
# All thresholds are JUDGMENT CALLS — no literature directly calibrates these.
# ==============================================================================

pre_readout_scoring:

  # Maximum absolute PoS change (percentage points) from a single pre-readout assessment.
  design_scoring_max_update_pp: 0.15

  # Trials with estimated power below this threshold receive a log-odds penalty.
  low_power_threshold: 0.70

  # Log-odds penalty scale for underpowered trials.
  # Penalty = -scale × (power_gap / threshold); max penalty at power=0 is -scale.
  low_power_logodds_penalty_scale: 0.20

  # If prior_phase_effect > multiplier × historical_effect_size_default,
  # use prior_phase_effect for power calculation and suppress the power penalty.
  breakthrough_effect_multiplier: 1.5

  # bound_pct for AssumptionChangeProposal (BOUNDED mode always → ReviewQueue).
  proposal_bound_pct: 50.0

  # Historical median enrollment per TA and phase (used when CT enrollment unknown).
  historical_median_n:
    oncology:
      phase_2: 180
      phase_3: 420
    rare_disease:
      phase_2: 80
      phase_3: 200
    cns:
      phase_2: 200
      phase_3: 500
    default:
      phase_2: 150
      phase_3: 380

  # Default effect size used in power calculation when prior_phase_effect is unavailable.
  # Corresponds to a standardized mean difference (Cohen's d) or hazard-ratio delta.
  historical_effect_size_default: 0.15

# ==============================================================================
# Phase 2 → Phase 3 Bayesian PoS correlation
# Used by PhaseCorrelationUpdater to update Phase 3 priors from prior-phase signals.
# All values are EVIDENCE-INFORMED PRIORS — not statistically estimated.
# ==============================================================================

phase_correlation:

  # Sigmoid likelihood: P(Phase 3 success | z) = σ(alpha + beta * z)
  # alpha=0.0: at z=0 (neutral Phase 2), likelihood=0.5 (no update to prior)
  # beta=0.50: moderate slope; z=2 → likelihood≈0.73; z=-2 → likelihood≈0.27
  alpha: 0.0
  beta:  0.50

  # Maximum absolute PoS change (pp) from a single Phase 2 update.
  max_update_pp: 0.25

  # Z-score shrinkage factor for single-arm (non-randomized) Phase 2 trials.
  # Rationale: single-arm results are systematically optimistic (no control arm).
  single_arm_z_shrinkage: 0.60

  # Phase 1 safety-only path: smaller sigmoid slope and tighter cap.
  phase1_beta: 0.25
  phase1_max_update_fraction: 0.33   # Phase 1 cap = max_update_pp × fraction ≈ 8pp

  # bound_pct for AssumptionChangeProposal (BOUNDED → always → ReviewQueue).
  # Set higher than Wave 4 (80 vs 50) because 25pp absolute cap already controls
  # Phase 2 updates; the relative bound should not be the binding constraint.
  proposal_bound_pct: 80.0

# ==============================================================================
# Wave 3: Enrollment quality benchmarks and alert thresholds
# Used by EnrollmentSnapshotExtractor to flag slow-enrolling trials.
# All values are EVIDENCE-INFORMED PRIORS.
# ==============================================================================

# ==============================================================================
# Capital Structure — raise sizing and liquidity constraints
# Wave 7: dilution-adjusted EV and capital risk flags
# ==============================================================================
#
# buffer_months: target post-raise cash runway (standard institutional requirement)
# adv_multiplier_*: max single offering as a multiple of average daily dollar volume
#   Small-cap biotechs (<$500M mktcap) face stricter liquidity limits
# multi_offering_discount_increment: each additional offering adds this to the discount
# max_effective_discount: absolute ceiling on blended discount regardless of size
# risk_thresholds: gap_months (shortfall) thresholds for MEDIUM vs HIGH classification

capital_structure:

  buffer_months:                     12.0  # standard post-raise cash target
  min_raise_months:                   3    # floor: never model < 3 months of burn
  adv_multiplier_small_cap:          20.0  # cap < $500M: max single raise = 20× ADV
  adv_multiplier_large_cap:          30.0  # cap ≥ $500M: max single raise = 30× ADV
  multi_offering_discount_increment: 0.05  # +5% per additional offering
  max_effective_discount:            0.35  # 35% ceiling on blended discount

  risk_thresholds:
    medium_gap_months: 0   # gap > 0 → MEDIUM
    high_gap_months:   6   # gap > 6 months → HIGH (before liquidity check)

  # CAPITAL_RISK_HIGH alert: fire when risk is HIGH/CRITICAL and within this window
  alert_window_months: 12

catalyst_calendar:

  # Lag from CT primary_completion_date to estimated public disclosure.
  # Units: calendar days (data lock + analysis + abstract/presentation preparation).
  readout_lag_days_min:     120
  readout_lag_days_max:     270
  readout_lag_days_default: 180

  # Signal-strength display threshold.  Catalysts below this absolute value are
  # classified as "near-fair" and should not drive ranking decisions.
  min_displayable_signal_strength: 0.03

  # Floor multiplier for std_dev when computing signal_strength.
  # std_floor = max(std_dev, abs(ev) × multiplier) prevents division by near-zero
  # std_dev when the binary outcomes are nearly symmetric around the current value.
  std_floor_multiplier: 0.50

  # Urgency multiplier: days_to_catalyst window triggering the score boost.
  catalyst_urgency_window_days: 60
  catalyst_urgency_decay_days:  30   # half-life of the urgency boost

  # CATALYST_APPROACHING alert threshold.
  catalyst_alert_days_ahead:       30     # fire alert within N days of catalyst
  catalyst_alert_min_delta_ev_abs: 100.0  # |delta_ev| must exceed $100M

# ==============================================================================
# Endpoint Benchmarking — shrinkage priors
# Wave 6: z-score positioning against approved-drug reference class
# ==============================================================================
#
# prior_std: per-endpoint prior standard deviation added in quadrature to the
#   sample std of the approved-drug distribution.  Guards against overconfident
#   z-scores when the reference class is small (n < 5).
#
# Values reflect typical within-class variation for each endpoint type based on
# historical approval distributions.  Conservative (larger) priors increase
# shrinkage and dampen extreme z-scores for sparse reference classes.

endpoint_benchmarking:

  prior_std:
    orr:     0.13   # ORR varies widely across indications; moderate prior
    pfs_hr:  0.10   # HR endpoints are tighter; smaller prior
    os_hr:   0.08   # OS HR even tighter; smallest prior
    cr_rate: 0.11   # CR rate has moderate within-indication spread
    pasi90:  0.12   # PASI90 spread moderate across IL-17/IL-23 agents
    acr50:   0.10   # ACR50 moderately tight in RA
    efs_hr:  0.09   # EFS HR (peds/heme): tight
    default: 0.12   # conservative fallback for unlisted endpoint types

enrollment_quality:

  # Fraction of sites that must be recruiting before a site-stalling alert fires.
  # Rationale: < 30% of activated sites recruiting → meaningful risk of delay.
  recruiting_ratio_warning_threshold: 0.30

  # Velocity alert: fire when pace < this fraction × benchmark.
  # 0.40 = warn when enrolment pace falls below 40% of historical median.
  velocity_ratio_warning_threshold: 0.40

  # Slippage threshold in months triggering an ENROLLMENT_UPDATE event.
  slippage_alert_months: 2.0

  # Site count guard: use CV-based threshold only when ≥ this many sites.
  # When fewer sites, use max_activation_delay_days absolute threshold instead.
  min_sites_for_cv_threshold: 10

  # Absolute max acceptable activation delay for small-site trials (< 10 sites).
  max_activation_delay_days: 180

  # CV threshold for site activation delays (IQR / median).
  # CV > 1.0 → highly heterogeneous activation → flag.
  activation_delay_cv_threshold: 1.0

  # Benchmark enrollment velocity by therapeutic area and phase.
  # Units: patients enrolled per site per month (industry median).
  # Source: IQVIA site performance benchmarks; internal calibration.
  benchmark_patients_per_site_per_month:

    default:
      phase_2: 0.60
      phase_3: 0.40

    oncology:
      phase_2: 0.45
      phase_3: 0.30

    rare_disease:
      phase_2: 0.30
      phase_3: 0.25

# ==============================================================================
# Competitor Impact — temporal decay and MoA propagation priors
# Wave 2: Competitor Catalyst Linking
# ==============================================================================
#
# tau_years: characteristic decay time (in years) for how quickly a competitor
#   readout's impact is absorbed by the market before our own readout.
#   Shorter tau → faster decay → less residual impact by our readout.
#   Longer tau → market is slower to price in competitor data.
#
# Source: internal calibration; directional only (no published benchmarks).

competitor_impact:

  # Temporal decay half-lives by indication
  tau_years:
    oncology:       1.2   # fast-moving field; market re-rates quickly
    rare_disease:   2.0   # slow to update; limited precedent
    cardiovascular: 1.5
    immunology:     1.3
    cns:            1.8
    default:        1.5

  # MoA propagation priors: fractional rNPV changes applied with decay
  #
  # pos_delta_competitor_failure: same-MoA efficacy failure → our PoS increase
  # pos_delta_competitor_failure_safety: same-MoA safety failure → our PoS decrease
  # market_share_delta_competitor_success: competitor succeeds → our share compressed
  # market_share_delta_competitor_failure: competitor fails → our share expands
  pos_delta_competitor_failure:           0.05   # +5% rNPV on same-MoA efficacy fail
  pos_delta_competitor_failure_safety:   -0.03   # -3% rNPV on same-MoA safety fail
  market_share_delta_competitor_success: -0.08   # -8% rNPV on competitor success
  market_share_delta_competitor_failure:  0.05   # +5% rNPV on different-MoA failure

  # Neutral prior for competitor PoS when we have no view
  competitor_default_pos: 0.50

  # Floor guard on std_dev (same as catalyst_calendar)
  std_floor_multiplier: 0.50

# ==============================================================================
# Composite Scoring Weights — v2.0 signal layer
# Wave K: ActionableGenerator extended scoring
# ==============================================================================
#
# These weights control how much each additive signal layer shifts the
# composite score.  Base composite = ranking×0.50 + thesis×0.30 + opp×0.20.
# Signal adjustments are additive and logged per-opportunity for attribution.
#
# catalyst_ev:
#   Multiplied by CatalystEvent.signal_strength (clipped to ±1).
#   High positive signal_strength (EV >> std) lifts the composite.
#   Default 0.15 → max lift/drag of ±0.15 from a ±1 clipped signal.
#
# enrollment:
#   Multiplied by flag penalty totals:
#     site_stalling OR velocity_low  → −0.05 each
#     slippage_alert                 → −0.10
#   Default 1.00 → penalties applied at face value.
#
# phase_correlation:
#   Multiplied by (posterior_pos − prior_pos) delta from PhaseCorrelationUpdater.
#   Delta is bounded ±0.25 by the updater.
#   Default 0.25 → max ±0.0625 contribution.
#
# endpoint_z:
#   Multiplied by EndpointEvaluation.z_score (clipped to ±2).
#   EXCELLENT readout (z ≈ 2) adds +0.10; BELOW_SOC (z ≈ −2) removes −0.10.
#   Default 0.05 → max ±0.10 contribution.
#
# competitor_impact:
#   Mean competitor signal_strength (clipped to ±1), negated.
#   High competitor signal_strength → drag on our composite.
#   Default 0.05 → max ±0.05 contribution.
#
# capital_risk:
#   Multiplied by risk discount per level:
#     LOW = 0.00, MEDIUM = −0.03, HIGH = −0.08, CRITICAL = −0.15
#   Default 1.00 → discounts applied at face value.

scoring_weights:
  catalyst_ev:        0.15
  enrollment:         1.00
  phase_correlation:  0.25
  endpoint_z:         0.05
  competitor_impact:  0.05
  capital_risk:       1.00

# LLM extraction confidence thresholds (Task 9.17 — Sprint 9 Phase 4)
# IMPORTANT: These thresholds are PROVISIONAL and uncalibrated.
# Calibration requires ≥ 200 labeled signal outcomes (forecast_records with
# resolved=1). Until that threshold is reached, confidence_calibration_status
# in CalibrationReport will read "uncalibrated" as an explicit audit flag.
# Do NOT tune these values without running Platt scaling or isotonic regression
# on predicted_confidence vs outcome_correct.
llm_extraction:
  discard_threshold:  0.30   # signals below this are discarded entirely
  review_threshold:   0.50   # 0.30–0.50: routed to ReviewQueue for human review
  auto_threshold:     0.50   # ≥ 0.50: auto-processed (sampled for QA)
  calibration_status: "uncalibrated"
  calibration_required_n: 200

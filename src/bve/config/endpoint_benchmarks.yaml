          - {name: acalabrutinib_obi,      value: 0.27, year: 2021}
          - {name: venetoclax_obinutuzumab, value: 0.35, year: 2019}
          - {name: zanubrutinib,           value: 0.35, year: 2023}

      orr:
        soc_baseline: 0.60
        approved_drugs:
          - {name: ibrutinib,              value: 0.86, year: 2016}
          - {name: acalabrutinib,          value: 0.88, year: 2019}
          - {name: venetoclax_rituximab,   value: 0.92, year: 2018}
          - {name: zanubrutinib,           value: 0.94, year: 2023}

immunology:

  plaque_psoriasis:

    first_line:

      pasi90:
        # Moderate-to-severe plaque psoriasis PASI 90 response at wk 12–16

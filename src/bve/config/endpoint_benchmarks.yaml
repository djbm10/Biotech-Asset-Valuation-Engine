        soc_baseline: 0.04
        approved_drugs:
          - {name: secukinumab,           value: 0.59, year: 2015}
          - {name: ixekizumab,            value: 0.68, year: 2016}
          - {name: guselkumab,            value: 0.73, year: 2017}
          - {name: risankizumab,          value: 0.75, year: 2019}
          - {name: bimekizumab,           value: 0.86, year: 2023}
          - {name: spesolimab,            value: 0.54, year: 2022}

  rheumatoid_arthritis:

    second_line:

      acr50:
        # MTX-IR RA ACR50 at 24 weeks
        soc_baseline: 0.14
        approved_drugs:
          - {name: adalimumab,            value: 0.36, year: 2002}
          - {name: abatacept,             value: 0.36, year: 2005}
          - {name: tocilizumab,           value: 0.44, year: 2010}
          - {name: baricitinib,           value: 0.49, year: 2017}
          - {name: upadacitinib,          value: 0.56, year: 2019}
          - {name: filgotinib,            value: 0.44, year: 2020}

rare_disease:

  sma:

    first_line:

      # Spinal Muscular Atrophy: use motor function milestone acquisition as proxy
      # Representing as proportion achieving independent sitting (HINE or CHOP INTEND)
      cr_rate:
        # cr_rate repurposed: proportion achieving independent sitting (SMA type 1)
        soc_baseline: 0.00
        approved_drugs:
          - {name: nusinersen,            value: 0.51, year: 2016}
          - {name: onasemnogene,          value: 0.92, year: 2019}
          - {name: risdiplam,             value: 0.58, year: 2020}

  dmd:

    first_line:

      # Duchenne Muscular Dystrophy: 6MWT stabilization (% retaining within 10% of baseline)
      # Approximated as orr-type endpoint for benchmarking
      orr:
        soc_baseline: 0.30
        approved_drugs:
          - {name: eteplirsen,            value: 0.50, year: 2016}
          - {name: golodirsen,            value: 0.54, year: 2019}
          - {name: viltolarsen,           value: 0.52, year: 2020}
          - {name: casimersen,            value: 0.53, year: 2021}
          - {name: delandistrogene,       value: 0.68, year: 2023}

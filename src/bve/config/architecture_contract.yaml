six_question_contract:
  - question_id: 1
    question: What is this asset?
    primary_modules:
      - entities
      - normalization
      - connectors
      - ingestion
      - dossier
  - question_id: 2
    question: How good is the science and trial design?
    primary_modules:
      - models
      - features
      - empirical
      - similarity
  - question_id: 3
    question: What is the real probability of success?
    primary_modules:
      - models
      - empirical
      - intelligence
  - question_id: 4
    question: What is it worth?
    primary_modules:
      - valuation
      - analysis
      - models
  - question_id: 5
    question: What is the market pricing in?
    primary_modules:
      - analysis
      - intelligence
      - event_study
  - question_id: 6
    question: What should I do now?
    primary_modules:
      - intelligence
      - alerts
      - pipeline
      - ops


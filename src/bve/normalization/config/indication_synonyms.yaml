# Canonical indication registry
# Each entry: id, name, therapeutic_area, aliases[]
# Aliases are matched case-insensitively after whitespace normalization.
# Compound strings (e.g. "UC and Crohn's disease") are listed as aliases on
# the closest single canonical, or on a combined IND where clinically sensible.
#
# id convention: IND_<snake_case_name>
# therapeutic_area values must match TherapeuticArea enum values in bve.entities.asset


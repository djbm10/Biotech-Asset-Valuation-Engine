bve-review-events        = "bve.cli.review_events_cli:main"
bve-validate-universe    = "bve.cli.validate_universe_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "stress: marks tests as large-scale stress tests (deselect with -m 'not stress')",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bve"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "requests>=2.31",
    "yfinance>=0.2",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies.platform]
description = "Full platform stack (API + background jobs)"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "dramatiq[redis]>=1.17",
    "redis>=5.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev     = ["pytest>=7", "pytest-cov", "ruff", "mypy"]
extract = [
    "anthropic>=0.25",      # AnthropicClient LLM backend
    "openai>=1.30",         # OpenAIClient LLM backend
    "httpx>=0.27",          # Optional fast HTTP client for connectors
]
review = [
    "streamlit>=1.35",      # Wave 4A — Review Queue UI
    "pandas>=2.0",          # Already a core dep; listed here for clarity
]

[project.scripts]
bve-asset      = "bve.cli.run_asset:main"
bve-batch      = "bve.cli.run_batch:main"
bve-portfolio  = "bve.cli.run_portfolio:main"
bve-extract    = "bve.cli.extract:main"
bve-review-phase2 = "bve.cli.review_phase2:main"
bve-watchlist-run = "bve.cli.watchlist_run:main"
bve-replay-documents = "bve.cli.replay_documents:main"
bve-rank             = "bve.cli.rank:main"
bve-alert-test       = "bve.cli.alert_test:main"
bve-replay-document  = "bve.cli.replay_document:main"
bve-rebuild-dossiers = "bve.cli.rebuild_dossiers:main"
bve-compute-event-scores = "bve.cli.compute_event_scores:main"
bve-calibration-report   = "bve.cli.calibration_report:main"
bve-audit-log            = "bve.cli.audit_log:main"
bve-weekly-brief         = "bve.cli.weekly_brief:main"
bve-portfolio-rank       = "bve.cli.portfolio_rank:main"
bve-literature-review    = "bve.cli.literature_review:main"
bve-competitive-landscape = "bve.cli.competitive_landscape:main"
bve-research-report      = "bve.cli.research_report:main"
bve-investment-memo      = "bve.cli.investment_memo:main"
bve-service              = "bve.cli.service_control:main"
bve-generate-config      = "bve.cli.generate_config:main"
bve-run-asset            = "bve.cli.run_asset:main"
bve-data-quality         = "bve.cli.data_quality_report:main"
bve-portfolio-backtest   = "bve.cli.portfolio_backtest:main"
bve-opportunities        = "bve.cli.opportunities:main"
bve-catalyst-calendar    = "bve.cli.catalyst_calendar:main"
bve-acquisition-screen   = "bve.cli.acquisition_screen:main"
bve-screen               = "bve.cli.screen:main"
bve-acquirer-fit         = "bve.cli.acquirer_fit:main"
bve-ma-probability       = "bve.cli.ma_probability:main"
bve-universe-screen      = "bve.cli.universe_screen:main"
bve-note                 = "bve.cli.note_entry:main"
bve-daily-brief          = "bve.cli.daily_brief:main"
bve-recalibrate          = "bve.cli.recalibrate:main"
bve-seed-catalysts       = "bve.cli.seed_catalysts:main"
bve-seed-replay-events   = "bve.cli.seed_replay_events:main"
bve-seed-replay-claims   = "bve.cli.seed_replay_claims:main"
bve-claim-resolve        = "bve.cli.claim_resolve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "stress: marks tests as large-scale stress tests (deselect with -m 'not stress')",
]

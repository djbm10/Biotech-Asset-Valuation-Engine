# As-of evidence snapshot: Vertex Pharmaceuticals / VX-770 (ivacaftor)
# Analysis date: January 2010
# ===========================================================================
# This file documents what was knowable at the analysis date from contemporaneous
# public sources. Nothing in this file uses hindsight. Each assumption is tagged
# with its source and a confidence rating.
#
# Purpose: enable reproducible "as-of" validation — any analyst with the sources
# listed here and no other information should be able to reproduce the 2010 model.

asof_date: "2010-01-01"
company: "Vertex Pharmaceuticals"
ticker: "VRTX"
drug: "VX-770 (ivacaftor)"
indication: "Cystic fibrosis — G551D gating mutation"
analysis_phase: "phase_3 (STRIVE enrolling; Phase 2 data public)"

# ---------------------------------------------------------------------------
# What was knowable at analysis date — with specific source citations
# ---------------------------------------------------------------------------

knowable:
  indication_and_target:
    description: "CF G551D gating mutation; CFTR potentiator mechanism"
    source: "Vertex 8-K January 2009 announcing Phase 2 initiation; NEJM 2010 Van Goor et al."
    confidence: High
    notes: >
      G551D mechanism was well-understood from basic science by 2010.
      CFTR channel dysfunction in G551D is a gating defect (channel present but
      fails to open), distinct from F508del (trafficking defect). Ivacaftor
      opens the gating-defective channel — mechanism was public from Vertex's
      Phase 2 IND rationale.

  patient_population:
    addressable_patients_annual: 1200
    derivation: >
      CF Foundation Patient Registry 2009 Annual Report: ~30,000 US CF patients.
      G551D mutation frequency: 4.7% of alleles (Cystic Fibrosis Mutation Database
      2009). ~1,410 patients total; ages 12+ (initial label): ~85% = ~1,200.
    source: "CF Foundation Patient Registry Annual Data Report 2009 (public)"
    confidence: High
    notes: >
      CF Foundation genotyping data is unusually accurate for a rare disease —
      the Foundation ran a national patient registry. G551D frequency was
      well-characterized by 2010 because genotyping was standard of care.
      This is one of the best-sourced patient population estimates possible.

  phase_2_efficacy_signal:
    description: "STRIVE Phase 2 data: FEV1 +10.4pp; sweat chloride near-normalization"
    source: >
      Van Goor F et al. (2009) Rescue of CF airway epithelial cell function
      in vitro by a CFTR potentiator, VX-770. PNAS; AND
      Accurso FJ et al. (2010) Effect of VX-770 in persons with cystic
      fibrosis and the G551D-CFTR mutation. NEJM 362:1991-2003.
    confidence: High
    notes: >
      NEJM paper published April 2010 — contained the Phase 2 data available
      at analysis date. SwCl normalization in 90% of patients was the key PD
      signal. FEV1 +10.4pp was the efficacy signal. Both were public by mid-2010.
      PNAS 2009 provided the mechanistic rationale.

  trial_status:
    description: "STRIVE Phase 3 (NCT00909311) enrolling; ENVISION pending"
    source: "ClinicalTrials.gov NCT00909311 first posted 2009-04-27 (public)"
    confidence: High
    notes: >
      STRIVE enrollment was public via ClinicalTrials.gov. Primary endpoint
      (FEV1pp improvement at 24 weeks vs placebo), sample size (161 patients),
      and design (randomized, double-blind, placebo-controlled) were all posted.

  pricing_norms:
    net_price_per_patient_usd_estimate: 235000
    derivation: >
      WAC estimate: $294K/yr (estimated from rare disease orphan pricing comps
      at the time — no launched comp existed). G2N ~20%.
      Comparable orphan drugs 2009-2010: alglucosidase alfa (Myozyme) ~$300K/yr;
      laronidase (Aldurazyme) ~$280K/yr. CF + rare disease + strong efficacy
      signal → orphan tier pricing reasonable.
    source: >
      Myozyme WAC 2009 (Genzyme 10-K); Aldurazyme WAC (BioMarin 10-K 2009).
      Orphan drug pricing benchmarks available in analyst reports (Credit Suisse
      rare disease coverage 2009).
    confidence: Medium
    notes: >
      JUDGMENT CALL. No prior CFTR modulator existed, so pricing was uncertain.
      Analyst in 2010 could justify $200K-350K range. $294K actual WAC at 2012
      launch was at the high end of reasonable estimates. An analyst anchoring
      to the primary care JAK analogue pricing (~$25-50K/yr) would under-predict
      by 5-6x. The key insight was using rare orphan disease comps, not primary
      care comps.

  competitive_landscape:
    description: "No approved CFTR modulators at analysis date"
    source: "FDA Orange Book; Vertex pipeline disclosures"
    confidence: High
    notes: >
      No approved therapies for G551D in January 2010. Standard of care:
      symptomatic treatment (inhaled tobramycin, dornase alfa, airway clearance).
      VX-809 (corrector for F508del) was in Phase 1 at this time (different
      mutation, not competitive). Competitor CFTR modulators were not public.

  financial_position:
    cash_millions: 1400
    source: "Vertex 10-K 2009 (filed February 2010)"
    confidence: High
    notes: >
      Vertex 10-K 2009 showed ~$1.4B cash + investments. The large cash balance
      reflected milestone payments from J&J/Tibotec hepatitis C collaboration.
      Burn rate ~$440M/yr annualized from 2009 10-K R&D + G&A expense.

  market_cap_at_analysis:
    price_jan_2010: 13.00
    shares_outstanding_millions: 244
    market_cap_millions: 3172
    source: "Bloomberg/Yahoo Finance; Vertex 10-K 2009 shares outstanding"
    confidence: High

# ---------------------------------------------------------------------------
# What was NOT knowable at analysis date (explicit hindsight exclusions)
# ---------------------------------------------------------------------------

not_knowable:
  - item: "Phase 3 trial results (STRIVE) — FEV1 +10.6pp, p<0.001"
    actual_disclosure: "NEJM November 2011 (Ramsey et al.)"
    error_if_used: "SURVIVOR BIAS — do not use Phase 3 data in as-of 2010 model"

  - item: "Label expansion to other gating mutations (R117H, etc.) — 2014"
    actual_disclosure: "FDA approval November 2014"
    error_if_used: "Expansion added ~$200M revenue; cannot be modeled in 2010"

  - item: "Orkambi approval (ivacaftor/lumacaftor for F508del) — 2015"
    actual_disclosure: "FDA approval July 2015"
    error_if_used: "Different product; creates VX-770 combination anchor value"

  - item: "Trikafta approval (elexacaftor/tezacaftor/ivacaftor) — 2019"
    actual_disclosure: "FDA approval October 2019"
    error_if_used: "Transforms ivacaftor from standalone to triple-combo anchor"

  - item: "Market cap at FDA approval: ~$14B (Jan 2012)"
    actual_disclosure: "Public market data"
    error_if_used: "This is the outcome; cannot be used in 2010 valuation"

# ---------------------------------------------------------------------------
# Error decomposition (for post-hoc validation reporting)
# ---------------------------------------------------------------------------

error_decomposition:
  primary_error_driver: "Model captures G551D-only; actual Kalydeco revenue includes gating expansion"
  foreseeable_errors:
    - "Patient sizing: ±20% (CF Foundation registry well-characterized)"
    - "Pricing: ±30% if analyst used wrong comparable (orphan vs primary care)"
  unforeseeable_errors:
    - "G551D → gating mutation label expansion (2014): not foreseen at Phase 3 initiation"
    - "Trikafta combination value (2019): modeled as standalone in 2010 (correct)"
  peak_sales_error_attribution:
    model_prediction_g551d_only: "~420M (estimated from config)"
    actual_g551d_only_2013: "480M"
    pct_error_g551d_only: "-12.5%"
    note: >
      The G551D-only model is within 15% of actual G551D-only peak sales.
      Total Kalydeco revenues (including gating expansion) are ~3x larger —
      that gap is entirely from unforeseeable label expansion, not model error.

# Broad acquisition universe for manual biotech M&A research.
#
# This file is intentionally broader than `comparable_deals.yaml`.
# Use it as the sourcing pool, then promote only the best-fit transactions into
# the screenable comp set once EV/peak-sales data is robust enough.
#
# `comp_bucket` guide:
#   - direct_dev_stage: good starting point for single-asset Phase 2/3 or NDA comps
#   - approved_or_commercial: useful context, but often richer than development-stage comps
#   - platform_or_preclinical: strategic precedent, usually not suitable for simple EV/peak medians
#
# `headline_value_millions` is the transaction value stated in the source.
# See `headline_value_basis` and `notes` for upfront/CVR/milestone nuances.


    source_notes: "Curated from AZ investor day materials, Q4 2025 earnings, and public deal history. AZ has been one of the most active pharma acquirers 2020-2026 with Alexion ($39B), Rare Disease expansion, Fusion Pharmaceuticals ($2.4B), and ADC platform build-out. Deal-size bands: $1-5B for platform acquisitions; $5-15B for late-stage/commercial assets; >$15B for transformative (rare/selective)."


    budget:
      as_of_date: "2025-12-31"
      cash_and_marketable_securities_millions: 18865.8
      long_term_debt_millions: 1985.9
      net_cash_millions: 16879.9
      capacity_notes: "Strong net-cash balance sheet, but management has also committed to significant internal deployment including more than $7 billion of ongoing and planned domestic investment plus an additional approximately $2 billion Saratoga Springs manufacturing facility. No explicit hard debt-capacity or max-BD-check limit was disclosed in the cited primary sources."
      source_refs:
        - source_date: "2026-01-30"
          source_type: "earnings_release"
          source_title: "Regeneron Reports Fourth Quarter and Full Year 2025 Financial and Operating Results"
          source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-reports-fourth-quarter-and-full-year-2025-financial"
          note: "Reported cash and marketable securities of $18.8658 billion and long-term debt of $1.9859 billion as of December 31, 2025."

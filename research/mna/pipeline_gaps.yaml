        description: "Sanofi co-develops and co-commercializes Dupixent (dupilumab) globally under a profit-share arrangement; Regeneron discovered and retains primary manufacturing. Regeneron bought back global Libtayo (cemiplimab) rights from Sanofi in June 2022 for $900M, fully consolidating oncology economics. Dupixent partnership continues and is the primary revenue driver at $17.8B global FY2025 sales. M&A implication: any immunology acquisition must integrate with the existing Sanofi co-commercialization structure for Dupixent."

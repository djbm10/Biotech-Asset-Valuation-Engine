          - "radiopharmaceutical"
          - "bispecific_antibody"
        budget_ceiling_millions: 8000.0
        rationale: "AZ is the global ADC leader (Enhertu, DATO-DXd, AZD8205). The gap is additional ADC payloads or targets in solid tumors where their existing ADC infrastructure can be deployed. Radiopharma (Fusion Pharmaceuticals acquisition 2024) is a second string. Any novel ADC linker-payload platform or clinical-stage ADC in a high-volume solid tumor indication (NSCLC, TNBC, ovarian, GI) is a primary M&A target."

# Curated acquirer-side pipeline-gap profiles used by the acquirer-fit layer.
#
# Keep every profile:
# - attributable to dated primary sources where possible
# - explicit about whether a gap is LOE-driven, franchise-defense-driven, or a
#   strategic expansion area
# - conservative when deal-value ceilings or debt-capacity limits are not
#   directly disclosed by management

as_of_date: "2026-05-08"

acquirers:
  - acquirer_id: "regeneron"
    company_name: "Regeneron Pharmaceuticals"
    ticker: "REGN"
    profile_as_of: "2026-05-08"
    acquisition_capacity_millions: 2000.0
    source_notes: "Manual curation from Regeneron investor materials, SEC-filed JPMorgan deck, Q4 2025 / Q1 2026 earnings transcripts, and Regeneron press releases. Deal-size bands derived from deal history analysis (Checkmate $250M, Decibel $109M, Telix $40M, 2seventy $5M) and management commentary characterizing transformative M&A as value-destructive. Updated May 2026 to add oncology and hematology TA gaps, siRNA and radiopharmaceutical modality entries, sub-area and budget-ceiling specificity on all TA gaps, Telix / Checkmate / Libtayo deal history, existing partnership records, and acquisition_capacity field."

    therapeutic_area_gaps:
      - therapeutic_area: "ophthalmology"
        exposure_type: "loe_and_franchise_defense"
        exposure_level: "high"
        sub_area: "geographic_atrophy_non_vegf"
        preferred_modality:
          - "fully_human_antibody"
          - "monoclonal_antibody"
          - "fusion_protein"
        budget_ceiling_millions: 3000.0
        rationale: "Ophthalmology is Regeneron's clearest franchise-defense gap. U.S. EYLEA HD + EYLEA sales declined 27% in FY2025 as biosimilars entered. The specific unmet gap is a non-VEGF treatment for Geographic Atrophy — a condition where VEGF inhibition is largely ineffective. Complement inhibitors (C1q, C3) and HtrA1 inhibitors address GA biology that EYLEA does not. An acquired GA asset would slot directly into the existing EYLEA retinal sales force, minimizing commercial overlay costs. Sustained-release delivery platforms (hydrogel, bioerodible implant) allowing >6-month dosing are a secondary target to neutralize injection-fatigue competition."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_release"
            source_title: "Regeneron Reports Fourth Quarter and Full Year 2025 Financial and Operating Results"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-reports-fourth-quarter-and-full-year-2025-financial"
            note: "FY2025 U.S. EYLEA HD + EYLEA sales down 27% vs FY2024. Geographic Atrophy named as a key indication for retinal franchise extension."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Positioned EYLEA HD as the standard in retinal disease; highlighted broader retinal disease pipeline and label expansion."

      - therapeutic_area: "oncology"
        exposure_type: "strategic_expansion"
        exposure_level: "high"
        sub_area: "io_combination_warhead"
        preferred_modality:
          - "radiopharmaceutical"
          - "adc"
          - "bispecific_antibody"
        budget_ceiling_millions: 1500.0
        rationale: "Oncology is Regeneron's second strategic growth pillar. Management is building a dominant position in retargeted immune therapies — T-cell engagers (CD3), costimulatory bispecifics (CD28), and radiopharmaceuticals — anchored to the Libtayo PD-1 foundation. The April 2026 Telix radiopharma collaboration confirms appetite for oncology warhead modalities that pair with Regeneron's targeting antibodies. The specific gap is a platform or clinical-stage asset that delivers lethal payloads (radioligand, ADC payload, bispecific retargeting) to tumors currently unresponsive to Libtayo monotherapy. Targets with Phase 1 safety and tumor-uptake data in solid tumors are the primary acquisition archetype."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "Management highlighted fianlimab (LAG-3), CD3/CD28 costimulatory bispecifics, and radiopharmaceuticals as key oncology growth areas."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "xCD3 and xCD28 oncology bispecifics described as a core combination-medicine strategy anchored to cemiplimab/Libtayo."

      - therapeutic_area: "immunology_inflammation"
        exposure_type: "franchise_defense"
        exposure_level: "medium"
        sub_area: "oral_type2_inflammation"
        preferred_modality:
          - "small_molecule"
          - "monoclonal_antibody"
        budget_ceiling_millions: 1500.0
        rationale: "Dupixent ($17.8B global FY2025 sales) faces emerging competition from oral IL-4/IL-13 pathway and oral JAK-targeted agents in atopic dermatitis and asthma. The specific gap is an oral inhibitor — or an ultra-long-acting biologic reducing injection frequency to quarterly or less — that addresses patients who prefer oral dosing. This is the only TA where Regeneron's modality preference expands to small molecules. Key requirement: no JAK-like black box risk. Dupixent IP runway extends to 2031+ which reduces urgency compared to the ophthalmology gap, but the oral threat is real and growing."
        notes: "A small molecule acquisition here would be uniquely motivated by competitive defense, not platform synergy. Safety profile is the primary gate: any black box risk makes the asset a non-starter as a Dupixent complement."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "Highlighted long-acting IL-4R, IL-13, IL-4/IL-13 bispecific programs and next-generation biologics for type 2 inflammation as the primary internal response to competition."

      - therapeutic_area: "obesity_metabolic"
        exposure_type: "strategic_expansion"
        exposure_level: "high"
        sub_area: "muscle_sparing_anabolic"
        preferred_modality:
          - "monoclonal_antibody"
          - "bispecific_antibody"
        budget_ceiling_millions: 1200.0
        rationale: "Obesity is Regeneron's most urgent new strategic pillar. Having secured an incretin anchor via the Hansoh GLP-1/GIP in-license (olatorepatide, Phase 3), the next gap is explicitly a muscle-preserving anabolic agent — a myostatin, GDF8, or activin inhibitor — that pairs with the incretin to ensure quality of weight loss (fat loss without muscle loss). Regeneron already has internal myostatin work (trevogrumab, Phase 2) and activin programs; a bolt-on Phase 2 asset with validated fat-vs-muscle differentiation data would enable a triple-therapy positioning that Lilly and Novo Nordisk cannot currently replicate. This gap is NOT for another incretin or GLP-1 — that slot is filled."
        source_refs:
          - source_date: "2025-06-02"
            source_type: "press_release"
            source_title: "Regeneron Expands Clinical-Stage Obesity Portfolio with Strategic In-Licensing of Novel Dual GLP-1/GIP Receptor Agonist"
            source_url: "https://investor.regeneron.com/node/31066/pdf"
            note: "Hansoh deal framed around quality of weight loss, muscle preservation, and comorbidities. Signals the incretin slot is filled and next priority is a combination muscle-sparing partner."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Obesity combinations positioned as a differentiated growth opportunity emphasizing quality of weight loss."

      - therapeutic_area: "hematology"
        exposure_type: "franchise_extension"
        exposure_level: "medium"
        sub_area: "anticoagulation_factor_xi_or_heme_onc_bispecific"
        preferred_modality:
          - "monoclonal_antibody"
          - "bispecific_antibody"
        budget_ceiling_millions: 1000.0
        rationale: "Regeneron has two internal Factor XI antibodies (REGN7508/REGN9933) in Phase 3 anticoagulation and a growing heme-oncology bispecific franchise (linvoseltamab for MM, odronextamab for B-NHL). M&A here would target either: (a) a specialized Factor XI inhibitor with proof-of-concept data showing zero major bleeds in high-risk patients, enabling the world's safest anticoagulant franchise; or (b) a bispecific or next-generation cell therapy asset in Multiple Myeloma or Lymphoma that consolidates market position around linvoseltamab and odronextamab. Urgency is medium — internal programs are advanced but consolidation of adjacent assets is strategically logical."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "Linvoseltamab approval in multiple myeloma and odronextamab pivotal progression in B-NHL highlighted as hematology growth drivers."

      - therapeutic_area: "genetic_medicines_rare_disease"
        exposure_type: "strategic_expansion"
        exposure_level: "medium"
        sub_area: "rgc_validated_targets"
        preferred_modality:
          - "sirna"
          - "aav_gene_therapy"
        budget_ceiling_millions: 500.0
        rationale: "Genetic medicines are a stated expansion priority where Regeneron pairs its Regeneron Genetics Center (RGC, 2M+ sequenced individuals) with targeted external assets. M&A urgency is moderate: Regeneron accesses most genetic medicine capabilities through alliances (Alnylam for siRNA, Intellia for CRISPR) rather than outright acquisitions. The primary acquisition pattern is the Decibel model — license and collaborate first, acquire after multi-year partnership de-risks the science to Phase 1/2 human validation. Target profile: a company that has achieved proof-of-concept in a genetic disease target discovered by the RGC but lacks global clinical development scale."
        source_refs:
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Genetics, sequencing, proteomics, and genetic medicines named as core platform pillars."
          - source_date: "2023-08-09"
            source_type: "press_release"
            source_title: "Regeneron to Acquire Decibel Therapeutics, Strengthening Gene Therapy and Hearing Loss Programs"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-acquire-decibel-therapeutics-strengthening-gene/"
            note: "Decibel was a 6-year collaborator. Acquisition directly tied to strengthening genetic medicines. Establishes the collaboration-first, then acquire pattern for this TA."

    preferred_modalities:
      - modality: "bispecific_antibody"
        preference_strength: "high"
        rationale: "Bispecific antibodies are Regeneron's highest-priority external acquisition modality. The VelociSuite platform is purpose-built for engineering bispecifics, and the xCD3 and xCD28 platforms for T-cell retargeting and costimulation are core to the IO strategy. Targets with validated bispecific assets against novel tumor antigens are the easiest to integrate — Regeneron can reformat the antibody arms using its internal platform and pair the asset with Libtayo. Most acquirable archetype from the scanner's perspective."
        source_refs:
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Described antibody and bispecific leadership and xCD3/xCD28 oncology combination platforms."
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "IL-4/IL-13 bispecific programs and CD3/CD28 oncology bispecifics highlighted as strategic priorities."

      - modality: "fully_human_antibody"
        preference_strength: "high"
        rationale: "Fully human monoclonal antibodies are Regeneron's core discovery and manufacturing modality. VelocImmune generates fully human mAbs by design; the internal CMC infrastructure is optimized for large-molecule biologics. Targets with validated mAbs against novel, genetics-backed targets in priority TAs are a natural fit and the lowest-friction path to integration."
        source_refs:
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "VelocImmune antibody leadership and VelociSuite platform called out as core competitive advantages."

      - modality: "sirna_rnai"
        preference_strength: "high"
        rationale: "siRNA is Regeneron's established core third modality alongside antibodies and fusion proteins, de-risked through a decade-long partnership with Alnylam. Cemdisiran (siRNA targeting C5, licensed from Alnylam) is in Phase 3 for myasthenia gravis, PNH, and Geographic Atrophy — the modality is operational, not experimental. Targets with lead siRNA assets addressing a genetically validated indication are directly acquirable, particularly if the genetic target has been independently validated by the RGC. The Alnylam partnership does not create exclusivity on all siRNA — standalone siRNA companies in non-overlapping indications are legitimate targets."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "Cemdisiran (siRNA) highlighted in Phase 3 across multiple indications; Alnylam collaboration described as core to the pipeline."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Genetic medicines and targeted RNA therapy named as a platform-building priority."

      - modality: "radiopharmaceutical"
        preference_strength: "medium"
        rationale: "Radiopharmaceuticals are an emerging strategic pillar confirmed by the April 2026 Telix collaboration. Regeneron's strategic logic is distinct: it provides the targeting antibody moiety via VelocImmune while a partner provides radioligand chemistry and isotope manufacturing. This means Regeneron is most interested in clinical-stage radiopharma assets or platforms where it can own the targeting antibody and out-license or partner the isotope work, rather than building full vertical radiopharmaceutical manufacturing. Phase 1 assets showing tumor-specific uptake in a high-priority oncology indication are the primary screening target."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_call_transcript"
            source_title: "Regeneron Pharmaceuticals Q4 2025 Earnings Conference Call Transcript"
            source_url: "https://investor.regeneron.com/static-files/e1a0c96b-d854-4adb-8508-a2c5ae2e4f70"
            note: "Management highlighted expansion into radiopharmaceuticals as part of the oncology platform-building strategy."

      - modality: "genetic_medicine"
        preference_strength: "medium"
        rationale: "Gene therapy (AAV) is accessed primarily via collaborations (Intellia for CRISPR/Cas9) or selective bolt-on acquisitions of multi-year collaborators (Decibel for AAV hearing loss). The collaboration-first pattern means standalone gene therapy companies are unlikely acquisition targets unless Regeneron has had a prior research relationship. Manufacturing overhead and delivery complexity are meaningful barriers. The asset must address an RGC-validated genetic target in a priority TA and have at least Phase 1 human data."
        source_refs:
          - source_date: "2023-08-09"
            source_type: "press_release"
            source_title: "Regeneron to Acquire Decibel Therapeutics, Strengthening Gene Therapy and Hearing Loss Programs"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-acquire-decibel-therapeutics-strengthening-gene/"
            note: "Used M&A to acquire a 6-year AAV gene therapy collaborator after multi-year partnership de-risked the science."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "Intellia CRISPR collaboration and genetic medicines listed as platform-building priorities."

      - modality: "cell_therapy"
        preference_strength: "medium"
        rationale: "Cell therapy is a selected adjacency, not a core platform. Regeneron created a dedicated internal unit (Regeneron Cell Medicines) via the 2seventy transaction (2024) focused on next-generation CAR-T and TCR programs. First-generation autologous CAR-T is not of interest. Acquisition appetite exists only for next-gen allogeneic or antibody-armored cell therapy platforms where the VelociSuite can provide the targeting moiety. Standalone cell therapy companies without clear antibody-combination potential are unlikely targets."
        source_refs:
          - source_date: "2024-01-30"
            source_type: "press_release"
            source_title: "Regeneron Announces Formation of Regeneron Cell Medicines with the Acquisition of 2seventy bio Platforms and Preclinical and Clinical Programs"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-announces-formation-regeneron-cell-medicines/"
            note: "Created Regeneron Cell Medicines to combine next-gen cell therapies with internal antibody and bispecific capabilities."

      - modality: "data_genomics_platform"
        preference_strength: "medium"
        rationale: "Large-scale human genetics datasets are a core strategic asset via the RGC (2M+ sequenced individuals). The 23andMe bid (2025) showed willingness to use M&A for dataset expansion even when the target had no therapeutic assets. Acquisition of a biobank, clinical genomics database, or consumer genetics platform would expand the RGC's target validation capabilities. These acquisitions are platform plays, not pipeline plays."
        source_refs:
          - source_date: "2025-05-19"
            source_type: "press_release"
            source_title: "Regeneron Enters into Asset Purchase Agreement to Acquire 23andMe for $256 Million"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-enters-asset-purchase-agreement-acquire-23andmer-256/"
            note: "Bid framed as strengthening genetics-guided research. Ultimately withdrew from the reopened bid process, but appetite for genomics data assets remains."
          - source_date: "2025-01-13"
            source_type: "investor_presentation"
            source_title: "J.P. Morgan Healthcare Conference 2025 Strategy & Business Update"
            source_url: "https://www.sec.gov/Archives/edgar/data/872589/000110465925002826/tm253014d1_ex99-2.htm"
            note: "DNA-linked healthcare database and genomics highlighted as a strategic differentiator."

      - modality: "small_molecule"
        preference_strength: "low"
        rationale: "Small molecules are explicitly avoided by Regeneron because they do not leverage the VelociSuite platform, require separate chemistry and manufacturing infrastructure, and do not fit the genetics-validated biologics discovery model. The sole exception is oral inhibitors for type 2 inflammation (atopic dermatitis, asthma) where patient preference for oral dosing creates a strategic need to defend the Dupixent franchise. Outside this narrow context, small molecule acquisitions are not part of the playbook. Any small molecule target must demonstrate no JAK-like black box safety signal."
        source_refs:
          - source_date: "2026-01-30"
            source_type: "earnings_release"
            source_title: "Regeneron Reports Fourth Quarter and Full Year 2025 Financial and Operating Results"
            source_url: "https://investor.regeneron.com/news-releases/news-release-details/regeneron-reports-fourth-quarter-and-full-year-2025-financial"
            note: "2026 R&D pipeline spans biologics, genetic medicines, and radiopharmaceuticals with no new internal small molecule programs. Small molecule avoidance is implicit throughout platform commentary."


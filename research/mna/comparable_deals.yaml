# Curated biotech M&A comparable deals.
#
# Phase 2 is intentionally a manual research workflow. This file is the typed
# handoff between research and code:
#   - 80+ curated deals spanning 2014–2025 across oncology, immunology,
#     neuroscience, cardiovascular, rare disease, and dermatology
#   - keep one item per deal under `deals:`
#   - store `ev_to_peak_sales` directly when raw peak-sales estimates are not
#     published cleanly enough to back-calculate from source materials
#
# Required fields per record:
#   - target_name
#   - indication
#   - phase_at_acquisition
#   - acquirer
#   - deal_date
#   - either `ev_to_peak_sales`, or both `enterprise_value_millions` and
#     `peak_sales_millions`
#
# Optional fields (original):
#   - target_ticker, drug_name, therapeutic_area, ev_to_peak_sales, source, notes
#
# Optional fields (new — deal structure economics):
#   - upfront_millions          Cash paid at signing, net of cash acquired ($M)
#   - total_milestones_millions Sum of all regulatory + commercial milestone payments ($M)
#   - royalty_rate_low          Low end of royalty tier (0-1 scale, e.g. 0.08)
#   - royalty_rate_high         High end of royalty tier (0-1 scale, e.g. 0.14)
#   - total_biobucks            Upfront + milestones (auto-computed if not set)
#   - equity_component_millions Equity stake/consideration ($M), if any
#   - territory                 "global" | "US" | "ex-US" | "EU" | "Asia" | etc.
#   - deal_structure            "M&A" | "licensing" | "co-development" | "option" | "asset_sale"
#   - post_deal_outcome         "approved" | "failed_ph3" | "failed_ph2" |
#                               "discontinued" | "ongoing" | "pending" | "label_expanded"
#   - data_quality              "high"   = SEC-disclosed public company acquisition (proxy/14D-9)
#                               "medium" = press release + analyst consensus at deal close
#                               "low"    = secondary estimate, undisclosed terms
#
# data_quality guidance:
#   high   → Full M&A of public company; deal value from SEC merger proxy or 14D-9;
#             peak_sales from same proxy financial projections or cited analyst note.
#   medium → Deal value from press release; peak_sales from sell-side analyst consensus
#             at deal close, cited by Reuters/Bloomberg/Fierce Pharma.
#   low    → Terms not fully disclosed; peak_sales is internal estimate; use with caution.
#
# Backfill priority: M&A deals where upfront/milestones are SEC-disclosed (highest confidence).
# Leave new fields blank for licensing deals where economics are not publicly disclosed.
#
# Example:
# deals:
#   - target_name: "Example Therapeutics"
#     target_ticker: "EXMP"
#     drug_name: "exampimab"
#     indication: "moderate-to-severe atopic dermatitis"
#     therapeutic_area: "immunology"
#     phase_at_acquisition: "phase_3"
#     acquirer: "Large Pharma"
#     deal_date: "2025-02-14"
#     ev_to_peak_sales: 1.78
#     enterprise_value_millions: 3200
#     peak_sales_millions: 1800
#     source: "Press release + analyst note"
#     notes: "Illustrative schema entry"


      Phase 3 readout de-risks the asset further and raises the price.
      Key catalysts to watch:
        - Phase 2 expansion ORR update (G12D/G12V NSCLC) — ~4 months
        - PDAC combination Phase 2 data — ~6 months
        - Phase 3 design / FDA alignment — ~9 months
      If Phase 2 ORR comes in ≥40% in non-G12C cohorts, re-run this model immediately.
      A positive readout likely triggers acquisition premium compression (Amgen will need
      to pay much more post-data) — deal more likely to happen PRE-Phase 2 readout.


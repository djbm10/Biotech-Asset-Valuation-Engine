manifest_version: "1.0.0"
purpose: source_location_configuration_only
selection_rule: >-
  Population: the engine's tracked company universe (bve.ops.weekly_runner.UNIVERSE), built
  for the weekly BD loop long before this source existed. Draw: the first 20 tickers by
  sha256("bve-company-pipeline-tranche-1:<ticker>"), reproduced by
  scripts/se_select_company_tranche.py. The ordering depends on the ticker and on nothing
  else, so no company was included or excluded for the programs it runs.
selection_frozen_at: "2026-09-20"
notes:
  - URLs identify official company locations and are not benchmark asset-name acquisition seeds.
  - Generic discovery queries remain derived only from the buyer target and modality.
  - >-
    A pipeline page states a current condition and carries no publication date. It is acquired
    with published_at unknown and the moment of retrieval recorded as what it can speak to; it
    is non-decisional for any question asked before it was observed.
  - >-
    Some tranche companies have since been acquired or delisted. Their URLs are declared
    anyway: a page that no longer resolves is recorded as an explicit source failure, which is
    a different fact from a company having no pipeline.
sources:

# ==============================================================================
# Historical Trial Readout Events — 2015–2020
# ==============================================================================
#
# PURPOSE
# -------
# Curated trial readout events for tracked universe names across 2015-2020.
# Used by ops/trial_event_backfiller.py to populate
# ReplayStore.historical_events, enabling the catalyst-timing gate
# (--require-catalyst-days N) to fire in replay runs starting from 2015.
#
# IDEMPOTENCY
# -----------
# Seeder generates deterministic event_id = "trial:{TICKER}:{DATE}" so
# re-seeding the same YAML never creates duplicate rows.
#
# SOURCES
# -------
# Press releases, SEC 8-K filings, NEJM/JAMA publications, FDA action letters,
# conference presentations (ASCO, ESMO, ASH, ACC, AHA, EHA).
#
# SCHEMA
# ------
# asset_id:      "a-{ticker.lower()}" convention
# ticker:        exchange ticker symbol
# event_type:    trial_readout | pdufa_decision | adcom_meeting | enrollment_complete | conference_abstract | competitor_readout
# announced_at:  YYYY-MM-DD press release / publication date
# outcome_label: positive | negative | mixed | neutral
# headline:      concise factual description
#
# ==============================================================================

meta:
  description: "2015-2020 trial readout events for universe names seeded into replay_store.sqlite"
  n_events: 52
  date_range: "2015-06-24 to 2020-12-10"
  sources:
    - Press releases (company IR)
    - SEC 8-K filings
    - NEJM, JAMA, NEJM Evidence publications
    - ASCO, ESMO, ASH, ACC, EHA conference abstracts
    - FDA press announcements


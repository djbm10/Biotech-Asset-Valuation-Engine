# ==============================================================================
# Historical Trial Readout Events — Wave 3 Active Monitors (2021–2026)
# ==============================================================================
#
# PURPOSE
# -------
# Curated trial readout events for Wave 3 active monitor universe names.
# Used to seed ReplayStore.historical_events, enabling confirmed_thesis
# attribution and catalyst-timing gate in replay runs.
#
# SCHEMA
# ------
# asset_id:      "a-{ticker.lower()}" convention
# ticker:        exchange ticker symbol
# event_type:    trial_readout | pdufa_decision | adcom_meeting |
#                enrollment_complete | conference_abstract | competitor_readout
# announced_at:  YYYY-MM-DD
# outcome_label: positive | negative | mixed | neutral
# headline:      concise factual description (<=100 chars)
#
# ==============================================================================


# ==============================================================================
# Historical Trial Readout Events — 2021–2023
# ==============================================================================
#
# PURPOSE
# -------
# Curated trial readout events for the 27-name universe across 2021-2023.
# Used by ops/trial_event_backfiller.py to populate
# ReplayStore.historical_events, enabling the catalyst-timing gate
# (--require-catalyst-days N) to fire in replay runs starting from 2021.
#
# PROBLEM THIS SOLVES
# -------------------
# All 27 pre-2024 events currently in replay_store.sqlite are M&A acquisitions
# for non-universe tickers. The catalyst gate finds nothing to trigger on
# for universe names in 2021-2023, capping N ≈ 22. Adding 35+ trial readouts
# for universe tickers is the binding constraint on the path to N ≥ 30.
#
# IDEMPOTENCY
# -----------
# Seeder generates deterministic event_id = "trial:{TICKER}:{DATE}" so
# re-seeding the same YAML never creates duplicate rows.
#
# SOURCES
# -------
# Press releases, SEC 8-K filings, NEJM/JAMA publications, conference
# presentations (ASCO, ESMO, ASH, ACC, AHA). All events are publicly
# documented. Dates use announced_at (press release / abstract date).
#
# SCHEMA
# ------
# asset_id:      "a-{ticker.lower()}" convention
# ticker:        exchange ticker symbol
# event_type:    trial_readout | pdufa_decision | adcom_meeting | enrollment_complete | conference_abstract | competitor_readout
# announced_at:  YYYY-MM-DD press release / publication date
# outcome_label: positive | negative | mixed | neutral
# headline:      concise factual description (≤ 120 chars)
#
# ==============================================================================

meta:
  description: "2021-2023 trial readout events for universe names seeded into replay_store.sqlite"
  n_events: 37

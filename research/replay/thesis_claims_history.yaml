  - ticker: BIIB
    asset_id: a-biib
    company_id: co-biib
    claim_type: regulatory_pathway
    assertion: >
      Lecanemab receives traditional (full) FDA approval, not merely accelerated
      approval, establishing it as the standard of care for early Alzheimer's
    created_at: "2022-12-01"
    resolved_at: "2023-07-06"
    status: confirmed
    evidence: >
      FDA granted traditional approval for lecanemab (Leqembi) on July 6, 2023,
      following CLARITY-AD Phase 3 data; CMS subsequently agreed to cover in
      Medicare patients with confirmed amyloid pathology


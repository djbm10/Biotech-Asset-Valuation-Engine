  # LLY — Eli Lilly / tirzepatide / obesity
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # BIIB — Biogen / lecanemab / early Alzheimer's
  # ---------------------------------------------------------------------------
  - ticker: BIIB
    asset_id: a-biib
    company_id: co-biib
    claim_type: endpoint_met
    assertion: >
      Lecanemab meets primary CDR-SB endpoint in CLARITY-AD Phase 3 trial,
      demonstrating statistically significant slowing of clinical decline
      in early Alzheimer's disease
    created_at: "2021-07-01"
    resolved_at: "2022-11-29"

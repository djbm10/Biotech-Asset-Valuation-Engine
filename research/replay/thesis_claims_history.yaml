  # ARVN — Arvinas / vepdegestrant / VERITAC-2 Phase 3 follow-on
  # ---------------------------------------------------------------------------
  - ticker: ARVN
    asset_id: a-arvn
    company_id: co-arvn
    claim_type: enrollment_on_track
    assertion: >
      VERITAC-2 Phase 3 comparing vepdegestrant vs fulvestrant in ER+/HER2-

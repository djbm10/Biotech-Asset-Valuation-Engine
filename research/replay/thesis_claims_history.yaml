  # ---------------------------------------------------------------------------
  # ZYME — Zymeworks / zanidatamab / HER2 / biliary tract
  # ---------------------------------------------------------------------------
  - ticker: ZYME
    asset_id: a-zyme
    company_id: co-zyme
    claim_type: regulatory_pathway
    assertion: >
      Zanidatamab receives FDA approval in HER2-amplified biliary tract
      cancer based on Phase 2b HERIZON-BTC-01 accelerated approval data
    created_at: "2022-06-01"
    resolved_at: "2024-11-04"
    status: confirmed
    evidence: >
      FDA approved zanidatamab (Ziihera) November 4, 2024 for HER2-amplified
      biliary tract cancer under accelerated approval; first HER2-targeted
      therapy approval in this indication

  # ---------------------------------------------------------------------------
  # NVAX — Novavax / Nuvaxovid / COVID-19 booster
  # ---------------------------------------------------------------------------
  - ticker: NVAX
    asset_id: a-nvax
    company_id: co-nvax
    claim_type: market_reaction_positive
    assertion: >
      Nuvaxovid captures meaningful (≥5%) US COVID booster market share
      given protein subunit differentiation vs mRNA vaccines
    created_at: "2022-01-01"
    resolved_at: "2023-09-01"
    status: refuted
    evidence: >
      Nuvaxovid US market share remained sub-1% of COVID booster market
      throughout 2023; commercial partnership with Sanofi did not materially
      improve uptake; company faced going concern risk by late 2023

  # ---------------------------------------------------------------------------
  # AMRN — Amarin / Vascepa / patent litigation
  # ---------------------------------------------------------------------------
  - ticker: AMRN
    asset_id: a-amrn
    company_id: co-amrn
    claim_type: competitor_failure
    assertion: >
      Patent courts uphold Vascepa formulation claims in appeal, limiting
      generic competition and sustaining branded revenue trajectory
    created_at: "2021-01-04"
    resolved_at: "2021-05-14"
    status: refuted
    evidence: >
      Federal Circuit affirmed district court ruling invalidating Vascepa
      composition patents May 2021; generic entrants launched; Vascepa
      revenue declined sharply throughout 2021

  # ---------------------------------------------------------------------------
  # RXRX — Recursion / pipeline / AI drug discovery
  # ---------------------------------------------------------------------------
  - ticker: RXRX
    asset_id: a-rxrx
    company_id: co-rxrx
    claim_type: pos_above_threshold
    assertion: >
      At least one Recursion-originated compound reaches Phase 1
      dose-escalation with clean safety by end of 2023
    created_at: "2021-01-04"
    resolved_at: "2023-12-31"
    status: confirmed
    evidence: >
      REC-994 (cerebral cavernous malformation) and REC-2282 (NF2) both
      reached Phase 1/2; Bayer partnership validated AI platform;
      Exscientia merger announced 2024 further validating AI approach

  # ---------------------------------------------------------------------------
  # PRTA — Prothena / prasinezumab / Parkinson's
  # ---------------------------------------------------------------------------
  - ticker: PRTA
    asset_id: a-prta
    company_id: co-prta
    claim_type: endpoint_met
    assertion: >
      Prasinezumab slows motor progression measured by MDS-UPDRS Part III
      in rapid-progressor Parkinson's patients in Phase 2b PADOVA trial
    created_at: "2022-01-01"
    resolved_at: "2024-07-29"
    status: refuted
    evidence: >
      PADOVA Phase 2b results July 2024: prasinezumab missed primary endpoint
      (MDS-UPDRS Part III motor score) in rapid progressors; signal in secondary
      endpoints (UPDRS-II) insufficient for pivotal; Roche partnership
      re-evaluation announced

  # ---------------------------------------------------------------------------
  # FULC — Fulcrum / losmapimod / FSHD
  # ---------------------------------------------------------------------------
  - ticker: FULC
    asset_id: a-fulc
    company_id: co-fulc
    claim_type: enrollment_on_track
    assertion: >
      Losmapimod Phase 3 ReDUX4 meets MRI fat fraction primary endpoint
      demonstrating meaningful DUX4-pathway suppression in FSHD
    created_at: "2022-01-01"
    resolved_at: "2024-02-27"
    status: refuted
    evidence: >
      ReDUX4 Phase 3 announced February 2024: missed fat fraction primary
      endpoint (p=0.24); company pivoted to secondary endpoint analysis and
      biomarker subsets; Phase 3 commercial path unclear

  # ---------------------------------------------------------------------------
  # SRRK — Scholar Rock / apitegromab / SMA
  # ---------------------------------------------------------------------------
  - ticker: SRRK
    asset_id: a-srrk
    company_id: co-srrk
    claim_type: enrollment_on_track
    assertion: >
      Apitegromab meets motor function endpoint (HFMSE improvement) in
      Phase 3 SAPPHIRE trial in non-ambulatory SMA patients on nusinersen/risdiplam
    created_at: "2022-01-01"
    resolved_at: "2024-03-18"
    status: confirmed
    evidence: >
      SAPPHIRE Phase 3 topline March 2024: met primary endpoint of HFMSE
      improvement vs placebo (p<0.01) in older non-ambulatory SMA patients;
      NDA submission planned 2024

  # ---------------------------------------------------------------------------
  # EDIT — Editas / EDIT-301 / sickle cell
  # ---------------------------------------------------------------------------
  - ticker: EDIT
    asset_id: a-edit
    company_id: co-edit
    claim_type: enrollment_on_track
    assertion: >
      EDIT-301 achieves HbF induction sustaining HbS <30% in at least
      3 patients at 12-month follow-up in Phase 1/2 RUBY trial
    created_at: "2022-01-01"
    resolved_at: "2024-04-01"
    status: refuted
    evidence: >
      Editas discontinued EDIT-301 sickle cell program March 2024 citing
      competition from approved Casgevy (CRSP/Vertex) and resource constraints;
      RUBY trial enrollment halted; company refocused on retina programs

  # ---------------------------------------------------------------------------
  # VRTX — Vertex / VX-548 / acute pain / NaV1.8
  # ---------------------------------------------------------------------------
  - ticker: VRTX
    asset_id: a-vrtx
    company_id: co-vrtx
    claim_type: pos_above_threshold
    assertion: >
      VX-548 NaV1.8 selective inhibitor meets primary pain endpoint in
      Phase 3 acute pain (bunionectomy and abdominoplasty), clearing path
      to NDA as a non-opioid analgesic
    created_at: "2022-06-01"
    resolved_at: "2024-01-30"
    status: confirmed
    evidence: >
      Phase 3 results Jan 2024: VX-548 met primary SPID48 endpoint in both
      bunionectomy and abdominoplasty trials; NDA submitted to FDA;
      first-in-class NaV1.8 inhibitor with blockbuster potential

  # ---------------------------------------------------------------------------
  # REGN — Regeneron / EYLEA HD / AMD biosimilar competition
  # ---------------------------------------------------------------------------
  - ticker: REGN
    asset_id: a-regn
    company_id: co-regn
    claim_type: regulatory_pathway
    assertion: >
      EYLEA HD (aflibercept 8 mg) receives FDA approval for wet AMD with
      extended 12-16 week dosing interval, enabling label differentiation
      from biosimilar EYLEA 2 mg before generics enter market
    created_at: "2021-01-04"
    resolved_at: "2023-08-22"
    status: confirmed
    evidence: >
      FDA approved EYLEA HD (aflibercept 8 mg) August 22, 2023 for wet AMD,
      nAMD, and DME with extended dosing interval; PHOTON Phase 3 met
      non-inferiority primary endpoint; EYLEA HD positioned ahead of
      biosimilar EYLEA entry

  - ticker: REGN
    asset_id: a-regn
    company_id: co-regn
    claim_type: competitor_failure
    assertion: >
      EYLEA biosimilar penetration remains slower than analyst consensus
      in first 12 months post-launch, with Regeneron retaining ≥70% of
      branded EYLEA + EYLEA HD combined AMD share
    created_at: "2023-07-01"
    resolved_at: "2024-06-01"
    status: confirmed
    evidence: >
      Biosimilar EYLEA entered market mid-2023 but EYLEA HD (high-dose,
      extended interval) captured significant switch volume; Regeneron
      retained strong combined wet AMD market position through mid-2024;
      EYLEA franchise revenue decline slower than feared

  # ---------------------------------------------------------------------------
  # LLY — Eli Lilly / tirzepatide / obesity
  # ---------------------------------------------------------------------------
  - ticker: LLY
    asset_id: a-lly
    company_id: co-lly
    claim_type: endpoint_met
    assertion: >
      Tirzepatide (GIP/GLP-1 dual agonist) achieves clinically meaningful
      weight loss vs placebo in SURMOUNT-1 Phase 3 obesity trial, supporting
      FDA approval in adults with obesity or overweight+comorbidity
    created_at: "2021-01-04"
    resolved_at: "2022-10-15"
    status: confirmed
    evidence: >
      SURMOUNT-1 results presented at EASD Oct 2022 and NEJM Oct 2022:
      15 mg tirzepatide achieved 20.9% mean weight loss vs 3.1% placebo
      (p<0.001); all doses met superiority; SURMOUNT-2/3/4 programme
      supported NDA submission for obesity indication

  - ticker: LLY
    asset_id: a-lly
    company_id: co-lly
    claim_type: regulatory_pathway
    assertion: >
      Tirzepatide receives FDA approval as Zepbound for chronic weight
      management in adults with obesity or overweight with comorbidities,
      expanding the Mounjaro franchise beyond type 2 diabetes
    created_at: "2022-11-01"
    resolved_at: "2023-11-08"
    status: confirmed
    evidence: >
      FDA approved Zepbound (tirzepatide) November 8, 2023 for chronic
      weight management; launch price set at $1,059.87/month; positioned
      as premium obesity therapy vs Wegovy; peak sales forecasts raised
      above $25B across T2D + obesity indications

  # ---------------------------------------------------------------------------
  # KYMR — Kymera / KT-474 / HS follow-on (after AD Phase 2 confirmation)
  # ---------------------------------------------------------------------------
  - ticker: KYMR
    asset_id: a-kymr
    company_id: co-kymr
    claim_type: endpoint_met
    assertion: >
      KT-474 IRAK4 degrader demonstrates ≥50% IHS4 improvement vs placebo
      in Phase 2 hidradenitis suppurativa cohort, confirming mechanistic
      breadth beyond atopic dermatitis
    created_at: "2022-10-01"
    resolved_at: "2024-03-08"
    status: confirmed
    evidence: >
      AAD 2024 (March 8, 2024): KT-474 Phase 2 HS data showed statistically
      significant IHS4 improvement vs placebo with dose-dependent response;
      data extended the IRAK4 degrader hypothesis to inflammatory skin
      diseases beyond AD, supporting broader programme value

  # ---------------------------------------------------------------------------
  # RVMD — Revolution Medicines / RMC-6236 early / Phase 1 IND clearance
  # ---------------------------------------------------------------------------
  - ticker: RVMD
    asset_id: a-rvmd
    company_id: co-rvmd
    claim_type: pos_above_threshold
    assertion: >
      RMC-6236 pan-RAS(ON) multi-selective inhibitor achieves IND clearance
      and Phase 1 first-patient-dosed with acceptable initial safety profile,
      demonstrating feasibility of targeting KRAS wild-type-preferring state
    created_at: "2021-01-04"
    resolved_at: "2022-12-01"
    status: confirmed
    evidence: >
      RMC-6236 IND cleared by FDA in 2022; Phase 1 dose escalation opened
      with patients dosed at Revelation Medicines ASCO update; early safety
      profile acceptable; differentiated from covalent KRASG12C inhibitors
      by multi-selectivity across KRAS/HRAS/NRAS mutations

  # ---------------------------------------------------------------------------
  # ALNY — Alnylam / zilebesiran / hypertension follow-on
  # ---------------------------------------------------------------------------
  - ticker: ALNY
    asset_id: a-alny
    company_id: co-alny
    claim_type: enrollment_on_track
    assertion: >
      Zilebesiran KARDIA-2 Phase 3 completes full enrollment in hypertension
      on background therapy, demonstrating operational execution and
      Roche partnership confidence in the programme
    created_at: "2022-12-01"
    resolved_at: "2024-09-01"
    status: confirmed
    evidence: >
      KARDIA-2 Phase 3 enrollment completed in 2024 with partner Roche;
      trial design validated by FDA; zilebesiran siRNA against angiotensinogen
      showed 14 mmHg SBP reduction in KARDIA-1 Phase 2 (June 2022),
      supporting the pivotal programme design

  # ---------------------------------------------------------------------------
  # NTLA — Intellia / NTLA-2002 / HAE follow-on
  # ---------------------------------------------------------------------------
  - ticker: NTLA
    asset_id: a-ntla
    company_id: co-ntla
    claim_type: endpoint_met
    assertion: >
      NTLA-2002 single-dose in vivo CRISPR editing of KLKB1 achieves
      durable ≥80% reduction in HAE attack frequency at 12-month follow-up,
      establishing a one-time curative approach for hereditary angioedema
    created_at: "2022-07-01"
    resolved_at: "2023-12-09"
    status: confirmed
    evidence: >
      ASH 2023 (December 9, 2023): NTLA-2002 Phase 1/2 data showed 95%
      mean attack reduction at 12 months in evaluable patients; no attacks
      in majority of patients from month 3 onward; supports move to
      registration-enabling Phase 2/3 HAELO trial


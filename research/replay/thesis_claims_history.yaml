    created_at: "2022-06-01"
    resolved_at: "2024-01-30"
    status: confirmed
    evidence: >
      Phase 3 results Jan 2024: VX-548 met primary SPID48 endpoint in both
      bunionectomy and abdominoplasty trials; NDA submitted to FDA;
      first-in-class NaV1.8 inhibitor with blockbuster potential


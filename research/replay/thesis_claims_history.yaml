    created_at: "2022-01-01"
    resolved_at: "2023-06-20"
    status: confirmed
    evidence: >
      FDA approved efgartigimod alfa + hyaluronidase-qvfc (Vyvgart Hytrulo) for
      ITP in adults June 2023 following ADVANCE-SC Phase 3 positive results;

      Apitegromab meets motor function endpoint (HFMSE improvement) in
      Phase 3 SAPPHIRE trial in non-ambulatory SMA patients on nusinersen/risdiplam
    created_at: "2022-01-01"
    resolved_at: "2024-03-18"
    status: confirmed
    evidence: >
      SAPPHIRE Phase 3 topline March 2024: met primary endpoint of HFMSE

    evidence: >
      Editas discontinued EDIT-301 sickle cell program March 2024 citing
      competition from approved Casgevy (CRSP/Vertex) and resource constraints;
      RUBY trial enrollment halted; company refocused on retina programs

  # ---------------------------------------------------------------------------
  # VRTX — Vertex / VX-548 / acute pain / NaV1.8
  # ---------------------------------------------------------------------------
  - ticker: VRTX
    asset_id: a-vrtx
    company_id: co-vrtx
    claim_type: pos_above_threshold

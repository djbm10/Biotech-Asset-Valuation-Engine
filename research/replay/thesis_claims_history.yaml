    created_at: "2022-01-01"
    resolved_at: "2024-02-16"
    status: confirmed
    evidence: >
      FDA approved Amtagvi February 16, 2024 for unresectable/metastatic
      melanoma; first TIL therapy approval; launch sites activated in 2024

  # ---------------------------------------------------------------------------
  # IMVT — Immunovant / batoclimab / FcRn inhibitor / MG + TED
  # ---------------------------------------------------------------------------
  - ticker: IMVT

# thesis_claims_history.yaml
#
# Historical thesis claim assertions and resolutions for the universe assets.
# Used by bve-seed-replay-claims to backfill the replay KB with time-stamped
# thesis history so ThesisTracker.snapshot(as_of_date=...) correctly reflects
# conviction state at each replay week (no-lookahead).
#
# Fields
# ------
# ticker          : Universe ticker symbol
# asset_id        : Matches UNIVERSE in weekly_runner.py
# company_id      : Matches UNIVERSE in weekly_runner.py
# claim_type      : ClaimType enum value (e.g. trial_outcome, endpoint_met)
# assertion       : Human-readable claim text
# created_at      : ISO date when the claim was first asserted (start of the
#                   investment thesis period or first public signal)
# resolved_at     : ISO date when the outcome became public knowledge
# status          : confirmed | refuted | expired
# evidence        : Short text justifying the resolution (for audit trail)
#
# Sources: published trial results, FDA approval letters, earnings calls.
# All dates are the earliest date the information was publicly available.
#
# Note: Only claims that were definitively resolved in 2021-2024 are included.
# Open (unresolved) claims are seeded separately by the main replay seed step.

claims:

  # ---------------------------------------------------------------------------
  # ALNY — Alnylam / ATTR / patisiran
  # ---------------------------------------------------------------------------
  - ticker: ALNY
    asset_id: a-alny
    company_id: co-alny
    claim_type: endpoint_met
    assertion: >
      APOLLO-B patisiran will meet primary NT-proBNP endpoint in ATTR-CM
      (cardiomyopathy) demonstrating clinically meaningful cardiac benefit
    created_at: "2021-01-04"
    resolved_at: "2022-11-06"
    status: confirmed
    evidence: >
      NEJM Nov 2022: patisiran APOLLO-B met primary endpoint (NT-proBNP reduction)
      and key secondary endpoints in ATTR-CM; FDA approved vutrisiran for ATTR-CM
      in 2024 following these data

  # ---------------------------------------------------------------------------
  # MRNA — Moderna / mRNA-4157 (V940) / adjuvant melanoma
  # ---------------------------------------------------------------------------
  - ticker: MRNA
    asset_id: a-mrna
    company_id: co-mrna
    claim_type: endpoint_met
    assertion: >
      mRNA-4157 (ICV) neoantigen vaccine in combination with pembrolizumab meets
      recurrence-free survival primary endpoint in KEYNOTE-942 Phase 2b
    created_at: "2021-06-01"
    resolved_at: "2023-04-18"
    status: confirmed
    evidence: >
      KEYNOTE-942 data presented at AACR April 2023 and NEJM July 2023:
      44% reduction in risk of recurrence or death vs pembro alone (HR 0.56, p=0.03)

  # ---------------------------------------------------------------------------
  # VKTX — Viking Therapeutics / VK2735 / obesity
  # ---------------------------------------------------------------------------
  - ticker: VKTX
    asset_id: a-vktx
    company_id: co-vktx
    claim_type: endpoint_met
    assertion: >
      VK2735 subcutaneous achieves statistically significant weight loss
      vs placebo with clean safety profile in Phase 2 obesity study
    created_at: "2022-09-01"
    resolved_at: "2024-02-27"
    status: confirmed
    evidence: >
      Phase 2 VENTURE trial topline Feb 2024: ~13.1% mean weight loss at
      13 weeks vs placebo; FDA cleared Phase 3 IND

  # ---------------------------------------------------------------------------
  # MDGL — Madrigal / resmetirom / NASH
  # ---------------------------------------------------------------------------
  - ticker: MDGL
    asset_id: a-mdgl
    company_id: co-mdgl
    claim_type: endpoint_met
    assertion: >
      Resmetirom achieves NASH resolution or fibrosis improvement in Phase 3
      MAESTRO-NASH trial, supporting NDA submission
    created_at: "2021-01-04"
    resolved_at: "2023-12-13"
    status: confirmed
    evidence: >
      MAESTRO-NASH Phase 3 results announced Dec 2023: met both co-primary
      endpoints (NASH resolution without fibrosis worsening AND ≥1-stage
      fibrosis improvement); Rezdiffra FDA approved March 2024

  # ---------------------------------------------------------------------------
  # BMRN — BioMarin / Roctavian / hemophilia A gene therapy
  # ---------------------------------------------------------------------------
  - ticker: BMRN
    asset_id: a-bmrn
    company_id: co-bmrn
    claim_type: endpoint_met
    assertion: >
      Roctavian (valoctocogene roxaparvovec) demonstrates durable Factor VIII
      expression at 2-year follow-up supporting FDA approval in severe hemophilia A
    created_at: "2021-01-04"
    resolved_at: "2023-06-29"
    status: confirmed
    evidence: >
      FDA approved Roctavian June 2023 for severe hemophilia A in adults;
      however durability concerns (declining Factor VIII) remained; label
      required annual monitoring

  - ticker: BMRN
    asset_id: a-bmrn
    company_id: co-bmrn
    claim_type: enrollment_on_track
    assertion: >
      Roctavian durability holds at 3-year follow-up without meaningful
      decline requiring label restriction or black box warning
    created_at: "2023-07-01"
    resolved_at: "2024-06-01"
    status: refuted
    evidence: >
      3-year data showed continued Factor VIII decline below protective levels
      in a meaningful fraction of patients; commercial uptake severely
      disappointed (~$20M vs analyst estimates of $100M+)

  # ---------------------------------------------------------------------------
  # SRPT — Sarepta / Elevidys / Duchenne muscular dystrophy
  # ---------------------------------------------------------------------------
  - ticker: SRPT
    asset_id: a-srpt
    company_id: co-srpt
    claim_type: regulatory_pathway
    assertion: >
      Elevidys (delandistrogene moxeparvovec) receives accelerated FDA approval
      for ambulatory Duchenne patients aged 4-5, establishing gene therapy
      precedent in DMD
    created_at: "2021-01-04"
    resolved_at: "2023-06-22"
    status: confirmed
    evidence: >
      FDA accelerated approval June 2023 for ambulatory DMD patients 4-5 years;
      full approval pathway required confirmatory functional trial (EMBARK)

  - ticker: SRPT
    asset_id: a-srpt
    company_id: co-srpt
    claim_type: regulatory_pathway
    assertion: >
      Elevidys EMBARK Phase 3 confirms functional benefit enabling full label
      approval and age expansion beyond 4-5 year accelerated approval
    created_at: "2023-07-01"
    resolved_at: "2024-06-20"
    status: confirmed
    evidence: >
      FDA converted Elevidys to full traditional approval June 2024 and expanded
      label to ambulatory patients ≥4 years based on EMBARK data showing
      significant NSAA score improvement

  # ---------------------------------------------------------------------------
  # CRSP — CRISPR Therapeutics / Casgevy / sickle cell disease + TDT
  # ---------------------------------------------------------------------------
  - ticker: CRSP
    asset_id: a-crsp
    company_id: co-crsp
    claim_type: endpoint_met
    assertion: >
      CTX001 (exa-cel, Casgevy) meets primary endpoint of transfusion

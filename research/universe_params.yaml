# ==============================================================================
# Universe Valuation Parameters — Screening Grade
# ==============================================================================
#
# PURPOSE
# -------
# Minimal per-ticker overrides that allow the parametric DrugAssetProgram builder
# (ops/universe_configs.py) to produce a "screening-grade" valuation for every
# name in weekly_runner.UNIVERSE without a full hand-written YAML config.
#
# ACCURACY TIER
# -------------
# These are SCREENING-GRADE estimates, not portfolio-grade BD memos.
# - peak_sales_millions: conservative-to-mid consensus range midpoint
# - years_to_approval: rough estimate from current phase, not trial-specific
# - single_asset: false means the market-implied PoS is an APPROXIMATION; the
#   company's EV reflects multiple pipeline programs so the back-solve is not
#   clean. The spread signal is still directionally useful but should be
#   interpreted with caution for multi-program names.
#
# UPDATE CADENCE
# --------------
# Review after each quarterly earnings cycle. Update peak_sales_millions and
# years_to_approval when material new data changes the range.
#
# SOURCES
# -------
# Peak sales: conservative midpoint of public analyst consensus ranges (Goldman,
# Morgan Stanley, Leerink, SVB, William Blair). All are PUBLIC information.
# Years to approval: estimated from current clinical stage and typical timelines.
#
# ==============================================================================


# Biotech M&A Target Universe — Phase 2
#
# 50 drug-developer targets selected for:
#   - Plausible acquisition size (nano → mid cap)
#   - Defined lead asset with known phase
#   - Strategic fit to large-pharma therapeutic areas
#   - Exclude tools/services/diagnostics-only names
#
# Mandatory fields: ticker, name, exchange, company_type,
#   therapeutic_areas, lead_asset, lead_asset_phase, lead_modality,
#   lead_indication, is_single_asset_company, include_in_screen
#
# Optional: cik, market_cap_bucket, platform_type,
#           has_partner_encumbrance, notes
#
# Phases: preclinical | phase1 | phase2 | phase3 | commercial | unknown
# Modalities: small_molecule | biologic | antibody_drug_conjugate |
#             cell_gene | cell_therapy | rna | gene_editing |
#             base_editing | antisense | vaccine | unknown
# TAs: oncology | rare_disease | immunology | neuroscience |
#      cardiovascular | infectious_disease | metabolic |
#      dermatology | ophthalmology | respiratory | hematology |
#      musculoskeletal | gastrointestinal | other


  # --- Preferred target profile ---
  preferred_market_cap_sweet_spot_usd: [250000000, 5000000000]
  preferred_market_cap_stretch_usd: [5000000000, 8000000000]
  preferred_valuation_sweet_spot_usd: [5000000, 500000000]
  preferred_deal_types:
    - strategic_collaboration
    - in_license
    - rights_acquisition
    - bolt_on_acquisition
    - selective_full_company_acquisition
  preferred_stage_weights:
    - stage: phase_2_or_phase_3_platform_or_combo_asset
      weight: 1.00
    - stage: preclinical_or_phase_1_platform_core_modality
      weight: 0.85
    - stage: rights_acquisition
      weight: 0.85
    - stage: commercial_single_asset_no_platform_leverage
      weight: 0.40
  preferred_modality_weights:
    - modality: monoclonal_antibody
      weight: 1.00
    - modality: bispecific_antibody
      weight: 0.98
    - modality: genetic_medicines_gene_editing_siRNA_AAV
      weight: 0.92
    - modality: cell_therapy
      weight: 0.88
    - modality: radiopharmaceuticals
      weight: 0.85
    - modality: selective_metabolic_combo_assets
      weight: 0.70
    - modality: undifferentiated_small_molecule_single_asset
      weight: 0.25
  # --- Fit areas ---
  positive_fit_areas:
    - area: ophthalmology_durability_retina_and_non_vegf_or_ga
      score_boost: 0.15
      rationale: "EYLEA HD +52% Q1 2026 but total franchise -10%. GA non-VEGF mechanisms (complement, HtrA1) are top gap; sustained-release delivery secondary."
    - area: antibody_and_bispecific_platforms
      score_boost: 0.12
      rationale: "VelociSuite is Regeneron's deepest platform; targets with validated antibody/bispecific assets against novel antigens are easiest to integrate."
    - area: immunology_and_inflammation_franchise_extensions
      score_boost: 0.12
      rationale: "Dupixent ~$18B global 2025 revenue; next-gen long-acting biologics and oral alternatives to protect/extend the franchise."
    - area: genetic_medicines_gene_editing_and_delivery
      score_boost: 0.10
      rationale: "Mammoth/Intellia collaborations and RGC (2M+ genomes) validate pipeline; RGC-discovered targets highest priority."
    - area: oncology_radiopharma_or_cell_therapy_combo_platforms
      score_boost: 0.10
      rationale: "Libtayo PD-1 backbone + bispecifics + Telix radiopharma; combination warhead platforms score highest."
    - area: cardio_metabolic_muscle_sparing_anabolic_combo
      score_boost: 0.06
      rationale: "Hansoh fills GLP-1/GIP slot; next gap is muscle-sparing anabolic partner (myostatin/GDF8/activin)."
  negative_fit_areas:
    - area: mega_cap_MA_without_clear_platform_synergy
      penalty: 0.20
      rationale: "Management has explicitly warned large M&A often destroys value."
    - area: heavily_encumbered_competitor_partnered_assets
      penalty: 0.25
      rationale: "Rights leakage is especially costly; Sanofi/Bayer already dilute economics on major franchises."
    - area: undifferentiated_small_molecule_single_asset
      penalty: 0.15
      rationale: "Weak match to platform-first culture; only exception is oral I&I defense of Dupixent franchise."
    - area: anti_vegf_me_too_without_durability_or_differentiation
      penalty: 0.15
      rationale: "Ophthalmology fit alone is not enough; GA or non-VEGF mechanistic differentiation required."
  # --- Scoring weights ---
  scoring_weights:
    structural: 0.35
    evidence: 0.45
    encumbrance: 0.20
    formula: "final_score = 0.35*structural + 0.45*evidence - 0.20*encumbrance"
    rationale: "Broad modality aperture means evidence and timing signals do more work than structure; encumbrance must bite hard given Sanofi/Bayer collaboration economics."
  # --- Pair penalties (pct) ---
  pair_penalties_pct:
    competitor_controls_key_rights: -25
    large_MA_without_platform_synergy: -20
    sanofi_or_bayer_economic_dilution_risk: -15
    ophthalmology_asset_lacks_differentiation: -15
    little_modality_synergy_with_platform_toolbox: -10
    china_only_rights_when_global_needed: -10
  strategic_priorities:
    - dupixent_lifecycle_and_oral_alternative_defense
    - eylea_hd_franchise_extension_ga_and_non_vegf_retinal
    - oncology_io_combination_platform_libtayo_backbone
    - obesity_combination_muscle_sparing_anabolic_partner
    - genetic_medicines_rna_and_gene_editing_platform
    - hematology_bispecific_and_anticoagulation_fxi
  patent_cliff_exposure: "EYLEA 2mg legacy biosimilar erosion ongoing since 2025; EYLEA HD (8mg) +52% Q1 2026 but total franchise -10%. Dupixent IP stronger (~2031+). Thesis is franchise extension, not EYLEA collapse. Kevzara modest."
  last_verified_date: "2026-06-02"
  notes: "VelocImmune/VelociSuite antibody and bispecific platform. Dupixent ~$18B global sales with Sanofi. EYLEA HD growing; legacy 2mg under biosimilar pressure. Libtayo IO backbone + bispecifics. RGC (2M+ genomes) drives target selection. Selective BD: collaboration-first then acquire (Decibel model). 23andMe bid confirms genomics data assets in scope at sub-$300M."
  source_urls:
    - "https://investor.regeneron.com/news-releases/news-release-details/regeneron-reports-first-quarter-2026-financial-and-operating/"
    - "https://www.sec.gov/Archives/edgar/data/872589/000087258926000016/regn-20260331.htm"
    - "https://investor.regeneron.com/news-releases/news-release-details/regeneron-acquire-decibel-therapeutics-strengthening-gene/"
    - "https://investor.regeneron.com/news-releases/news-release-details/regeneron-expands-clinical-stage-obesity-portfolio-strategic/"
    - "https://investor.regeneron.com/news-releases/news-release-details/regeneron-and-telix-announce-strategic-radiopharma-collaboration/"
    - "https://investor.regeneron.com/static-files/718ea4f2-7a0f-4623-bf91-a701ead1cc44"


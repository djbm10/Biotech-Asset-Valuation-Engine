# ==============================================================================
# Forward Catalyst Calendar — 2026
# ==============================================================================
#
# PURPOSE
# -------
# Curated upcoming catalyst events for the 27-name universe. Used by
# ops/forward_calendar_seeder.py to populate the catalyst_events table in
# KnowledgeStore. Re-seeding is idempotent: the seeder derives a deterministic
# event ID from (ticker, catalyst_type, expected_date) so duplicate rows are
# never created.
#
# DATE CONFIDENCE TIERS
# ---------------------
#   exact       — official PDUFA / confirmed press-release date
#   quarter     — company guidance placed it within a specific quarter
#   half_year   — company guidance H1 / H2 window only
#   estimate    — analyst/clinical-stage inference; no formal company guidance
#
# UPDATE CADENCE
# --------------
# Review after each quarterly earnings cycle or when company guidance updates.
# Set resolved: true when an event fires; add actual_outcome (positive /
# negative / partial).
#
# SOURCES
# -------
# Company guidance from Q3-Q4 2025 earnings calls and press releases.
# FDA review timelines: standard = 10 months from NDA/BLA acceptance.
# Clinical trial timelines: estimated from enrollment completion dates.
#
# ==============================================================================


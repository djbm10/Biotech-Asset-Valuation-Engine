name: Ingestion Source Health Check

# Probes SEC/CT.gov/FDA reachability and classifier health on a real network.
# Runs daily before the main pipeline; also triggerable manually to test a
# specific source subset or date.  Exits 2 if any source is DEGRADED/FAILED.

on:
  schedule:
    - cron: "45 6 * * *"   # 06:45 UTC daily — before the 11:17 daily run
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "As-of date YYYY-MM-DD. Empty = today."
        required: false
        default: ""
      sources:
        description: "Comma-separated sources to probe (sec, clinicaltrials, fda). Empty = all."
        required: false
        default: ""
      lookback_days:
        description: "Lookback window for fetching recent events"
        required: false
        default: "3"

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,platform,extract]"

      - name: Resolve run date
        id: date
        run: |
          AS_OF="${{ inputs.as_of_date }}"
          if [ -z "$AS_OF" ]; then
            AS_OF="$(date -u +%F)"
          fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"

      - name: Prepare probe ledger
        run: |
          mkdir -p outputs/probe/intelligence
          touch outputs/probe/intelligence/probe_ledger.jsonl

      - name: Run ingestion health probe
        id: probe
        run: |
          SOURCES_ARG=""
          if [ -n "${{ inputs.sources }}" ]; then
            SOURCES_ARG="--sources ${{ inputs.sources }}"
          fi

          LOOKBACK="${{ inputs.lookback_days }}"
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK="3"
          fi

          bve-ingest-live \
            --targets research/universe/targets.yaml \
            --acquirers research/universe/acquirers.yaml \
            --overrides research/universe/manual_overrides.yaml \
            --ledger outputs/probe/intelligence/probe_ledger.jsonl \
            --as-of "${{ steps.date.outputs.as_of }}" \
            --lookback-days "$LOOKBACK" \
            --output "outputs/probe/health/${{ steps.date.outputs.as_of }}" \
            --fail-on-degraded \
            $SOURCES_ARG

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-health-${{ steps.date.outputs.as_of }}
          path: outputs/probe/health/${{ steps.date.outputs.as_of }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-health-failure-${{ steps.date.outputs.as_of }}
          path: |
            outputs/probe/health/${{ steps.date.outputs.as_of }}
            outputs/probe/intelligence/probe_ledger.jsonl
          retention-days: 7

name: Daily BVE Run

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "As-of date YYYY-MM-DD. Empty = today."
        required: false
        default: ""
      score_mode:
        description: "Score mode"
        required: true
        default: "provisional"
        type: choice
        options:
          - approved_only
          - provisional
          - all_auto
      lookback_days:
        description: "Lookback days for live ingestion"
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: bve-ledger
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,platform,extract,review]"

      - name: Resolve run variables
        id: vars
        shell: bash
        run: |
          AS_OF="${{ inputs.as_of_date }}"
          SCORE_MODE="${{ inputs.score_mode }}"
          LOOKBACK_DAYS="${{ inputs.lookback_days }}"

          if [ -z "$AS_OF" ]; then
            AS_OF="$(date -u +%F)"
          fi

          if [ -z "$SCORE_MODE" ]; then
            SCORE_MODE="provisional"
          fi

          if [ -z "$LOOKBACK_DAYS" ]; then
            LOOKBACK_DAYS="3"
          fi

          echo "as_of=$AS_OF"             >> "$GITHUB_OUTPUT"
          echo "score_mode=$SCORE_MODE"   >> "$GITHUB_OUTPUT"
          echo "lookback_days=$LOOKBACK_DAYS" >> "$GITHUB_OUTPUT"

      - name: Restore ledger from data branch
        shell: bash
        run: |
          mkdir -p outputs/intelligence

          git fetch origin data --depth=1 || true

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout origin/data -- outputs/intelligence/evidence_ledger.jsonl || true
          fi

          if [ ! -f outputs/intelligence/evidence_ledger.jsonl ]; then
            touch outputs/intelligence/evidence_ledger.jsonl
          fi

          echo "Ledger records before run:"
          wc -l outputs/intelligence/evidence_ledger.jsonl || true

      - name: Ledger health before run
        run: |
          bve-ledger-stats \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" || true

      - name: Validate ledger before run
        run: |
          bve-ledger-validate \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" || true

      - name: Smoke test (dry-run)
        run: |
          bve-weekly-run \
            --targets research/universe/targets.yaml \
            --acquirers research/universe/acquirers.yaml \
            --overrides research/universe/manual_overrides.yaml \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" \
            --score-mode "${{ steps.vars.outputs.score_mode }}" \
            --dry-run

      - name: Run daily BVE pipeline
        run: |
          bve-weekly-run \
            --targets research/universe/targets.yaml \
            --acquirers research/universe/acquirers.yaml \
            --overrides research/universe/manual_overrides.yaml \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" \
            --lookback-days "${{ steps.vars.outputs.lookback_days }}" \
            --score-mode "${{ steps.vars.outputs.score_mode }}" \
            --output "outputs/daily/${{ steps.vars.outputs.as_of }}" \
            --ingest-live

      - name: Ledger health after run
        run: |
          echo "Ledger records after run:"
          wc -l outputs/intelligence/evidence_ledger.jsonl || true
          bve-ledger-stats \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" || true

      - name: Validate ledger after run
        run: |
          bve-ledger-validate \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.vars.outputs.as_of }}" || true

      - name: Generate ledger manifest
        run: |
          bve-ledger-manifest \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --run-id "daily-${{ steps.vars.outputs.as_of }}" \
            --as-of "${{ steps.vars.outputs.as_of }}" \
            --output outputs/intelligence/ledger_manifest.json || true

      - name: Upload daily reports
        uses: actions/upload-artifact@v4
        with:
          name: bve-daily-${{ steps.vars.outputs.as_of }}
          path: outputs/daily/${{ steps.vars.outputs.as_of }}
          retention-days: 30

      - name: Persist ledger to data branch
        shell: bash
        run: |
          set -e

          git config user.name "bve-bot"
          git config user.email "bve-bot@noreply.github.com"

          # Copy ledger + manifest to temp location outside the working tree
          LEDGER_TMP="$RUNNER_TEMP/evidence_ledger.jsonl"
          MANIFEST_TMP="$RUNNER_TEMP/ledger_manifest.json"
          cp outputs/intelligence/evidence_ledger.jsonl "$LEDGER_TMP"
          cp outputs/intelligence/ledger_manifest.json "$MANIFEST_TMP" 2>/dev/null || true

          git fetch origin data || true

          # Switch to data branch (or create it as orphan if it does not exist)
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git switch -C data origin/data
          else
            git switch --orphan data
            git rm -rf . || true
          fi

          mkdir -p outputs/intelligence
          cp "$LEDGER_TMP" outputs/intelligence/evidence_ledger.jsonl
          [ -f "$MANIFEST_TMP" ] && cp "$MANIFEST_TMP" outputs/intelligence/ledger_manifest.json || true

          git add outputs/intelligence/evidence_ledger.jsonl
          git add outputs/intelligence/ledger_manifest.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "chore(data): update evidence ledger ${{ steps.vars.outputs.as_of }}"

            # Push with retry + rebase on conflict
            for attempt in 1 2 3; do
              if git push origin HEAD:data; then
                echo "Push succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin data
                git rebase origin/data || { echo "Rebase failed — aborting"; exit 1; }
              else
                echo "Push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bve-failure-${{ steps.vars.outputs.as_of }}
          path: |
            outputs/daily/${{ steps.vars.outputs.as_of }}
            outputs/intelligence/evidence_ledger.jsonl
          retention-days: 7

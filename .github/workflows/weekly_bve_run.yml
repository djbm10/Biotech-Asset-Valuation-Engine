name: Weekly BVE Run

on:
  schedule:
    - cron: "0 23 * * 0"   # Sundays 23:00 UTC
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "As-of date YYYY-MM-DD. Empty = today."
        required: false
        default: ""
      score_mode:
        description: "Score mode"
        required: true
        default: "provisional"
        type: choice
        options:
          - approved_only
          - provisional
          - all_auto
      lookback_days:
        description: "Lookback days for ingestion"
        required: true
        default: "14"

jobs:
  weekly-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve as-of date
        id: dates
        run: |
          if [ -z "${{ github.event.inputs.as_of_date }}" ]; then
            echo "as_of_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "as_of_date=${{ github.event.inputs.as_of_date }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve run parameters
        id: params
        run: |
          SCORE_MODE="${{ github.event.inputs.score_mode }}"
          LOOKBACK="${{ github.event.inputs.lookback_days }}"
          echo "score_mode=${SCORE_MODE:-provisional}" >> "$GITHUB_OUTPUT"
          echo "lookback_days=${LOOKBACK:-14}"         >> "$GITHUB_OUTPUT"

      - name: Run weekly BVE pipeline
        run: |
          bve-weekly-run \
            --targets research/universe/targets.yaml \
            --acquirers research/universe/acquirers.yaml \
            --overrides research/universe/manual_overrides.yaml \
            --ledger outputs/intelligence/evidence_ledger.jsonl \
            --as-of "${{ steps.dates.outputs.as_of_date }}" \
            --lookback-days "${{ steps.params.outputs.lookback_days }}" \
            --score-mode "${{ steps.params.outputs.score_mode }}" \
            --ingest-live \
            --output "outputs/weekly/${{ steps.dates.outputs.as_of_date }}"

      - name: Upload weekly outputs
        uses: actions/upload-artifact@v4
        with:
          name: weekly-bve-output-${{ steps.dates.outputs.as_of_date }}
          path: outputs/weekly/${{ steps.dates.outputs.as_of_date }}
          if-no-files-found: error

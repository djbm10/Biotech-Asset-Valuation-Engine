name: VRTX / REGN Historical Backtest

on:
  workflow_dispatch:
    inputs:
      snapshot_days:
        description: "Snapshot windows (space-separated integers)"
        required: false
        default: "365 180 90 30"
      min_negatives:
        description: "Minimum hard negatives per positive"
        required: false
        default: "30"
      include_unverified_deals:
        description: "Include unverified deals (true/false)"
        required: false
        default: "false"
      score_mode:
        description: "Score mode"
        required: false
        default: "approved_only"
        type: choice
        options:
          - approved_only
          - provisional
          - structural
          - evidence_backed

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Test gate
  # ─────────────────────────────────────────────────────────────────────────
  tests:
    name: Run backtest research tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run backtest research tests
        run: |
          python -m pytest tests/backtest_research/ -v --tb=short

      - name: Run lint on backtest_research module
        run: |
          ruff check src/bve/backtest_research/

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build dataset
  # ─────────────────────────────────────────────────────────────────────────
  build-dataset:
    name: Build curated dataset
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build dataset
        run: |
          SNAPSHOT_DAYS=$(echo "${{ github.event.inputs.snapshot_days }}" | tr ' ' '\n' | paste -sd' ')
          UNVERIFIED_FLAG=""
          if [ "${{ github.event.inputs.include_unverified_deals }}" = "true" ]; then
            UNVERIFIED_FLAG="--include-unverified-deals"
          fi
          python -m bve.backtest_research.vrtx_regn_dataset_builder \
            --since 2010 \
            --acquirers VRTX REGN \
            --snapshot-days ${{ github.event.inputs.snapshot_days || '365 180 90 30' }} \
            --min-negatives ${{ github.event.inputs.min_negatives || '30' }} \
            --output research/backtests/vrtx_regn_2010/curated \
            --raw-dir research/backtests/vrtx_regn_2010/raw \
            --rnpv-config-dir research/backtests/vrtx_regn_2010/rnpv_configs \
            $UNVERIFIED_FLAG

      - name: Upload curated dataset
        uses: actions/upload-artifact@v4
        with:
          name: vrtx-regn-curated-dataset
          path: |
            research/backtests/vrtx_regn_2010/curated/
            research/backtests/vrtx_regn_2010/rnpv_configs/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Run backtest
  # ─────────────────────────────────────────────────────────────────────────
  run-backtest:
    name: Run backtest and generate report
    runs-on: ubuntu-latest
    needs: build-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download curated dataset
        uses: actions/download-artifact@v4
        with:
          name: vrtx-regn-curated-dataset
          path: research/backtests/vrtx_regn_2010/

      - name: Run backtest
        run: |
          python -m bve.backtest_research.vrtx_regn_backtest_runner \
            --dataset research/backtests/vrtx_regn_2010/curated \
            --score-mode ${{ github.event.inputs.score_mode || 'approved_only' }} \
            --output research/backtests/vrtx_regn_2010/outputs

      - name: Verify leakage audit passed
        run: |
          python -c "
          import csv, sys
          audit = list(csv.DictReader(open('research/backtests/vrtx_regn_2010/outputs/vrtx_regn_leakage_audit.csv')))
          if not audit:
              print('ERROR: leakage audit file is empty')
              sys.exit(1)
          status = audit[0].get('status', '')
          if status != 'PASSED':
              print(f'ERROR: leakage audit status={status!r} (expected PASSED)')
              sys.exit(2)
          violations = int(audit[0].get('violations', 1))
          if violations > 0:
              print(f'ERROR: {violations} leakage violations found')
              sys.exit(3)
          print('Leakage audit: PASSED')
          "

      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: vrtx-regn-backtest-outputs
          path: |
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_backtest_results.csv
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_backtest_report.md
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_leakage_audit.csv
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_error_review.csv
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_source_audit.md
            research/backtests/vrtx_regn_2010/outputs/vrtx_regn_metrics_summary.csv
            research/backtests/vrtx_regn_2010/curated/vrtx_regn_research_gaps.csv
          retention-days: 90

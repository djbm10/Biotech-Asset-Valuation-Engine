no_lookahead_attestation: >
  Mechanically selected diagnostic control ("multi-asset company").
  NUPLAZID's DRP sNDA had an original PDUFA date of 2021-04-03 (2 days after
  this snapshot) and received a Complete Response Letter on 2021-04-05 --
  both postdate the snapshot and are excluded by design: DRP is not modeled
  as a trial in this config at all (only the already-approved NUPLAZID PDP
  indication is modeled), so the near-miss is structurally excluded rather
  than merely asserted excluded. The genuinely pre-cutoff 2021-03-08
  deficiency-notice disclosure (FDA notified Acadia 2021-03-03; disclosed
  2021-03-08, 24 days before the snapshot) is documented for completeness
  but does not enter any success_probability in this config.


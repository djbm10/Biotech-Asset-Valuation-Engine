    source_publication_date: "2017-11-07"
    knowable_date: "2017-11-07"
    confidence: "High"
    assumption_type: "directly_reported"
    notes: >
      3.00% Convertible Senior Notes due 2021-10-01 (issued Sept 2014,
      $?principal), carrying value $140.4M as of 2017-09-30. The filing
      separately discloses a fair value of the principal amount of $751.4M
      as of the same date (deeply in-the-money given the ~$85 share price)
      -- this is a valuation-of-the-notes disclosure, not a second debt

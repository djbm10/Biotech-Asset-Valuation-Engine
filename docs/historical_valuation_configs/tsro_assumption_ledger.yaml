      six-name report, to prevent this control from being misread as "the
      market undervalued this asset and a later takeout confirmed a higher
      value." The $75.00 deal price was a premium to a depressed 30-day
      VWAP of $35.67 reached after a substantial 2018 stock decline, not a
      premium to the Dec 2017 level used as this config's entry price.


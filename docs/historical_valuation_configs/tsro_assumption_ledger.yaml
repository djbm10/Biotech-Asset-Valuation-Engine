  - slug: "eventual_acquisition_below_entry_price_finding"
    value: "GSK acquisition (announced 2018-12-03) = $75.00/share cash, below this config's $85.16/share entry price"
    unit: "qualitative_finding"
    source: "GSK/TESARO merger announcement, 2018-12-03 (public, postdates this snapshot)"
    source_publication_date: "2018-12-03"
    knowable_date: "2018-12-03"
    confidence: "High"
    assumption_type: "directly_reported"
    notes: >
      Documented plainly per instruction, NOT used as an input to this
      config (it postdates the 2017-12-01 snapshot and would be a lookahead

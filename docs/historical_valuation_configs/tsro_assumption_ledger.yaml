schema_version: 1
ticker: "TSRO"
asset_id: "tsro-zejula-pit-2017q4"
historical_snapshot_date: "2017-12-01"
no_lookahead_attestation: >
  Mechanically selected diagnostic control ("late-stage positive /
  eventually-acquired company"), tie-broken to the earliest
  historical_snapshot_date among {ARRY, LOXO, THOR, TSRO} in the frozen
  corporate_action_roster:acquired category. TESARO was subject to
  recurring, multi-year takeover speculation (2016 Gilead rumors; Feb 2017
  Sanofi rumors and a board "strategic alternatives" review) bracketing
  this snapshot, with a much sharper, better-documented speculation spike
  starting 2018-11-16 -- over 11 months AFTER this snapshot -- leading to
  the 2018-12-03 GSK acquisition announcement. No dated news item placing
  ACTIVE M&A speculation specifically within Oct-Dec 2017 was found. This
  snapshot date is therefore stated as the BEST-AVAILABLE, not a provably
  rumor-free, date -- a hedged limitation, parallel to (not resolved the
  way) the CEMP ledger's own hedged price-sourcing caveat.

assumptions:

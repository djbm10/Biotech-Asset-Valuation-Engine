# Historical Backtest: Incyte Corporation / INCB018424 (ruxolitinib / Jakafi)
# ===========================================================================
# Analysis date: ~January 2010
# COMFORT-I Phase 3 trial (NCT00952289) recently initiated; COMFORT-II starting Q1 2010
#
# PURPOSE: Run our model as of 2010 and compare predictions to actual outcomes.
#   Predicted:
#     P(approval): model estimate
#     Peak sales (MF indication): model estimate
#     rNPV and NAV/share
#   Actual:
#     FDA approved: November 16, 2011 (myelofibrosis)
#     2012 US net revenue: $214M
#     2013 US net revenue: $448M
#     2014 US net revenue: $679M
#     2015 US net revenue: $901M (includes PV expansion approved Dec 2014)
#     Incyte market cap 2010: ~$2.5B; at approval (2011): ~$5.5B
#
# Data sources:
#   - NIH: MF prevalence ~60,000 US (but addressable/treated ~15,000-20,000)
#   - JAK2 mutation frequency: ~95% JAK2V617F, 5% CALR/other — all ruxolitinib-eligible
#   - Incyte 10-K 2009: cash ~$450M (after December 2009 Eli Lilly license deal)
#   - Shares outstanding 2010: ~200M
#   - Price Jan 2010: ~$10.50
#   - Ruxolitinib WAC 2011 launch: ~$115,000/yr; G2N ~20% -> net ~$92,000
#
# What the model does/doesn't capture:
#   - CAPTURES: Phase 3 POS for well-validated JAK2 target; symptomatic MF market
#   - DOES NOT CAPTURE: Polycythemia vera expansion (approved Dec 2014)
#   - Does not model graft-vs-host disease approval (2019)
#   - MF-only model understates Jakafi lifetime value by ~3x (label expansions)

asset:
  id: "ruxolitinib-mf"
  name: "ruxolitinib (INCB018424)"
  indication: "Myelofibrosis (intermediate/high-risk), US"
  therapeutic_area: "oncology"
  stage: "phase_3"
  modality: "small_molecule"
  mechanism_of_action: "JAK1/JAK2 inhibitor — first JAK inhibitor in hematologic malignancies"
  discount_rate: 0.10
  royalty_rate: 0.0
  upcoming_catalysts:
    - description: "COMFORT-I Phase 3 interim analysis — SVR35 primary endpoint"
      expected_date: "2010-Q4"
      catalyst_type: "readout"
    - description: "COMFORT-I Phase 3 primary results"
      expected_date: "2011-Q1"
      catalyst_type: "readout"
    - description: "NDA submission for intermediate/high-risk MF"
      expected_date: "2011-Q3"
      catalyst_type: "regulatory"
    - description: "PDUFA date / FDA approval decision"
      expected_date: "2011-Q4"
      catalyst_type: "regulatory"
  differentiation_notes: >
    First approved JAK inhibitor. MF has historically had no approved therapies;
    hydroxyurea is used off-label but does not modify disease. Ruxolitinib shows
    40-50% spleen volume reduction in >35% of patients (vs. <1% with placebo).

company:
  id: "incy-2010"
  name: "Incyte Corporation"
  ticker: "INCY"
  cash_millions: 450.0
  debt_millions: 0.0
  shares_outstanding_millions: 200.0
  burn_rate_millions_per_quarter: 55.0
  current_price: 10.50

trials:
  - phase: "phase_3"
    nct_id: "NCT00952289"
    success_probability: 0.50  # placeholder — POS model overrides
    duration_years: 1.5
    cost_millions: 120.0       # Two Phase 3 trials (COMFORT-I + COMFORT-II)
    enrollment: 309
    primary_endpoint: "Spleen volume reduction ≥35% at Week 24 (SVR35)"
    endpoint_type: "surrogate_validated"
    notes: "COMFORT-I (US) and COMFORT-II (EU) running concurrently."
  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.50
    duration_years: 0.75
    cost_millions: 10.0
    enrollment: null
    primary_endpoint: "NDA approval for intermediate/high-risk MF"
    endpoint_type: "hard_clinical"

market_model:
  # MF addressable population: ~16,000 symptomatic, intermediate/high-risk US patients
  # Source: Mesa et al. 2007 Blood; ASH 2009 abstracts
  addressable_patients_annual: 16000
  net_price_per_patient_usd: 92000   # $115K WAC × (1 - 20% G2N)
  peak_penetration: 0.55
  years_to_peak: 4
  patent_life_years: 12              # Launch ~2012 through ~2024
  compliance_rate: 0.80
  cogs_rate: 0.18
  sgna_rate_launch: 0.40
  sgna_rate_mature: 0.20

pos_adjusters:
  apply_pos_model: true
  phase_3:
    endpoint_type: "surrogate_validated"
    moa_precedent: "novel"
    sample_size_adequacy: "adequate"
    safety_profile: "minor"
    competitive_pressure: "low"
    biomarker_selected_population: false
    strong_prior_phase_data: true
    has_breakthrough_designation: false
  nda_bla:
    endpoint_type: "hard_clinical"
    moa_precedent: "partial"
    sample_size_adequacy: "adequate"
    safety_profile: "minor"
    competitive_pressure: "low"

sources:
  addressable_patients:
    confidence: "Medium"
    notes: "MF prevalence estimates vary widely; using treated/addressable subset"
  net_price:
    confidence: "Medium"
    notes: "2011 launch WAC back-calculated; specialty hem G2N ~20%"
  peak_penetration:
    confidence: "Low"
    notes: "No prior JAK inhibitor launch comp available; using hematology analogue"

limitations:
  - "MF indication only. PV approval (Dec 2014) and GvHD approval (2019) not modeled."
  - "US-only. Jakavi (EU) approved 2012 added significant OUS revenue."
  - "Cytopenias not modeled as a driver of discontinuation ceiling."

thesis_changers:
  - "COMFORT-I fails to meet 35% SVR threshold → full thesis collapse."
  - "FDA raises bar to OS endpoint only → delays by 2-3 years."
  - "Competing JAK inhibitor achieves positive Phase 3 simultaneously."

analyst_notes: >
  HISTORICAL BACKTEST — 2010 analysis. Represents what a 2010 analyst could model.

  Key modeling insight: the pricing gap is the main calibration lesson. An analyst in 2010
  anchoring to RA JAK inhibitor pricing ($30K/yr) would predict ~$440M peak vs. actual
  $901M+ (2015). The model using correct orphan/hematology pricing (~$92K net) is much
  more accurate. See actual_revenue.yaml for full year-by-year comparison.

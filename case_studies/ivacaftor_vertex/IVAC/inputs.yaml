# Historical Backtest: Vertex Pharmaceuticals / VX-770 (ivacaftor / Kalydeco)
# ============================================================================
# Analysis date: ~January 2010
# STRIVE Phase 3 trial (NCT00909311) enrolling; ENVISION Phase 3 not yet started
# G551D gating mutation CF cohort
#
# PURPOSE: Run our model as of 2010 and compare predictions to actual outcomes.
#   - Predicted P(approval)
#   - Predicted peak sales
#   - Predicted rNPV and NAV/share
#   vs.
#   - Actual: FDA approved January 31, 2012
#   - Actual peak sales (G551D monotherapy): ~$370M (2012), ~$480M (2013)
#   - Vertex market cap 2010: ~$3.2B (includes pipeline; VX-770 was lead asset)
#
# Data sources:
#   - CF Foundation Patient Registry 2009: ~30,000 CF patients in US
#   - G551D frequency: 4-5% of CF patients = ~1,200-1,500 US patients (ages 6+)
#   - STRIVE Phase 2 results (NEJM 2010): FEV1 improvement +10.4pp; near-complete
#     SwCl normalization. Strongest Phase 2 signal seen in CF at the time.
#   - VX-770 WAC 2012: ~$294,000/yr; G2N ~20% -> net ~$235,000/yr
#   - Vertex cash (2010 10-K): ~$1.4B (includes milestone payments from J&J/Tibotec)
#   - Shares outstanding 2010: ~244M
#   - Vertex price Jan 2010: ~$13.00
#
# What the model does/doesn't capture:
#   - CAPTURES: Phase 3 POS given clean Phase 2 signal; addressable G551D population;
#     orphan drug pricing and penetration ceiling
#   - DOES NOT CAPTURE: label expansion to other gating mutations (2014); Orkambi
#     combination revenue; global ex-US revenues (Europe approved 2012)
#   - G551D-only model understates total Kalydeco revenue by ~2-3x at peak

asset:
  id: "vx770-g551d"
  name: "VX-770 (ivacaftor)"
  indication: "Cystic fibrosis — G551D gating mutation, US"
  therapeutic_area: "rare_disease"
  stage: "phase_3"
  modality: "small_molecule"
  mechanism_of_action: "CFTR potentiator — opens G551D-mutant CFTR channel"
  discount_rate: 0.10
  royalty_rate: 0.0
  upcoming_catalysts:
    - description: "STRIVE Phase 3 results — FEV1 improvement vs placebo (primary readout)"
      expected_date: "2011-Q2"
      catalyst_type: "readout"
    - description: "FDA NDA submission for G551D CF"
      expected_date: "2011-Q3"
      catalyst_type: "regulatory"
    - description: "PDUFA date / FDA approval decision"
      expected_date: "2012-Q1"
      catalyst_type: "regulatory"
  differentiation_notes: >
    First CFTR potentiator. G551D patients have near-zero CFTR channel function;
    ivacaftor restores ~35-40% normal CFTR activity. Phase 2 showed SwCl normalization
    in 90% of patients — an unprecedented pharmacodynamic signal in CF.
    No competition at launch in G551D (no other potentiators approved).

company:
  id: "vrtx-2010"
  name: "Vertex Pharmaceuticals"
  ticker: "VRTX"
  cash_millions: 1400.0       # ~$1.4B cash + investments at end of 2009
  debt_millions: 0.0
  shares_outstanding_millions: 244.0
  burn_rate_millions_per_quarter: 110.0  # ~$440M annualized R&D + G&A spend
  current_price: 13.00        # ~Jan 2010 price

trials:
  - phase: "phase_3"
    nct_id: "NCT00909311"
    success_probability: 0.50  # placeholder (POS model will override)
    duration_years: 1.5        # STRIVE enrolled rapidly; 48-week primary endpoint
    cost_millions: 85.0        # Phase 3 CF trials; ~250 patient enrollment
    enrollment: 161            # STRIVE actual enrollment (G551D, ages 12+)
    primary_endpoint: "FEV1 improvement at 24 weeks vs. placebo"
    endpoint_type: "surrogate_validated"
    notes: "STRIVE; NCT00909311. 24-week DB + 24-week OLE. FEV1 is well-accepted by FDA."
  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.50  # placeholder
    duration_years: 0.75       # rapid review expected (orphan + breakthrough signals)
    cost_millions: 15.0
    enrollment: null
    primary_endpoint: "NDA approval"
    endpoint_type: "hard_clinical"

market_model:
  # G551D US patient population derivation:
  #   US CF patients: ~30,000 (CF Foundation Registry 2009)
  #   G551D frequency: 4.7% of CF patients = ~1,410 patients
  #   Ages 6+: ~85% of patient population = ~1,200 eligible (label was 12+ initially,
  #   later expanded to 6+; using 6+ for peak penetration estimate)
  # Source: CF Foundation Patient Registry Annual Data Report 2009
  addressable_patients_annual: 1200
  # Net price derivation:
  #   2012 WAC: ~$294,000/yr
  #   G2N for rare disease: ~20% (lower than typical; captive population)
  #   Net price: $294K × (1 - 0.20) = ~$235K
  # Source: Medispan WAC 2012; specialty pharma G2N benchmarks
  net_price_per_patient_usd: 235000
  peak_penetration: 0.88       # Near-complete penetration expected (symptomatic, near-curative)
  years_to_peak: 3             # Rapid uptake for first therapy in molecularly-defined subgroup
  patent_life_years: 12        # From projected launch (2012) through 2024; original patent
  compliance_rate: 0.90        # High for effective chronic therapy in serious disease
  cogs_rate: 0.12              # Small molecule, orphan scale COGS
  sgna_rate_launch: 0.30       # Smaller CF specialty force; lower SG&A than oncology
  sgna_rate_mature: 0.15

pos_adjusters:
  apply_pos_model: true
  phase_3:
    endpoint_type: "surrogate_validated"  # FEV1 change — well-validated by FDA in CF
    moa_precedent: "novel"               # First CFTR potentiator; no precedent
    sample_size_adequacy: "adequate"     # 161 patients; powered for endpoint
    safety_profile: "clean"             # Phase 2: clean; no SAEs; headache/URI only
    competitive_pressure: "low"         # No approved competitors in G551D
    biomarker_selected_population: true # G551D genotype selection
    strong_prior_phase_data: true       # Exceptional Phase 2: SwCl normalization in 90%
    has_breakthrough_designation: false # BTD didn't exist until 2012
  nda_bla:
    endpoint_type: "hard_clinical"
    moa_precedent: "partial"
    sample_size_adequacy: "adequate"
    safety_profile: "clean"
    competitive_pressure: "low"

sources:
  addressable_patients:
    confidence: "High"
    notes: "CF Foundation Registry 2009; G551D frequency well-characterized by genotyping programs"
  net_price:
    confidence: "Medium"
    notes: "2012 WAC projection from rare disease pricing comps; actual $294K matched"
  peak_penetration:
    confidence: "Medium"
    notes: "Estimated from near-curative efficacy and lack of alternatives; actual was ~90%+"

limitations:
  - "G551D only. Excludes label expansion to F508del (Orkambi 2015) and all other gating mutations (2014)."
  - "US-only. EU approval 2012 added ~$200M+ additional revenue."
  - "Analysis date 2010: STRIVE data not yet available; relying on Phase 2 signal quality."
  - "Does not model Trikafta (triple combo, 2019) — transforms VX-770 from standalone to combo anchor."

thesis_changers:
  - "Phase 3 FEV1 improvement < 5pp (vs Phase 2 10.4pp) → probability collapses."
  - "Safety signal in Phase 3 (hepatotoxicity or cardiac) → program at risk."
  - "FDA requires additional pediatric data at NDA → 6-month delay + cost."
  - "STRIVE FAILS (>10% FEV1 threshold not met) → full thesis collapse."

analyst_notes: >
  HISTORICAL BACKTEST — 2010 analysis. This config represents what a 2010 analyst would
  have had access to: Phase 2 SwCl and FEV1 data, G551D population census, and orphan
  pricing precedents. The model DOES NOT have access to Phase 3 data.

  Key insight: the Phase 2 pharmacodynamic signal (SwCl normalization in 90%) was
  extraordinarily clean by CF standards. An analyst in 2010 with access to that data
  and knowledge of CF biology would have assigned higher-than-prior POS — exactly
  what our biomarker_selected + strong_prior_phase_data adjusters are designed to capture.

  ACTUAL OUTCOMES (for comparison): see actual_revenue.yaml
    Approval: January 31, 2012 (FDA approved ~12 months after NDA submission)
    P(approval) actual: 100% (this is the ground truth)
    Peak sales G551D-only: ~$469M (2015, all gating mutations combined)
    Vertex market cap at approval (2012): ~$14B
    Vertex price 2010 → 2012: $13 → $73 (+462%)

source: "Merck & Co. 10-K Annual Reports 2014–2020 (worldwide Keytruda segment)"
# Actual commercial outcomes for Pembrolizumab (Keytruda)
# Source: Merck & Co. Annual Reports 2014–2020 (10-K filings)
# Note: Merck reports worldwide Keytruda revenues. US revenues estimated at ~55-60%
#       of global revenues based on geographic segment disclosures.
#       Model scope: ipi-refractory melanoma (2nd-line US). Actual revenues include
#       all indications as they were added (NSCLC 2015, MSI-H 2017, etc.).

asset_name: "Pembrolizumab / Keytruda (MK-3475) — All indications (US ~55% of global)"
approval_year: 2014
actual_pos_outcome: "approved"

revenue_by_year:
  2014: 51       # Partial year: FDA approved Sep 4, 2014; ~4 months; melanoma only
  2015: 566      # First full year; melanoma 1L expansion; still predominantly melanoma
  2016: 1402     # NSCLC (PD-L1 ≥50%) approved Oct 2016; major step-up
  2017: 3809     # NSCLC all-comer; MSI-H pan-tumor; gastric; HNSCC
  2018: 7171     # NSCLC 1L combos; bladder; cervical; HCC; continued penetration
  2019: 11084    # RCC combo; TNBC; TMB-H pan-tumor; endometrial
  2020: 14380    # COVID-delayed procedures; CRC MSI-H; TNBC adjuvant

peak_year: 2023
peak_revenue_millions: 25011   # 2023 global Keytruda revenues (all indications, worldwide)

actual_pos_outcome: "approved"

calibration_note: >
  For meaningful calibration, compare model predictions against 2014 and 2015 revenues only.
  The model captures ipi-refractory melanoma (initial indication): predicted peak ~$253M.
  Actual melanoma-only US revenues 2015: ~$250-300M (estimated; Merck does not break out
  by indication, but melanoma was dominant in 2014-2015 before NSCLC contribution).
  The model CORRECTLY predicts the melanoma-only revenue. The 50x+ divergence in later
  years reflects label expansions — precisely what multi-indication modeling captures.

notes: >
  Keytruda is the paradigm case for multi-indication value creation. A 2014 analyst
  modeling only the initial melanoma indication would have predicted a $250-350M peak
  asset — a fraction of actual value. The revenue divergence from 2016 onward is driven
  entirely by label expansions (NSCLC, MSI-H, 30+ additional indications) and global
  pricing power expansion. Source: Merck 10-K 2014–2020; worldwide Keytruda segment revenues.

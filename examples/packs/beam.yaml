modeled_assets:
  - bucket_id: "beam_beam101"
    label: "BEAM-101 — Sickle Cell Disease (base editing, BCL11A enhancer, Ph1/2)"
    value_millions: 1200.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/beam_beam101.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.58
    corroboration_count: 1
    corroboration_refs:
      - "BEAM-101 Ph1/2 interim: 7/7 patients HbF >40%, transfusion-free at 6mo (BEACON 2024)"
    notes: >
      Base editing of BCL11A enhancer in HSCs to reactivate fetal hemoglobin. Ph1/2 BEACON
      interim (2024): 100% HbF induction, transfusion-free in all treated patients at 6mo.
      SCD gene therapy market: ~$3-4B peak (vs $2.2M Casgevy, ~1000 patients/yr addressable).
      Competitive: Casgevy (CRISPR) + LentiGlobin (bluebird). Base editing may offer
      differentiated safety (no DSBs). rNPV: Ph3 POS 60%, peak $800M, 12y exclusivity, 11%.

  - bucket_id: "beam_beam201"
    label: "BEAM-201 (CABA-201) — T-cell malignancies + autoimmune (allo CAR-T, Ph1)"
    value_millions: 800.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/beam_beam201.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.48
    corroboration_count: 1
    corroboration_refs:
      - "BEAM-201 Ph1 interim ASCO 2025: 4/4 CAR-T patients in autoimmune MRD-negative remission"
    notes: >
      Allogeneic base-edited CD7 CAR-T. Ph1 in r/r T-cell malignancies + autoimmune
      (SLE, myositis). Autoimmune CAR-T space very hot (Kyverna, Cabaletta competing).
      BEAM-201 interim data shows deep responses. rNPV accounts for competitive crowding
      in auto-immune CAR-T and Ph1 early stage. Wide uncertainty band.

  - bucket_id: "beam_beam302"
    label: "BEAM-302 — Alpha-1 Antitrypsin Deficiency (in vivo base editing, Ph1)"
    value_millions: 500.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/beam_beam302.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.42
    corroboration_count: 0
    corroboration_refs: []
    notes: >
      In vivo base editing of Z-AAT mutation in liver. First in vivo base editing program
      in humans. Ph1 dose escalation. If PiZZ correction is durable, TAM is large (~100k
      AATD patients). Very early; POS ~30% given novelty of in vivo base editing delivery.
      Option value only at this stage.


modeled_assets:
  - bucket_id: "bmrn_voxzogo"
    label: "Voxzogo (vosoritide) — Achondroplasia (approved, commercial)"
    value_millions: 4800.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/bmrn_voxzogo.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.88
    corroboration_count: 2
    corroboration_refs:
      - "BMRN 2025 full-year Voxzogo revenue $450M"
      - "SVB Leerink peak sales est $1.8B achondroplasia"
    notes: >
      Approved 2021 EU, 2022 US for achondroplasia (growth restriction). Daily SC injection.
      First disease-modifying therapy. ~250k patients globally, ~10k new/yr in US.
      Revenue ~$450M in 2025, growing ~30%/yr. Peak sales estimate $1.5-2B. 12y patent
      life, discount 10%, rNPV on full commercial trajectory. Oral formulation in Ph1 —
      potential label-expanding upgrade.

  - bucket_id: "bmrn_roctavian"
    label: "Roctavian (valoctocogene roxaparvovec) — Hemophilia A gene therapy"
    value_millions: 400.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/bmrn_roctavian.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.45
    corroboration_count: 1
    corroboration_refs:
      - "FDA approval June 2023; EU conditional approval 2022"
    notes: >
      First gene therapy for hemophilia A. FDA approved June 2023 ($2.9M list price).
      Commercial uptake materially below expectations — durability concerns (Factor VIII
      levels declining 2-3yr post-treatment), payer outcomes-based contract challenges.
      Revenue ~$50M 2025 (vs $500M+ peak expectation). Massively de-risked downward.
      rNPV now reflects slow-ramp durability-limited scenario. May be an option value.

  - bucket_id: "bmrn_rare_enzymes"
    label: "Rare disease enzyme portfolio (Naglazyme, Palynziq, Brineura, Aldurazyme)"
    value_millions: 3200.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/bmrn_rare_enzymes.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.85
    corroboration_count: 1
    corroboration_refs:
      - "BMRN 2025 earnings: combined rare enzyme revenue ~$700M"
    notes: >
      Mature ultra-rare disease franchise: Naglazyme (MPS VI), Palynziq (PKU adults),
      Brineura (CLN2), Aldurazyme (MPS I, co-promote with Genzyme/Sanofi). Combined
      ~$700M revenue, high margins, slow growth/decline. rNPV on 10y remaining cash
      flows with moderate erosion assumption. Stable but not a growth driver.

  - bucket_id: "bmrn_bmn307"
    label: "BMN 307 — PKU (gene therapy, Ph3 PHEARLESS)"
    value_millions: 900.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/bmrn_bmn307.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.60
    corroboration_count: 0
    corroboration_refs: []
    notes: >
      AAV5 gene therapy for PKU. Ph3 PHEARLESS ongoing. Palynziq already approved (ERT).
      Gene therapy could offer functional cure (~normal Phe levels). ~16k PKU patients
      in US eligible. Readout 2026-Q3. POS ~55% given Ph2 data. rNPV: peak $600M
      (competitive with Palynziq; pricing at $2-3M one-time).


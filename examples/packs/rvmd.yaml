modeled_assets:
  - bucket_id: "rvmd_rmc6236_nsclc"
    label: "RMC-6236 (pan-RAS(ON)) — NSCLC (KRAS mut, Ph3 RASQ-LUNG)"
    value_millions: 3800.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/rvmd_rmc6236_nsclc.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.72
    corroboration_count: 1
    corroboration_refs:
      - "SVB Leerink RVMD initiation: RMC-6236 peak sales NSCLC $2.5B est"
    notes: >
      RMC-6236 is a RAS(ON) multi-selective inhibitor covering KRASG12X, NRASG12X, and HRASG12X
      mutations. Phase 3 RASQ-LUNG trial in KRAS-mutant NSCLC (2L+). KRAS mutations in ~30%
      NSCLC (~50k US patients/yr). Base-rate Ph3 NSCLC POS ~45%. rNPV: peak US+EU sales
      ~$2.5B, 12y patent life, 10.5% discount, unpartnered (RVMD retains full rights).

  - bucket_id: "rvmd_rmc6236_pdac"
    label: "RMC-6236 — PDAC (KRAS mut, Ph3 RASQ-PDAC)"
    value_millions: 1400.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/rvmd_rmc6236_pdac.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.62
    corroboration_count: 0
    corroboration_refs: []
    notes: >
      Ph3 RASQ-PDAC in KRAS-mutant pancreatic cancer (2L). KRAS mut in ~90% PDAC.
      Very high unmet need — median OS ~6mo 2L. POS lower (~35%) given PDAC difficulty.
      rNPV: peak sales ~$1.2B (orphan-like pricing), separate from NSCLC program.
      Positive PDAC data would be significant de-risking for the platform.

  - bucket_id: "rvmd_rmc9805"
    label: "RMC-9805 (KRASG12D(ON)) — PDAC + CRC (Ph1/2)"
    value_millions: 600.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/rvmd_rmc9805.yaml:2026-04-09"

    corroboration_count: 0
    corroboration_refs: []
    notes: >
      G12D-selective RAS(ON) inhibitor. KRASG12D is most common mutation in PDAC (~40%).
      Phase 1/2; early clinical signals promising. Rule-of-thumb stage value.
      de-risking requires single-agent efficacy data.


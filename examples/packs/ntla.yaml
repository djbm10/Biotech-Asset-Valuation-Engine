      near-complete kallikrein suppression, attack-free at 6mo. HAE addressable:
      ~15k US patients, >$1B market. Competitive: berotralstat, garadacimab,
      donidalorsen. NTLA-2002 may offer permanent protection from single dose.
      Ph2/3 HAELO primary: attack rate reduction. rNPV: unpartnered, POS 62%,
      peak $1B, discount 10.5%.


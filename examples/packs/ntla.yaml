    corroboration_refs:
      - "NTLA-2001 Ph1: 93% TTR reduction at 12mo, durable single-dose"
      - "Regeneron collaboration: $150M upfront; co-develop + co-commercialize"
    notes: >
      In vivo CRISPR-Cas9 LNP editing of TTR gene in liver. Single-dose, durable
      TTR knockdown >90%. Ph3 MAGNITUDE vs placebo in hATTR polyneuropathy.
      Competitive: inclisiran (RNA interference, repeat dosing), vutrisiran (Alnylam).

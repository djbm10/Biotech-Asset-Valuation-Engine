modeled_assets:
  - bucket_id: "srpt_elevidys"
    label: "Elevidys (delandistrogene moxeparvovec) — Duchenne MD (gene therapy)"
    value_millions: 8500.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/srpt_elevidys.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.78
    corroboration_count: 2
    corroboration_refs:
      - "FDA full approval June 2024"
      - "Royalty Pharma $1.16B royalty financing implies ~$6B+ NPV floor"
    notes: >
      First gene therapy for Duchenne MD. Accelerated approval June 2023 based on
      dystrophin expression; full approval June 2024 for ambulatory DMD patients 4+.
      Confirmed benefit demonstrated in EMBARK trial. Label: ambulatory DMD patients
      4-7 (full approval) + accelerated for broader ambulatory population. ~$3.2M list
      price (one-time administration). Royalty Pharma deal ~$1.16B for royalties.
      Peak revenue $2-3B/yr as label expands. rNPV: 12y gene therapy exclusivity,
      discount 11% (higher given one-shot commercial model uncertainty), 80%
      P(label expansion to non-ambulatory).

  - bucket_id: "srpt_exon_skipping"
    label: "Exon-skipping franchise (casimersen, golodirsen, eteplirsen) — DMD"
    value_millions: 1800.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/srpt_exon_skipping.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.82
    corroboration_count: 1
    corroboration_refs:
      - "SRPT 2025 earnings: exon-skipping revenue $870M"
    notes: >
      Three approved exon-skipping therapies targeting exons 45, 53, and 51.
      Ongoing royalty and product revenue. Combined revenue ~$800-900M/yr.
      Maturing franchise; slower growth as Elevidys ramps. Exon skipping covers
      ~30% of DMD patients (exon 45/51/53 amenable). Patent life varies 2030-2035.
      rNPV on residual cash flow through 2030 with moderate decline curve.

  - bucket_id: "srpt_slrp001"
    label: "SRP-9001 broader DMD label expansion (non-ambulatory)"
    value_millions: 1200.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/srpt_slrp001.yaml:2026-04-09"

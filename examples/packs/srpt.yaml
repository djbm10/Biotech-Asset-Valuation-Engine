      Ph3 ENVISION trial in non-ambulatory DMD patients; readout expected 2026.
      Full label expansion to non-ambulatory represents ~3x patient population
      vs current approved label. ENVISION readout 2026 is the key de-risking
      event. Meaningful incremental rNPV on Elevidys franchise if label expands.


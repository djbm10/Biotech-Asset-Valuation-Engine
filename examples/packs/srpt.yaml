# SOTP check (manual reconciliation — why does model differ from market?):
#
#   Market cap:                    $9,500M
#   SOTP equity value:
#     Net cash (1800 - 2100):        -$300M  (net debt position)
#     Elevidys rNPV:               +$8,500M
#     Exon-skipping rNPV:          +$1,800M
#     ENVISION expansion rNPV:     +$1,200M
#     Platform:                      +$600M
#     Unmodeled pipeline:            +$300M
#     Dilution reserve:              -$476M  (≈5% dilution × $100 × 95.2M)
#     ────────────────────────────────────
#     SOTP total:                 ~$11,624M
#
#   SOTP discount:                ~+18% (model ~22% above market)
#
#   Assessment: Market is not fully pricing the Elevidys rNPV, likely due to:
#   (1) Uncertainty around payer access at $3.2M one-time price — commercial
#       adoption curve is unproven and coverage decisions are still evolving.
#   (2) Royalty debt reduces equity upside — $2.1B in financing obligations
#       creates a structural overhang even if Elevidys ramps as modeled.
#   (3) ENVISION binary risk — non-ambulatory label expansion (modeled at
#       $1.2B rNPV) is priced only partially given 55% P(positive).
#   Discount is moderate and defensible given the execution stage. A successful
#   ENVISION readout + 2026 Elevidys revenue beat would be the primary re-rating
#   catalysts. Thesis: market is applying an appropriate execution discount that
#   narrows as commercial proof points accumulate.

reviewer_state: "draft"

notes: >
  SRPT is the DMD franchise leader with the only approved gene therapy (Elevidys)
  and three approved exon-skipping products. Key debate: can Elevidys achieve peak
  penetration at $3.2M given payer budget sensitivity? The royalty financing
  structure with Royalty Pharma limits equity upside but provides non-dilutive
  capital. ENVISION readout is the highest-impact near-term catalyst.

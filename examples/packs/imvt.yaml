    confidence: 0.68
    corroboration_count: 1
    corroboration_refs:
      - "IMVT ADAPTMG Ph3 MG interim: primary endpoint met, QMG score improvement vs placebo"
    notes: >
      Batoclimab (anti-FcRn mAb) reduces IgG including pathogenic autoantibodies.
      Ph3 ADAPTMG: met primary endpoint (QMG score reduction). MG addressable ~65k US
      patients. Competitive: efgartigimod (argenx, approved), rozanolixizumab (UCB),
      nipocalimab (J&J Ph3). Late to market but differentiated dosing (SC monthly).
      rNPV: Ph3 POS 72% (met endpoint), peak $900M US+EU, 10y exclusivity, 10.5%.

  - bucket_id: "imvt_batoclimab_ted"
    label: "Batoclimab — Thyroid Eye Disease (FcRn inhibitor, Ph3 FORTIFY)"
    value_millions: 1400.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/imvt_batoclimab_ted.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.65
    corroboration_count: 1
    corroboration_refs:
      - "FORTIFY Ph3 enrollment complete; readout expected 2026-Q2"
    notes: >
      TED addressable: ~10k newly diagnosed patients/yr US. Tepezza (IGF-1R) approved
      (H-E by AbbVie/Horizon). FcRn mechanism reduces IgG-driven orbital inflammation.
      FORTIFY Ph3 primary: proptosis responder rate at 24 weeks. Competitive with
      Tepezza but different mechanism; potential for patients who fail/relapse.
      rNPV: POS 60%, peak $700M, 12y exclusivity.


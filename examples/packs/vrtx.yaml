# SOTP check (manual reconciliation — why does model differ from market?):
#
#   Market cap:                         $115,000M
#   SOTP equity value:
#     Net cash:                           +$9,500M  (12,000 - 2,500)
#     CF franchise rNPV:                 +$72,000M
#     Suzetrigine rNPV:                   +$8,500M
#     Casgevy rNPV:                       +$2,200M
#     Inaxaplin rNPV:                     +$3,800M
#     Platform:                           +$4,500M
#     Unmodeled:                          +$1,200M
#     Dilution reserve:                   -$2,322M  (≈2% dilution × $450 × 258M)
#     ─────────────────────────────────────────────
#     SOTP total:                       ~$99,378M
#
#   SOTP vs market:                    ~-$15,622M (model ~14% below market cap)
#   SOTP discount (market premium):    ~+16% (market trading above model)
#
#   Assessment: Model is deliberately conservative on suzetrigine (chronic pain
#   label not yet achieved; only acute pain approved) and platform (AAT, DM1
#   not modeled). Market is assigning a premium consistent with Vertex's track
#   record of execution, CF franchise durability, and pipeline conversion optionality.
#   The ~16% premium is not unreasonable given: (1) vanzacaftor extends CF exclusivity
#   to ~2037, (2) suzetrigine chronic pain readout could add $3B-5B peak sales,
#   (3) inaxaplin is a large unmet need with clear Ph2 signal. Not obviously mispriced;
#   premium is attributable to near-term catalysts and execution credibility.


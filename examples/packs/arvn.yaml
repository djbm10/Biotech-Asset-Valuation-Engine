modeled_assets:
  - bucket_id: "arvn_arv471"
    label: "ARV-471 (vepdegestrant) — ER+ breast cancer (PROTAC, Ph3 VERITAC-2, Pfizer partner)"
    value_millions: 2400.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/arvn_arv471.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.68
    corroboration_count: 2
    corroboration_refs:
      - "Pfizer partnership 2021: $650M upfront + $1.4B milestones"
      - "VERITAC-2 Ph3 enrollment complete; readout 2026-Q2"
    notes: >
      ARV-471 (vepdegestrant) is an ER PROTAC degrader. Partnered with Pfizer: ARVN
      receives tiered royalties ~20% + milestones. Ph3 VERITAC-2 in ER+/HER2- mBC 2L+
      vs fulvestrant. ER degradation is a validated mechanism (fulvestrant, elacestrant).
      POS 65% given Ph2 data (CBR 60%). ARVN receives royalties on net sales; rNPV on
      royalty stream + remaining milestones. Peak: $3B global sales, ARVN royalty rNPV.
      Key review question: Is $2.4B rNPV appropriate given ARVN receives royalties not
      direct sales? Pfizer retains majority economics but ARVN royalty stream on $3B peak
      sales at 20% = $600M/yr peak royalty — rNPV justifies the estimate.

  - bucket_id: "arvn_arv766"
    label: "ARV-766 (bavdegalutamide) — mCRPC (AR PROTAC, Ph2)"
    value_millions: 800.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/arvn_arv766.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.55
    corroboration_count: 1
    corroboration_refs:
      - "ARV-766 Ph2 data 2024: PSA50 response in enzalutamide-pretreated mCRPC"
    notes: >
      AR PROTAC for mCRPC. Differentiation: degrades full-length AR + AR splice variants
      (including AR-V7 which drives enzalutamide/abiraterone resistance). Ph2 data shows
      activity in treatment-resistant population. Unpartnered (ARVN retains full rights).
      Ph3 design pending partner/financing. rNPV: POS 50% to approval, peak $1.2B,
      unpartnered economics.

  - bucket_id: "arvn_arv102"
    label: "ARV-102 (LRRK2 PROTAC) — Parkinson's disease (Ph1)"
    value_millions: 300.0
    methodology: "rnpv"
    source_type: "modeled"
    source_ref: "bve-asset:configs/arvn_arv102.yaml:2026-04-09"
    as_of_date: "2026-04-09"
    confidence: 0.38
    corroboration_count: 0
    corroboration_refs: []
    notes: >
      LRRK2 PROTAC for PD. Phase 1. LRRK2 inhibitors validated (Denali, Biogen) but no
      PROTAC has reached this indication. Large unmet need. Early stage; option value only.


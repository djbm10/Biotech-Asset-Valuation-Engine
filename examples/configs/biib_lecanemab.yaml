# Historical Backtest: Biogen/Eisai — Lecanemab (LEQEMBI)
# =========================================================
# Analysis date: ~July 2022 (BLA filing under accelerated approval pathway)
# CLARITY AD Phase 3 trial complete (topline Sep 2022); Lecanemab-irmb BLA submitted Jan 2023
# Using analysis point of July 2022 when Phase 3 topline data were pending
#
# PURPOSE: Run our model as of July 2022 (Phase 3 in progress; Phase 2 data available)
#   Predicted:
#     P(approval): model estimate (~55%)
#     Peak net sales (confirmed early AD): model estimate
#     rNPV and NAV/share as of July 2022
#   Actual:
#     Accelerated approval: January 6, 2023 (amyloid reduction surrogate)
#     Traditional full approval: July 6, 2023 (CDR-SB clinical benefit confirmed in CLARITY AD)
#     2023 US net product revenue: $19M (slow launch; CMS coverage initially restricted NCD)
#     2024 US net product revenue: ~$250-300M (coverage expanded post-full approval)
#     BIIB shares July 2022: ~$230 (post-aducanumab write-down; market skeptical)
#
# What the model does/doesn't capture:
#   CAPTURES: Amyloid surrogate endpoint risk; CMS coverage uncertainty; restricted addressable
#   pool (amyloid confirmation required); CNS discount rates; elevated Phase 3 costs
#   DOES NOT CAPTURE: Global OUS markets (Japan: ~$500M/yr+); MCI pre-AD expansion;
#   combination therapy potential; pipeline follow-on assets
#
# Data sources:
#   - Early AD US prevalence: ~6.5M Alzheimer's patients; confirmed early (MCI + mild dementia): ~1.5M
#   - Amyloid PET/LP confirmed, treated, and covered: ~250K/yr (conservative; NCD restrictive)
#   - BIIB 10-K 2022: cash ~$4.8B; shares ~144M; price ~$230 (July 2022)
#   - LEQEMBI WAC at launch: $26,500/yr (Eisai Jan 2023); net ~$22,000-$24,000 (small rebates)
#   - Source: Alzheimer's Association 2022; IQVIA 2023; CMS NCD July 2023

asset:
  id: "lecanemab-ead"
  name: "lecanemab (LEQEMBI)"
  indication: "Early Alzheimer's Disease (MCI + Mild Dementia, Amyloid-Confirmed), US"
  therapeutic_area: "cns"
  stage: "nda_bla"
  modality: "biologic"
  mechanism_of_action: "Anti-amyloid beta (Aβ protofibrils) monoclonal antibody — selective binding to toxic soluble oligomers"
  discount_rate: 0.12           # Higher vs immunology; CNS development longer/riskier; CMS uncertainty
  royalty_rate: 0.0
  net_ownership: 0.55           # Biogen retains 55% economics; Eisai 45% (global collaboration)
  upcoming_catalysts:
    - description: "CLARITY AD Phase 3 topline results — CDR-SB at 18 months"
      expected_date: "2022-Q3"
      catalyst_type: "readout"
    - description: "BLA submission under accelerated approval (amyloid surrogate)"
      expected_date: "2023-Q1"
      catalyst_type: "regulatory"
    - description: "FDA accelerated approval decision"
      expected_date: "2023-Q1"
      catalyst_type: "regulatory"
    - description: "CMS National Coverage Determination (NCD) — key for Medicare access"
      expected_date: "2023-Q3"
      catalyst_type: "regulatory"
    - description: "Traditional full approval based on CLARITY AD clinical benefit"
      expected_date: "2023-Q3"
      catalyst_type: "regulatory"
  differentiation_notes: >
    Lecanemab is selective for soluble Aβ protofibrils (not plaques), distinguishing it
    from aducanumab (broad amyloid) and donanemab (plaques). CLARITY AD shows 27% slowing
    of CDR-SB progression at 18 months (p<0.001) — the first anti-amyloid to show
    statistically significant and clinically meaningful slowing in a Phase 3. However,
    ARIA (amyloid-related imaging abnormalities) affects ~21% (ARIA-E) and ~35% (ARIA-H)
    of treated patients, requiring MRI monitoring. CMS coverage under Expedited NCD process
    post-full approval is a key gating factor for commercial uptake.

company:
  id: "biib-2022"
  name: "Biogen Inc."
  ticker: "BIIB"
  cash_millions: 4800.0        # 10-K 2022: ~$4.8B cash + equivalents
  debt_millions: 7400.0        # Long-term debt from aducanumab manufacturing build
  shares_outstanding_millions: 144.0    # ~144M diluted; ~$230/share July 2022
  burn_rate_millions_per_quarter: 700.0 # ~$2.8B annualized (shared Biogen + Eisai cost structure)
  current_price: 230.0

trials:
  - phase: "nda_bla"
    nct_id: "NCT03887455"
    success_probability: 0.50   # placeholder — POS model overrides
    duration_years: 0.75        # BLA submitted Jan 2023; accelerated approval Jan 2023
    cost_millions: 25.0
    enrollment: null
    primary_endpoint: "CDR-SB (Clinical Dementia Rating Sum of Boxes) at 18 months — CLARITY AD Phase 3"
    endpoint_type: "surrogate_validated"
    notes: >
      CLARITY AD N=1,795. CDR-SB: -0.45 vs placebo (27% slowing; p<0.001).
      Amyloid reduction (PET): -55.48 centiloids (confirmed 3 days post-treatment).
      Full approval granted July 2023 based on confirmed clinical benefit from CDR-SB.
      Key safety concern: ARIA-E 12.6% symptomatic; 3 ARIA-related deaths in trial.

market_model:
  # Early AD addressable population derivation:
  #   Total Alzheimer's US: ~6.5M (Alzheimer's Association 2022)
  #   Early (MCI + mild dementia): ~3M (about 45% of total; lecanemab label population)
  #   Amyloid PET or LP confirmed positive: ~60% = ~1.8M
  #   Willing + able to infuse (biweekly IV): ~50% = ~900K total eligible
  #   Annual treated (new starts): ~250K/yr (conservative; NCD initially restricts to trials/coverage)
  # Source: Alzheimer's Association 2022; CMS NCD July 2023
  addressable_patients_annual: 250000
  net_price_per_patient_usd: 24000      # WAC $26,500; small managed care rebates; primarily Medicare
  peak_penetration: 0.08                # Coverage expansion uncertain; MRI monitoring burden; ARIA risk
  years_to_peak: 6                      # CMS NCD ramp; physician education; infusion capacity build
  patent_life_years: 12                 # Approval Jan 2023; composition of matter through ~2035
  compliance_rate: 0.72                 # Biweekly IV; ARIA monitoring discontinuations; ~28% dropout rate
  cogs_rate: 0.20                       # Biologic IV; manufacturing scale-up from Eisai plants
  sgna_rate_launch: 0.60                # Very high; CNS patient finding, amyloid testing support, MRI monitoring
  sgna_rate_mature: 0.35

  competition_model:
    competitors:
      - name: "donanemab (KISUNLA — Eli Lilly)"
        status: "phase_3"
        launch_year_relative: 1    # FDA approved Jul 2024 — ~1.5 yr after lecanemab
        peak_market_share: 0.35    # Shorter course (until amyloid cleared); may appeal to pts
        years_to_peak: 4
        approval_probability: 0.72
        use_s_curve: true
      - name: "aducanumab (ADUHELM — Biogen) — withdrawn"
        status: "approved"
        launch_year_relative: -2   # Approved Jun 2021; CMS restricts to trials; ~0 commercial share
        peak_market_share: 0.02    # Effectively no commercial share; price withdrawn Feb 2024
        years_to_peak: 1
        approval_probability: 1.0
        use_s_curve: false

pos_adjusters:
  apply_pos_model: true
  nda_bla:
    endpoint_type: "surrogate_validated"    # Amyloid reduction (surrogate) + CDR-SB clinical confirmation
    moa_precedent: "novel"                 # First efficacious anti-amyloid (aducanumab controversial)
    sample_size_adequacy: "large"          # N=1,795; well-powered for CDR-SB delta
    safety_profile: "minor"               # ARIA concerning but manageable; black-box unlikely
    competitive_pressure: "low"           # Donanemab not yet approved; aducanumab commercially irrelevant
    biomarker_selected_population: true   # Must be amyloid-confirmed — enriched population
    strong_prior_phase_data: true         # Phase 2 BAN2401-G000-201 showed dose-response on CDR-SB

sources:
  addressable_patients:
    confidence: "Low"
    notes: "CMS NCD severely constrained launch; addressable pool highly uncertain; using conservative 250K/yr"
  net_price:
    confidence: "High"
    notes: "WAC published Jan 2023 at $26,500; minimal rebates expected (Medicare dominant payer)"
  peak_penetration:
    confidence: "Low"
    notes: "CMS/commercial coverage, amyloid testing capacity, ARIA monitoring, patient burden all constrain"

limitations:
  - "CMS NCD dynamics (coverage for Medicare beneficiaries) not explicitly modeled — critical for uptake."
  - "ARIA monitoring burden and associated discontinuations may cap real-world penetration below model."
  - "US-only; Japan (major market; Eisai home territory; early access) and EU not modeled."
  - "Second anti-amyloid modality (phospho-tau, α-synuclein combination) not considered."
  - "Biogen 55% economics modeled; Eisai share of global profits not included."

thesis_changers:
  - "CMS issues restrictive NCD limiting coverage to clinical trials → commercial launch fails."
  - "ARIA-related deaths increase or new safety signals force black-box warning → prescriber avoidance."
  - "Donanemab shows superiority on ADAS-Cog13 or shorter treatment course wins physician preference."
  - "Amyloid hypothesis definitively rejected in broader CNS community → platform collapse."
  - "Phase 3 CDR-SB effect size deemed not clinically meaningful by payers and physicians."

analyst_notes: >
  HISTORICAL BACKTEST — July 2022 analysis (Phase 3 CLARITY AD in progress; topline pending).
  This is the most uncertain case study: CNS Alzheimer's with surrogate endpoint risk,
  CMS coverage uncertainty, and a novel mechanism following the controversial aducanumab precedent.

  Key modeling considerations unique to CNS/Alzheimer's:
    1. Addressable pool is hard-gated by amyloid confirmation (PET or LP) — expensive and not widely available
    2. CMS NCD (National Coverage Determination) is a binary commercial gating factor for Medicare patients
    3. ARIA monitoring requires repeat MRI — adds real-world cost and patient burden beyond drug cost
    4. Biogen 55% / Eisai 45% split requires careful NAV attribution

  The P(approval) ~55% reflects surrogate endpoint uncertainty at July 2022, before CLARITY
  AD topline data were available. Post-topline (Sep 2022) this would increase substantially.

  ACTUAL OUTCOMES (for comparison):
    Accelerated approval: January 6, 2023
    Full approval: July 6, 2023 (confirmatory CDR-SB clinical benefit)
    CMS NCD expanded to all Medicare beneficiaries: July 2023 (traditional approval)
    2023 US net sales: $19M (slow launch due to NCD uncertainty pre-full approval)
    2024 run-rate: expected $500M+ as CMS coverage normalized
    BIIB shares: $230 (Jul 2022) → $300+ (post-full approval/NCD resolution)

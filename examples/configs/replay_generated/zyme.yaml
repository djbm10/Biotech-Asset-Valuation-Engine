  config_valid_from_rationale: >
    Jazz Pharmaceuticals deal (Nov 2022, $325M upfront) transferred global commercialization
    rights to Jazz. ZYME became a royalty/milestone recipient only, not the primary
    commercializer. The corrected config (TAM=$2.2B BTC, peak_penetration=9%, Jazz economics)
    only applies from this deal date. Earlier snapshots used the AstraZeneca-era assumptions
    that inflated SOTP to ~$3.3B; applying those assumptions post-crash produced false 6-7x
    extreme-discount signals. Snapshots before this date used a different economic structure
    (direct commercialization) and should not be compared to the royalty-era model.
  review_rationale: >
    AstraZeneca returned zanidatamab rights November 2021 (market cap crashed $8.6B→$487M).
    ZYME then partnered with Jazz Pharmaceuticals ($325M upfront, Nov 2022) for global rights
    except Greater China. As royalty/milestone recipient, not primary commercializer, effective
    economics are substantially lower than the original broad HER2+ oncology TAM implied.
    BTC (biliary tract cancer) is the near-term approved indication with TAM ~$2.2B; HER2+ breast
    and gastric are longer-dated. Updated to TAM=2200, peak_penetration=0.09 (Jazz economics),
    patent_life=10. Produces SOTP ~$640M vs market cap ~$500M (ratio 1.3x); prior model
    produced 5–8x extreme_discount flag.

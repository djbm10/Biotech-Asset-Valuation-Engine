# =============================================================================
# Kymera Therapeutics (KYMR) — KT-474
# IRAK4 PROTAC degrader | Atopic Dermatitis (AD) + Hidradenitis Suppurativa (HS)
# =============================================================================
#
# Data sources (all public):
#   - KYMR Ph2 IRAK4 AD/HS data (ASCO / KYMR investor presentations 2024-2025)
#   - Kymera 10-K 2024 / Q4 2025 earnings
#   - Evaluate Pharma / sellside peak sales consensus for AD market
#   - SSR Health G2N data: specialty derm biologics typically 35-45%
#   - IGA scoring / EASI endpoints validated by FDA for AD drug approvals
#   - Epidemiology: AAD / UpToDate; GlobalData AD prevalence
#
# Patient-flow chain:
#   US AD prevalent: ~16.5M (all adults). Moderate-severe AD (label-eligible): ~3.5M.
#   Diagnosed (by dermatologist, not self-managed): 55% of moderate-severe
#   Eligible (inadequate response to dupilumab or JAK-naïve biologic label criteria): 25%
#   Treatment rate: 60% (high because this is refractory/biologic-experienced group)
#   → Addressable: 3,500K × 0.55 × 0.25 × 0.60 ≈ 288,750 patients
#
# Note: Also in HS (hidradenitis suppurativa) — modeled separately in pipeline_value.
# KT-474 is oral, once-daily — potentially differentiated vs. injectable biologics.
# =============================================================================

analyst_notes: >
  KT-474 is Kymera's lead IRAK4 PROTAC degrader (IND-filed Sanofi program;
  Kymera retains US rights). IRAK4 sits upstream of IL-1/IL-17/IL-18 signaling,
  key to IL-33-mediated AD and toll-like receptor (TLR)/IL-36 signaling in HS.
  Ph2 proof-of-concept data in AD (≥50% EASI improvement in ~70% of patients)
  and HS (HiSCR50 in ~60%) positions KT-474 as a dual-indication PROTAC with
  a differentiated MoA vs. JAK inhibitors (no kinase inhibition → no boxed warning
  signal, potentially cleaner cardiovascular/immunosuppression profile).
  Key risk: Phase 3 size/cost; oral vs. injection may drive payer preference.
  Sanofi holds ex-US rights; US rNPV accrues to KYMR.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "kt-474"
  name: "KT-474"
  indication: "Moderate-severe Atopic Dermatitis (AD) — US"
  therapeutic_area: "other"          # Immunology / derm → 'other' bucket
  stage: "phase_2"
  modality: "small_molecule"         # Oral PROTAC (degrader)
  mechanism_of_action: >
    IRAK4 (IL-1 receptor-associated kinase 4) PROTAC degrader.
    Engages CRBN E3 ligase to ubiquitinate and degrade IRAK4 protein.
    Blocks both kinase-dependent (TLR/IL-1R) and kinase-independent
    (MyD88 scaffold) IRAK4 signaling — broader suppression than kinase
    inhibitors. Reduces TNF, IL-6, IL-12, IL-17, IL-18 downstream.
  discount_rate: 0.115    # 11.5% WACC — clinical-stage with dual-indication upside
  royalty_rate: 0.0        # US-only; Sanofi has ex-US royalties (not modeled here)

  differentiation_notes: >
    1. PROTAC degrader: removes IRAK4 protein entirely (not just inhibits kinase).
    2. No boxed warning profile expected (not a JAK inhibitor); FDA sensitive to JAKi signals.
    3. Oral once-daily: convenience advantage over dupilumab (biweekly injection).
    4. Dual-indication: AD + HS from same mechanism (IRAK4 relevant in both).
    5. Sanofi partnership validates ex-US commercial potential.

  competitor_assets:
    - "Dupilumab (Dupixent, Sanofi/Regeneron) — IL-4/IL-13 biologic, dominant market leader"
    - "Tralokinumab (Adbry, LEO Pharma) — IL-13 biologic, approved"
    - "Abrocitinib (Cibinqo, Pfizer) — JAK1 inhibitor, oral, boxed warning"
    - "Upadacitinib (Rinvoq, AbbVie) — JAK1 inhibitor, oral, boxed warning"
    - "Lebrikizumab (Ebglyss, Lilly/Almirall) — IL-13 biologic, approved"
    - "Nemolizumab (Nemluvio, Galderma) — IL-31Ra, approved 2024"

  upcoming_catalysts:
    - description: "KT-474 Ph2b AD primary endpoint readout (EASI-75 at 16 weeks)"
      expected_date: "2026-H1"
      catalyst_type: "readout"
      probability_positive: 0.60
    - description: "KT-474 Ph2 HS readout (HiSCR50)"
      expected_date: "2026-H1"
      catalyst_type: "readout"
      probability_positive: 0.55
    - description: "Phase 3 initiation announcement (pending Ph2b success)"
      expected_date: "2026-H2"
      catalyst_type: "milestone"
      probability_positive: 0.55


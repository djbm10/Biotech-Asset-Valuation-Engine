# ---------------------------------------------------------------------------
# Trials
# ---------------------------------------------------------------------------
trials:
  - phase: "phase_2"
    nct_id: "NCT05127928"
    success_probability: 0.60
    duration_years: 1.5
    cost_millions: 55.0
    enrollment: 200
    primary_endpoint: "EASI-75 at Week 16 (vs placebo in mod-severe AD)"
    endpoint_type: "surrogate_validated"
    notes: >
      Ph2b dose-finding (50mg, 100mg QD). EASI-75 primary; IGA 0/1 secondary.
      Ph1b showed dose-dependent EASI improvement. Ph2b includes placebo
      control to confirm signal for Phase 3 powering.

  - phase: "phase_3"
    nct_id: null
    success_probability: 0.60
    duration_years: 3.0
    cost_millions: 280.0
    enrollment: 700
    primary_endpoint: "EASI-75 at Week 16 + IGA 0/1 (vs placebo; superiority)"
    endpoint_type: "surrogate_validated"
    notes: >
      Two confirmatory Ph3s expected (FDA AD precedent). Each ~700 patients.
      KT-474 vs placebo; dupilumab-experienced subgroup important for label.
      Modeling as single aggregated Phase 3 line with combined cost.

  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.90
    duration_years: 1.5
    cost_millions: 20.0
    enrollment: 1
    primary_endpoint: "NDA submission and FDA review"
    endpoint_type: "hard_clinical"
    notes: >
      AD is FDA priority; PDUFA 12-month standard review expected. Small molecule
      NDA (oral) — manufacturing simpler than biologic BLA.


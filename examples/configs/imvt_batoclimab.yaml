      prevalence_thousands: 60.0      # ~60K US symptomatic gMG
      diagnosed_fraction: 0.80        # ~80% under neurologist management
      eligible_rate: 0.55             # Moderate-severe label gate (MG-ADL threshold)
      treated_fraction: 0.65          # High in biologic-class for treatment-refractory
      uncertainty_cv: 0.25
    pricing:
      wac_per_year_usd: 150000        # FcRn class pricing: efgartigimod ~$150K+/year
      gross_to_net_rate: 0.36         # 36% rare disease G2N; co-pay assist + payer rebates
      # net = 150,000 × 0.64 = $96,000 per patient per year
      launch_discount: 0.10           # Launch-year access investment
      annual_erosion_rate: 0.015
      uncertainty_cv: 0.15
    share:
      peak_share: 0.28               # 28% of addressable (FcRn class splits with efgartigimod)
      years_to_peak: 5
      share_cv: 0.25
    ex_us_revenue_multiple: 1.40     # EU + Japan meaningful; ex-US slower uptake in rare neurology


# =============================================================================
# Immunovant (IMVT) — batoclimab (IMVT-1401)
# Anti-FcRn antibody | Myasthenia Gravis (gMG) + CIDP + Thyroid Eye Disease
# =============================================================================
#
# Data sources (all public):
#   - IMVT ASCEND MG Ph3 (NCT04963270) — primary readout Q1 2025
#   - IMVT 10-K 2024; Q3 2025 earnings
#   - FcRn inhibitor competitive landscape: efgartigimod (argenx), rozanolixizumab (UCB)
#   - FDA approval efgartigimod (Vyvgart) June 2021 — pricing / G2N benchmark
#   - SSR Health G2N: rare disease / neurology specialty 30-40%
#   - gMG epidemiology: ~60K US symptomatic (treated) gMG patients; CIDP ~100K
#   - EvaluatePharma FcRn market projections
#
# Patient-flow chain (gMG primary):
#   US gMG symptomatic: ~60K
#   Diagnosed: 80% (late-stage MG under neurologist care; some subclinical)
#   Eligible (AChR/MuSK+ label, moderate-severe: MG-ADL ≥ 6): 55%
#   Treatment rate: 65% of eligible (fraction pursuing IVIg / biologic-class Rx)
#   → Addressable: 60K × 0.80 × 0.55 × 0.65 ≈ 17,160 patients
#
# Multi-indication upside: CIDP, TED (thyroid eye disease), ITP — not modeled here.
# SC formulation (every-2-week or monthly) being developed for convenience.
# =============================================================================

analyst_notes: >
  Batoclimab (IMVT-1401) is a high-affinity anti-FcRn antibody that reduces
  IgG autoantibodies by blocking FcRn-mediated IgG recycling. ASCEND MG Ph3
  primary readout showed ~60% responder rate (MG-ADL improvement ≥2 at week 12),
  competitive with efgartigimod and rozanolixizumab. Differentiated by SC+IV
  flexibility, monthly dosing option, and deep IgG suppression (~75-80%).
  LDL elevation was the key safety signal in earlier batoclimab (200mg weekly)
  — managed with dose selection in IMVT-1402 reformulation; 680mg Q2W or
  monthly schedule reduces LDL signal.  Key debate: differentiation vs.
  efgartigimod in the gMG FcRn class; CIDP + TED expansion optionality.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "batoclimab"
  name: "batoclimab (IMVT-1401 / IMVT-1402)"
  indication: "Generalized Myasthenia Gravis (gMG) — AChR/MuSK+ moderate-severe, US"
  therapeutic_area: "other"          # Rare disease / neurology → 'other'
  stage: "phase_3"
  modality: "biologic"               # Full-length IgG1 monoclonal antibody
  mechanism_of_action: >
    Anti-neonatal Fc receptor (FcRn) monoclonal antibody. FcRn rescues IgG
    from lysosomal degradation; blocking FcRn → IgG half-life shortens →
    IgG levels fall ~70-80%. Reduces pathogenic AChR and MuSK autoantibodies
    driving gMG symptoms without broad immunosuppression.
  discount_rate: 0.110   # 11% WACC — Phase 3, rare disease
  royalty_rate: 0.0

  differentiation_notes: >
    1. Deep IgG suppression (~75-80% reduction); among highest in FcRn class.
    2. SC + IV options: flexibility for physician/patient preference.
    3. Monthly dosing option (Q4W SC) under development — differentiated vs.
       efgartigimod (weekly IV or biweekly SC).
    4. LDL signal managed with 340mg Q2W schedule (lower than 200mg QW).
    5. Multi-indication portfolio: CIDP, TED, ITP each meaningful NPV additions.

  competitor_assets:
    - "Efgartigimod (Vyvgart/Vyvgart Hytrulo, argenx) — FcRn, approved gMG+CIDP, market leader"
    - "Rozanolixizumab (Rystiggo, UCB) — FcRn, approved gMG"
    - "Nipocalimab (J&J) — FcRn, Phase 3 gMG + multiple indications"
    - "Inebelizumab (Uplizna, Horizon/Amgen) — anti-CD19, IgG4 MG niche"

  upcoming_catalysts:
    - description: "ASCEND MG sNDA filing / FDA approval decision"
      expected_date: "2026-Q1"
      catalyst_type: "regulatory"
      probability_positive: 0.75
    - description: "ASCEND CIDP Ph3 primary readout (MRC score)"
      expected_date: "2026-Q3"
      catalyst_type: "readout"
      probability_positive: 0.60
    - description: "TED (thyroid eye disease) Ph2 data presentation"
      expected_date: "2026-H2"
      catalyst_type: "readout"
      probability_positive: 0.55
    - description: "Monthly SC dosing schedule data update"
      expected_date: "2026-H2"
      catalyst_type: "milestone"
      probability_positive: 0.70


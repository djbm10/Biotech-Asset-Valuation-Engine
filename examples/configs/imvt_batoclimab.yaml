# ---------------------------------------------------------------------------
# Trials
# ---------------------------------------------------------------------------
trials:
  - phase: "phase_3"
    nct_id: "NCT04963270"           # ASCEND MG
    success_probability: 0.73       # Ph3 data already positive; modeling NDA path
    duration_years: 0.5
    cost_millions: 20.0             # Remaining Ph3 ops + NDA prep
    enrollment: 200
    primary_endpoint: "MG-ADL improvement ≥2 at Week 12 (responder rate vs placebo)"
    endpoint_type: "surrogate_validated"
    notes: >
      ASCEND MG Ph3 primary endpoint met (MG-ADL ≥2 responder rate ~60% vs ~40%
      placebo; approximate, Q1 2025 readout). NDA filing underway; FDA approval
      expected Q1/Q2 2026. Modeling as near-complete Phase 3.

  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.88
    duration_years: 1.0
    cost_millions: 15.0
    enrollment: 1
    primary_endpoint: "BLA submission and FDA approval (Priority Review likely)"
    endpoint_type: "hard_clinical"
    notes: >
      Rare disease (gMG) qualifies for priority review (6-month). BLA as biologic.
      FcRn class well-characterized at FDA (efgartigimod, rozanolixizumab approved).
      Risk: LDL class labeling requirement + REMS potential.


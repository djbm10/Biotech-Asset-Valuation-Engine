    - requirement_id: biology.same_therapeutic_construct
      domain: ELIGIBILITY
      fact_type: construct_target_set
      operator: CONTAINS_ALL
      expected_value: [CD19, BCMA]
      pass_condition: One therapeutic construct has both canonical targets.
      fail_condition: Affirmative evidence shows the construct lacks either target.
      unknown_condition: The construct-level target set is missing, stale, ambiguous, or conflicting.
      analyst_confirmation_required: true
  capability_constraints:
    manufacturing: []
    delivery: []
    clinical_operations: []
    commercial: []
    integration: []
  evidence_floor:
    minimum_stage: PRECLINICAL
    human_poc_required: false
    evaluable_patients_minimum: null
    follow_up_minimum_days: null
    required_evidence_types: [PROGRAM_EXISTENCE]
  clinical_effect_bar: {}
  acceptable_deal_routes: [LICENSE, COLLABORATION, OPTION, ACQUISITION]
  geographic_rights_requirements: []
  missing_evidence_policy: REVIEW
output:
  landscape_mode: COMBINED
  group_by: TARGET
ranking_cohort_required: false

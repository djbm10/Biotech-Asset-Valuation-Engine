  indications: []
  target_expression:
    operator: EXACT_COMBINATION
    targets:
      - canonical_id: CD19
        label: CD19
        aliases: [CD-19, B-lymphocyte antigen CD19]
      - canonical_id: BCMA
        label: BCMA
        aliases: [TNFRSF17, CD269]

# =============================================================================
# Revolution Medicines (RVMD) — RMC-6236
# Pan-RAS(ON) tri-complex inhibitor | KRAS-mutant NSCLC (primary) + PDAC
# CURRENT: 2026-06-01
# =============================================================================
#
# Sources (all public):
#   - RVMD Q4 2025 / FY2025 earnings and 10-K (Feb 2026)
#   - AACR 2025 / ASCO 2025 RMC-6236 Phase 1/2 data presentations
#   - ClinicalTrials.gov NCT05379985 (RMC-6236-001 study)
#   - FDA KRASG12C precedent: sotorasib (AMG510, 2021) + adagrasib (2022)
#   - IQVIA oncology market data (KRAS-mutant NSCLC/PDAC)
#   - Revolution Medicines Investor Day 2025 pipeline update
# =============================================================================

analyst_notes: >
  RMC-6236 is a first-in-class pan-RAS(ON) inhibitor targeting the active
  GTP-bound state of RAS using a tri-complex mechanism (RMC-6236 + RASGAP334).
  Unlike sotorasib/adagrasib (KRASG12C-OFF selective), RMC-6236 is active across
  multiple KRAS mutations (G12D, G12V, G12C, G12A, G12R, G12S) and NRAS/HRAS.
  This represents the first clinical activity against KRASG12D and G12V — the
  two most prevalent mutations in PDAC and NSCLC with no approved inhibitors.

  Phase 1/2 data (2024-2025):
    - NSCLC KRAS G12X: ORR ~35-45% in non-G12C cohorts; ~25-30% in G12C cohorts
    - PDAC KRAS G12X: ORR ~20-30% (historically no targeted options in PDAC)
    - Combination with SHP2i (RMC-4630): enhanced depth/duration in early data
    - Key DLT at higher doses: diarrhea and rash (manageable)

  Key differentiation:
    - Only clinical-stage pan-KRAS inhibitor with activity against G12D/G12V
    - Activity in adagrasib/sotorasib-resistant settings (different binding state)
    - Broad KRAS coverage = larger addressable population than G12C-selective agents
    - Combination franchise with SHP2i creates portfolio value beyond monotherapy

  M&A context: RVMD has no commercial products; cash runway ~3+ years.
  Market cap ~$4-6B range. Amgen (sotorasib/Lumakras) has explicitly stated
  need for pan-KRAS capability. RVMD represents the leading pan-RAS clinical asset.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "rvmd-rmc6236-nsclc"
  name: "RMC-6236"
  indication: "KRAS-mutant NSCLC (G12X, non-G12C primary; G12C secondary)"
  therapeutic_area: "oncology"
  stage: "phase_2"
  modality: "small_molecule"
  mechanism_of_action: >
    Tri-complex pan-RAS(ON) inhibitor. Forms a ternary complex with RASGAP334
    and GTP-bound (active) RAS, stabilizing RAS in an inactive conformation.
    Active against KRASG12C, G12D, G12V, G12A, G12R, G12S and NRAS/HRAS
    oncoproteins in the GTP-loaded active state.
  discount_rate: 0.10
  royalty_rate: 0.0

  differentiation_notes: >
    1. ONLY clinical-stage inhibitor with activity against KRASG12D and G12V.
    2. Active state (ON) mechanism: different binding pocket from G12C-selective drugs,
       active in sotorasib/adagrasib-resistant tumors.
    3. Broader KRAS coverage = addressable ~60-70% of all KRAS-mutant cancers vs
       ~15% for G12C-selective agents.
    4. Combination franchise with RMC-4630 (SHP2i) tested clinically — portfolio play.
    5. First-mover advantage: no approved pan-KRAS inhibitor exists; regulatory bar
       is vs chemo/IO standard-of-care, not vs another targeted inhibitor.

  competitor_assets:
    - "sotorasib (Lumakras, Amgen) — FDA approved 2021 KRASG12C NSCLC (G12C-OFF)"
    - "adagrasib (Krazati, BMS/Mirati) — FDA approved 2022 KRASG12C NSCLC (G12C-OFF)"
    - "RMC-9805 (RevMed) — KRASG12D(ON) selective, Phase 1 (internal)"
    - "RMC-6291 (RevMed) — KRASG12C(ON) selective, Phase 1 (internal)"
    - "GDC-6036 (Roche/Genentech) — KRASG12C, Phase 2"
    - "BI-1701963 (Boehringer) — KRAS/SOS1, Phase 2"

  upcoming_catalysts:
    - description: "Phase 2 expansion cohort ORR update (G12D/G12V non-G12C NSCLC)"
      timing_months: 4
      catalyst_type: phase_2_poc
    - description: "PDAC combination (RMC-6236 + RMC-4630) Phase 2 data"
      timing_months: 6
      catalyst_type: phase_2_poc
    - description: "Phase 3 design / FDA alignment for registrational NSCLC trial"
      timing_months: 9
      catalyst_type: fda_meeting


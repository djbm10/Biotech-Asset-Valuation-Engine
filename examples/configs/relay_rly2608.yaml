# =============================================================================
# Relay Therapeutics (RLAY) — RLY-2608
# PI3Kα H1047R-selective inhibitor | HR+/HER2- Breast Cancer
# =============================================================================
#
# Data sources (all public):
#   - ClinicalTrials.gov NCT05216432 (ReDiscover Phase 1/2)
#   - Relay 10-K 2023 / Relay Q3 2024 earnings (cash, shares, burn)
#   - Relay Investor Day 2023 (pipeline slides)
#   - ASCO 2024 abstract: Phase 1 RLY-2608 + fulvestrant ORR data
#   - Inavolisib (Itovebi) approval press release October 2024 (pricing comp)
#   - IQVIA / Biomedtracker oncology phase transition data (POS priors)
#   - SSR Health G2N database (pricing assumptions)
#
# All financial figures are approximate as of Q4 2024 (pre-analysis snapshot).
# Analyst should verify against most recent 10-Q before use.
# =============================================================================

analyst_notes: >
  RLY-2608 is a mutant-selective PI3Kα inhibitor designed to avoid the
  hyperglycemia seen with non-selective agents (alpelisib, copanlisib).
  Selectivity for H1047R over wild-type creates a cleaner safety profile,
  enabling continuous dosing and CDK4/6 combination potential.
  Phase 1 showed ORR ~40% in H1047R-selected HR+/HER2- mBC patients
  treated with RLY-2608 + fulvestrant (ASCO 2024).
  Key variant perception: market underestimates (1) class validation via
  inavolisib approval de-risking regulatory path, (2) tolerability advantage
  enabling earlier-line use and broader combinations, and (3) potential
  ex-H1047R label expansion.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "rly-2608"
  name: "RLY-2608"
  indication: "PIK3CA H1047R HR+/HER2- mBC (2nd/3rd line, US)"
  therapeutic_area: "oncology"
  stage: "phase_2"
  modality: "small_molecule"
  mechanism_of_action: >
    Mutant-selective covalent PI3Kα inhibitor. Binds H1047R mutant PI3Kα
    with 300× selectivity over wild-type, sparing normal glucose metabolism.
  discount_rate: 0.10    # 10% WACC — standard for clinical-stage oncology
  royalty_rate: 0.0      # Fully owned; no out-licensing at this stage

  differentiation_notes: >
    1. Mutant-selectivity → 300× selectivity H1047R vs WT; less hyperglycemia.
    2. Enables continuous dosing (vs. 5-days-on/2-days-off for alpelisib).
    3. Activity vs acquired resistance mutations (E545K cross-resistance to inavolisib).
    4. Potential for earlier-line CDK4/6i + RLY-2608 combo (AKT/PTEN bypass).

  competitor_assets:
    - "Inavolisib (GDC-0077, Itovebi) — FDA approved Oct 2024 + fulvestrant"
    - "Alpelisib (Piqray) — FDA approved 2019, all PIK3CA mutations"
    - "Capivasertib (Truqap) — AKT inhibitor, different target but same pathway"
    - "Gedatolisib (PF-05212384) — pan-PI3K/mTOR, Phase 3"

  upcoming_catalysts:
    - description: "Phase 2 expansion cohort ORR data (H1047R + fulvestrant arm)"
      expected_date: "H2 2025"
      catalyst_type: "readout"
      probability_positive: 0.55   # Strong Ph1 signal; Ph2 powered for confirmation
    - description: "Phase 3 initiation announcement (pending Ph2 success)"
      expected_date: "Q1 2026"
      catalyst_type: "milestone"
      probability_positive: 0.50


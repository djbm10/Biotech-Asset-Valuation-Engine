analyst_notes: >
  Dazodalibep (ALPN-101) is a CD28/ICOS bispecific Fc-fusion antagonist blocking
  T/B cell co-stimulatory signals upstream of the IgA nephropathy inflammatory cascade.
  Phase 2b IGNITE trial (N=38, 24-week) reported at ASN October 2023:
    - uPCR reduction: ~42% from baseline (primary endpoint met)
    - eGFR stabilization maintained through 24 weeks
    - No serious safety signals; well-tolerated biweekly IV
  Differentiated from Filspari (endothelin-A antagonist) and Tarpeyo (mucosal steroid):
  dazodalibep attacks the immune etiology rather than downstream hemodynamics.
  Alpine announced exploration of strategic alternatives January 2024 — explicit
  process signal. IgA nephropathy is Vertex's stated renal franchise priority.
  As of March 2024 Alpine has ~$380M cash and ~18 months runway; no dilutive
  financing needed before Phase 3 initiation.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "alpn-dazodalibep-igan"
  name: "dazodalibep (ALPN-101)"
  indication: "IgA Nephropathy (Phase 2b complete, Phase 3 planning)"
  therapeutic_area: "immunology"
  stage: "phase_2"
  modality: "biologic"
  mechanism_of_action: >
    CD28/ICOS bispecific Fc-fusion protein antagonist. Selectively blocks CD28
    and ICOS co-stimulatory signals driving pathogenic T follicular helper cell
    activation and downstream IgA1-producing B cell differentiation.
    Targets immunological root cause of IgAN rather than hemodynamic or
    mucosal pathway.
  discount_rate: 0.11
  royalty_rate: 0.0

  differentiation_notes: >
    1. Novel upstream immune mechanism (CD28/ICOS) — no approved drug in class.
    2. IGNITE Phase 2b positive: 42% uPCR reduction, eGFR stabilization, clean safety.
    3. Distinct from Filspari (ET-A antagonist) and Tarpeyo (mucosal budesonide) —
       potentially additive in combination and non-overlapping patient selection.
    4. Biweekly IV dosing — appropriate for nephrology specialist channel.
    5. Strategic review ongoing — explicit willingness to transact.

  competitor_assets:
    - "sparsentan (Filspari) — FDA approved 2023 for IgAN (ET-A + AT1R dual antagonist)"
    - "budesonide (Tarpeyo/Nefecon) — FDA approved 2021 for IgAN (mucosal steroid)"
    - "atrasentan (AstraZeneca/Chinook) — Phase 3 IgAN (ET-A selective)"
    - "zigakibart (AstraZeneca) — Phase 3 IgAN (complement C3d antibody)"
    - "iptacopan (Novartis) — Phase 3 IgAN (complement factor B)"

  upcoming_catalysts:
    - description: "Phase 3 design finalization / IND meeting with FDA"
      timing_months: 6
      catalyst_type: fda_meeting
    - description: "24-month IGNITE extension data — durability of uPCR effect"
      timing_months: 9
      catalyst_type: phase_2_poc


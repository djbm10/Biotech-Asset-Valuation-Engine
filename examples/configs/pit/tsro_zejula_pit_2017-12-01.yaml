decision_framing:
  variant_perception:
    market_pos_pct: null
    market_peak_sales_m: null
    our_edge: >
      This control does not assert a variant perception. It exists to test
      the bridge/solver's behavior on an early-launch, eventually-acquired
      commercial-stage asset -- with the explicit, documented caveat that
      the eventual deal price was below this snapshot's entry price, so
      this control cannot be read as a straightforward "market
      undervaluation, later confirmed" case.

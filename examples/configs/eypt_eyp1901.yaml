# =============================================================================
# EyePoint Pharmaceuticals (EYPT) — EYP-1901 (vorolanib)
# Sustained-release pan-VEGF TKI | Neovascular AMD (wet AMD) | US
# =============================================================================
#
# Case study type: HEDGE FUND — Market Mispricing Thesis
# Thesis: Market underprices durable delivery advantage vs. current anti-VEGF SoC.
#         EYP-1901's semi-annual dosing vs. 6-8 injections/year is a structural
#         differentiator that should unlock a 15-20% share of the treated wet AMD market.
#
# Data sources (all public):
#   - ClinicalTrials.gov NCT05536297 (ACUITY Phase 3 trial)
#   - EyePoint 10-K 2023 / Q3 2024 earnings (cash, shares, burn)
#   - EyePoint investor presentations 2023-2024
#   - ASRS 2024: Phase 2 DAVIO 2 data (NCT05066893) — 9-month durability
#   - Eylea prescribing information / WAC (published retail pricing)
#   - Vabysmo (faricimab) pricing: ~$2,600/injection per ICER 2023 review
#   - Macular Degeneration Research Alliance (MDRA) prevalence estimates 2023
#   - Wong et al. 2019 (Biostatistics): ophthalmology phase transition rates
#
# All financial figures approximate as of Q4 2024. Verify before use.
# =============================================================================

analyst_notes: >
  EYP-1901 delivers vorolanib (pan-VEGF TKI) via Durasert sustained-release
  intravitreal insert, targeting ~6-month dosing intervals in wet AMD. Current
  standard of care (Eylea, Vabysmo) requires injections every 4-16 weeks;
  real-world adherence is poor, with ~40% of patients undertreated at 12 months.
  Phase 2 DAVIO 2 showed 67% of patients maintained 6-month dosing through 9 months
  with BCVA gains comparable to aflibercept monthly injections.
  Key mispricing: the market prices this as a "me-too anti-VEGF" when the
  injection burden reduction is the main unmet need in wet AMD — adherence,
  not efficacy, is the limiting factor in real-world outcomes.
  ACUITY Phase 3 is powered for non-inferiority; success would unlock a large
  and durable market position given the dosing advantage.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "eyp-1901"
  name: "EYP-1901 (vorolanib)"
  indication: "Neovascular AMD (wet AMD), US"
  therapeutic_area: "ophthalmology"
  stage: "phase_3"
  modality: "small_molecule"    # delivered via Durasert polymer implant
  mechanism_of_action: >
    Pan-VEGF tyrosine kinase inhibitor (vorolanib) formulated in Durasert sustained-release
    intravitreal insert. Delivers continuous low-level VEGF suppression from a single
    intravitreal injection lasting approximately 6 months, compared to monthly or quarterly
    injections required for current anti-VEGF biologics (Eylea, Vabysmo, Lucentis).
  discount_rate: 0.12    # slightly above standard; mid-cap with binary readout risk
  royalty_rate: 0.0

  differentiation_notes: >
    1. Dosing burden: ~2 injections/year vs. 6-8 for Eylea q8w; ~4 for Vabysmo q4m.
    2. Real-world: wet AMD patients average only 4-5 injections/year vs. 6-8 recommended;
       EYP-1901 semi-annual dosing could structurally improve adherence and outcomes.
    3. Mechanism: small molecule vs. biologic — simpler formulation, no cold chain for the TKI.
    4. Phase 2 (DAVIO 2): 67% of patients maintained 6-month dosing with non-inferior BCVA.
    5. ACUITY design: non-inferiority vs. q8w aflibercept is a achievable bar given Phase 2 data.

  competitor_assets:
    - "Aflibercept (Eylea) — Regeneron/Bayer; q8-16w dosing; dominant market share"
    - "Faricimab (Vabysmo) — Roche/Genentech; q4m dosing; gaining share"
    - "Ranibizumab (Lucentis) — Genentech; losing share; biosimilars entering"
    - "Port Delivery System (Susvimo) — Genentech/Roche; q6m implant refill"
    - "KSI-301 (ixoberogene soroparvovec) — Kodiak Sciences; discontinued 2022"

  upcoming_catalysts:
    - description: "ACUITY Phase 3 topline (primary endpoint: BCVA change vs. aflibercept q8w)"
      expected_date: "H2 2025"
      catalyst_type: "readout"
      probability_positive: 0.60   # Phase 2 data strong; non-inferiority bar; delivery risk
    - description: "NDA submission (pending ACUITY success)"
      expected_date: "H1 2026"
      catalyst_type: "milestone"
      probability_positive: 0.55
    - description: "FDA PDUFA action date (NDA review)"
      expected_date: "H1 2027"
      catalyst_type: "fda_action"
      probability_positive: 0.88


# =============================================================================
# Praxis Precision Medicine (PRAX) — ulixacaltamide (PRAX-944)
# T-type calcium channel blocker | Essential Tremor | US
# =============================================================================
#
# Case study type: VENTURE CAPITAL — Neurology Platform Investment
# Thesis: First mechanistically differentiated essential tremor therapy in 40 years.
#         ET is chronically undertreated (only ~25% of moderate-severe patients treated)
#         due to tolerability issues with propranolol/primidone. ulixacaltamide's
#         clean safety profile could unlock a large, dormant treatment-seeking population.
#
# Data sources (all public):
#   - ClinicalTrials.gov NCT05173220 (ESSENTIAL Phase 3 trial)
#   - Praxis 10-K 2023 / Q3 2024 earnings (cash, shares, burn rate)
#   - Praxis investor day 2023 (pipeline slides, ET market data)
#   - Phase 2b PRISM data (ASN 2022; n=92): 50% tremor reduction vs 28% placebo
#   - IQVIA / Epidemiology: US ET burden (7M prevalence; 3M moderate-severe)
#   - Propranolol/primidone pricing: generic; used as benchmarks only
#   - Ingrezza (valbenazine) launch trajectory: precedent for specialty neurology pricing
#   - Published literature: Louis et al. (2003) Arch Neurol ET epidemiology
#
# All financial figures approximate as of Q4 2024. Verify before use.
# =============================================================================

analyst_notes: >
  Ulixacaltamide is a selective T-type (Cav3.1/3.2) calcium channel blocker targeting
  the thalamocortical oscillatory circuit responsible for essential tremor.
  Unlike propranolol (beta-blocker, CNS side effects) and primidone (antiepileptic,
  sedation), ulixacaltamide is mechanistically precision-targeted and showed
  substantially cleaner tolerability in Phase 2.
  Phase 2b PRISM: -50.0% tremor improvement (TETRAS scale) vs. -28.1% placebo;
  p<0.001. Only 3% discontinuation due to adverse events vs. 15-20% for propranolol.
  Investment thesis: ET is a chronically undertreated market because existing options
  are intolerable for most patients. A differentiated, well-tolerated agent could
  not only capture the current treatment-seeking population but unlock the 75%
  of moderate-severe ET patients who have never been treated — a much larger TAM.
  Praxis has multiple CNS programs (PRAX-628 for epilepsy), making this a platform
  investment rather than a single-asset bet.

# ---------------------------------------------------------------------------
# Asset
# ---------------------------------------------------------------------------
asset:
  id: "ulixacaltamide"
  name: "ulixacaltamide (PRAX-944)"
  indication: "Essential Tremor (moderate-severe), US"
  therapeutic_area: "cns"
  stage: "phase_3"
  modality: "small_molecule"
  mechanism_of_action: >
    Selective blocker of Cav3.1 and Cav3.2 T-type voltage-gated calcium channels.
    These channels drive thalamocortical burst firing, which is the neural mechanism
    underlying pathological oscillations seen in essential tremor (8-12 Hz frequency).
    By selectively suppressing thalamic burst activity, ulixacaltamide dampens
    the oscillatory circuit without broad CNS depression (contrast: propranolol, primidone).
  discount_rate: 0.12    # clinical-stage CNS; above-average risk profile
  royalty_rate: 0.0

  differentiation_notes: >
    1. Mechanism precision: first drug targeting thalamocortical oscillatory circuit;
       propranolol/primidone are non-specific.
    2. Tolerability: Phase 2 3% discontinuation vs. 15-20% for propranolol/primidone;
       no sedation, no sexual dysfunction, no cognitive effects.
    3. Untreated market: 75% of moderate-severe ET patients are untreated; better
       tolerability is the key to unlocking this population.
    4. Responder profile: 50% tremor reduction in 65% of patients (Phase 2);
       much higher response rate than historical propranolol data.
    5. QD/BID dosing (oral); convenient for elderly population (median ET age: 65+).

  competitor_assets:
    - "Propranolol (generic) — first-line; 50-60% effective; limited by bradycardia/fatigue"
    - "Primidone (generic) — first-line; similar efficacy to propranolol; sedation limits use"
    - "Topiramate (generic) — second-line; cognitive side effects; weight loss"
    - "Deep Brain Stimulation (DBS) — surgical; for severe/refractory; small addressable pool"
    - "Focused Ultrasound (Insightec) — non-invasive thalamotomy; one-time procedure; ~$30K"

  upcoming_catalysts:
    - description: "ESSENTIAL Phase 3 topline (primary: TETRAS-ADL change from baseline)"
      expected_date: "H1 2026"
      catalyst_type: "readout"
      probability_positive: 0.52   # CNS base rates are low; Phase 2 signal strong
    - description: "NDA submission (pending ESSENTIAL success)"
      expected_date: "H2 2026"
      catalyst_type: "milestone"
      probability_positive: 0.48
    - description: "FDA PDUFA date (NDA review)"
      expected_date: "H1 2027"
      catalyst_type: "fda_action"
      probability_positive: 0.83
    - description: "PRAX-628 (epilepsy) Phase 2b readout — platform catalyst"
      expected_date: "2026"
      catalyst_type: "readout"
      probability_positive: 0.45


# ---------------------------------------------------------------------------
# Clinical Trials
# ---------------------------------------------------------------------------
# ESSENTIAL (NCT05173220): ulixacaltamide vs. placebo in moderate-severe ET
# Primary: TETRAS-ADL subscale change from baseline at week 12
# Enrollment: ~300 patients
trials:
  - phase: "phase_3"
    nct_id: "NCT05173220"         # ESSENTIAL trial
    success_probability: 0.50     # starting point; POS model overrides
    duration_years: 1.5           # 12-week primary; long-term extension ongoing
    cost_millions: 95.0           # Phase 3 enrollment + sites + QA
    enrollment: 300
    primary_endpoint: "TETRAS-ADL subscale change from baseline at week 12 (superiority vs. placebo)"
    endpoint_type: "surrogate_validated"
    notes: >
      TETRAS (The Essential Tremor Rating Assessment Scale) is FDA-validated for ET.
      PRISM Phase 2b used same endpoint; ESSENTIAL is powered to reproduce the -22pp
      difference in TETRAS-ADL seen in Phase 2 (50% vs 28%). Placebo arm is well-defined.
      CNS Phase 3 has elevated failure risk despite good Phase 2; patient heterogeneity
      and placebo response variability are the primary concerns.

  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.83
    duration_years: 1.0
    cost_millions: 20.0
    primary_endpoint: null
    endpoint_type: "surrogate_validated"
    notes: >
      Strong unmet need case (no new ET approvals in >40 years); likely standard review.
      Precedent: FDA approved Ingrezza (valbenazine) for tardive dyskinesia on similar
      evidence package (Phase 2/3 combination; hyperkinetic movement disorder).

# ---------------------------------------------------------------------------
# Market Model
# ---------------------------------------------------------------------------
# Addressable population derivation:
#   US ET prevalence: ~7M (Louis et al. 2003; community-based prevalence ~4% in >40yr)
#   Moderate-severe ET: ~3M (40% of prevalent; interfering with ADL)
#   Currently treated: ~750,000 (25% of moderate-severe; most intolerant of existing options)
#   Newly treatment-seeking with novel option: conservative = 200,000/year
#     (includes newly diagnosed + previously treatment-intolerant patients)
#   We use 220,000 as addressable (new + switch-eligible in year 1-5 after launch)
#
# Net price derivation:
#   CNS specialty drug pricing benchmarks (2023):
#   - Ingrezza (valbenazine, tardive dyskinesia): WAC ~$90K/year; net ~$55K
#   - Austedo (deutetrabenazine, TD/Huntington): WAC ~$85K/year; net ~$50K
#   - These are smaller populations but similar specialty neurology profile
#   ulixacaltamide: larger population = pricing discipline from payers
#   Estimated WAC: $35-45K/year (competitive with DBS procedure cost ~$30K one-time)
#   G2N: ~30% for oral specialty CNS → net price: $42K × 0.70 = $29K/year
#   We use $28,000/year (conservative end of range)
#
# Peak penetration: 15%
#   Ingrezza achieved ~18-22% of the TD market at peak (10K-15K patients in year 3)
#   ET is 10x larger market; penetration expected to ramp slower initially
#   15% of 220K addressable = 33,000 patients at peak
#   Peak sales = 33,000 × $28,000 = $924M — large CNS opportunity
market_model:
  addressable_patients_annual: 220000   # see derivation above
  net_price_per_patient_usd: 28000      # see derivation above
  peak_penetration: 0.15               # 15% of addressable; conservative for large-population CNS
  years_to_peak: 6                     # slower ramp in primary care-referred CNS condition
  patent_life_years: 12
  cogs_rate: 0.15                      # oral small molecule; low COGS
  sgna_rate_launch: 0.45              # higher launch SG&A for large primary care + neurology audience
  sgna_rate_mature: 0.22

# ---------------------------------------------------------------------------
# POS Model
# ---------------------------------------------------------------------------
pos_adjusters:
  apply_pos_model: true

  phase_3:
    endpoint_type: "surrogate_validated"   # TETRAS-ADL is FDA-validated for ET
    moa_precedent: "novel"                 # No approved T-type Ca channel blocker; first-in-class
    sample_size_adequacy: "adequate"       # n=300; powered based on Phase 2 effect size
    safety_profile: "clean"               # Phase 2: 3% discontinuation; no serious CNS AEs
    competitive_pressure: "low"           # No other Phase 3 ET drugs; generics not a direct competition
    biomarker_selected_population: false  # All-comers (moderate-severe by clinical criteria)
    strong_prior_phase_data: true         # Phase 2b PRISM: p<0.001; 50% vs 28% tremor reduction

  nda_bla:
    endpoint_type: "surrogate_validated"
    moa_precedent: "novel"
    sample_size_adequacy: "adequate"
    safety_profile: "clean"
    competitive_pressure: "low"
    biomarker_selected_population: false
    strong_prior_phase_data: true

# ---------------------------------------------------------------------------

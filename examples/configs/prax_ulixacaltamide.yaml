# ---------------------------------------------------------------------------
sources:
  addressable_patients:
    url: "https://pubmed.ncbi.nlm.nih.gov/12975455/"
    confidence: "Medium"
    notes: >
      Louis et al. (2003, Arch Neurol): ET prevalence ~4% in >40 years, ~7M in US.
      Moderate-severe (~3M) defined as interfering with ADL. Treatment rate of 25%
      is analyst estimate; ET historically undertreated. New addressable pool with
      better-tolerated drug estimated at 200-220K/year.

  net_price:
    url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2023/209241s022lbl.pdf"
    confidence: "Low"
    notes: >
      Ingrezza (valbenazine) WAC ~$90K/year for tardive dyskinesia.
      ET is a larger population; payers will resist premium pricing.
      Analyst estimate $35-45K WAC based on specialty movement disorder precedents
      and payer sensitivity for a condition with low-cost generic alternatives.
      Significant pricing uncertainty — this is the highest-uncertainty assumption.

  peak_penetration:
    url: "https://investors.neurocrine.com/news-releases/news-release-details/neurocrine-biosciences-reports-fourth-quarter-and-full-year-2023"
    confidence: "Low"
    notes: >
      Ingrezza achieved ~15,000 patients at peak (tardive dyskinesia, smaller market).
      For ET, Praxis targets a much larger pool but faces generic competition and
      primary care prescribing inertia. 15% of 220K = 33K patients at peak.
      Comparable to Ingrezza absolute patient numbers despite larger total addressable market.

# ---------------------------------------------------------------------------
# Decision framing
# ---------------------------------------------------------------------------
decision_framing:
  variant_perception:
    market_pos_pct: 28       # market appears to price in low CNS Phase 3 POS
    market_peak_sales_m: 450  # market appears to discount large untreated ET market
    our_edge: >
      The market is applying generic CNS Phase 3 base rates (~30%) to a program with
      unusually strong Phase 2 signal (p<0.001, -22pp treatment difference on a
      well-validated endpoint). Three factors are underweighted: (1) ET is a mechanistically
      clear target — thalamocortical oscillations are measurable and reproducible,
      unlike CNS diseases with heterogeneous pathophysiology; (2) the 75% untreated
      moderate-severe population represents a latent demand shock that no financial model
      is correctly sizing — when a well-tolerated drug exists, adherence-driven market
      expansion is not captured by simple penetration assumptions; (3) Praxis has a
      second bite at the apple (PRAX-628 for epilepsy) that is unpriced in the stock.

  kill_criteria:
    - "ESSENTIAL primary endpoint miss: TETRAS-ADL change from baseline fails superiority vs. placebo at week 12"
    - "Phase 2 effect does not reproduce: observed treatment difference <10pp (vs 22pp in PRISM); suggests Phase 2 was noise"
    - "Safety surprise: CNS AE rate >10% discontinuation (would undermine the 'better tolerated' thesis vs. propranolol)"
    - "Cash crisis before ESSENTIAL readout without equity raise at premium to current price"
    - "PRAX-628 Phase 2 failure (platform risk): reduces Praxis to single-asset company and impairs financing optionality"

  downside_drivers:
    - category: "Endpoint / Regulatory"
      description: >
        TETRAS-ADL is patient-reported/rater-assessed; high placebo response is endemic to
        CNS trials. PRISM used the same endpoint but in 92 patients; ESSENTIAL at 300
        must reproduce effect in a more heterogeneous population with potentially higher
        placebo response. If placebo response exceeds assumptions, the treatment difference
        may not meet statistical significance even if the drug works.
      severity: "high"

    - category: "Payer / Pricing"
      description: >
        Payers will immediately compare ulixacaltamide to generic propranolol ($15/month)
        and primidone ($10/month). Step-edit requirements (demonstrate failure on generics
        before approving ulixacaltamide) could limit first-line use and slow ramp significantly.
        Medicare Part D structure means CMS has formulary leverage; ET prevalence in
        Medicare population (age 65+) is disproportionately high.
      severity: "high"

    - category: "CMC / Manufacturing"
      description: >
        Oral small molecule; low CMC risk. Primary concern is ensuring adequate API
        supply for commercial launch without a manufacturing partner already identified.
        Praxis is pre-commercial; commercial manufacturing scale-up requires partnership
        or significant infrastructure investment.
      severity: "low"

    - category: "Competition"
      description: >
        No currently active Phase 3 ET programs as of Q4 2024 beyond ESSENTIAL.
        However, if positive data emerges, the large ET market will attract entrants.
        Focused Ultrasound (FUS) for ET is gaining traction as a one-time non-pharmacological
        option; if FUS adoption accelerates among younger patients, it could limit the
        peak addressable pool for pharmaceutical treatment.
      severity: "medium"

    - category: "IP / Patent"
      description: >
        Composition-of-matter patent on ulixacaltamide and T-type Ca channel selectivity.
        CNS small molecules face generic competition risk; ET is a chronic condition
        requiring long-term treatment, so IP life matters more than in oncology.
        Patent term extension expected to bring exclusivity to ~2036; actual expiry TBD.
      severity: "medium"

# ---------------------------------------------------------------------------
# Explicit limitations
# ---------------------------------------------------------------------------
limitations:
  - "US market only. EU (large ET market given aging population) not modeled."
  - "Addressable population (220K/year) includes untreated patients who may respond differently to treatment — market expansion assumptions are uncertain."
  - "Net price ($28K/year) is highly uncertain; payer step-edit requirements could limit first-line use and slow uptake."
  - "Platform value (PRAX-628 epilepsy) not included in this valuation; represents unmodeled option value."
  - "CNS launch trajectories are historically slower than oncology; 6-year ramp to peak may be optimistic."
  - "Cash runway (~8 quarters) creates dilution risk before ESSENTIAL readout; modeled as fixed shares."

# ---------------------------------------------------------------------------
# Thesis changers
# ---------------------------------------------------------------------------
thesis_changers:
  - "ESSENTIAL Phase 3 success (TETRAS-ADL superiority with clean safety profile) → NDA submission; partnership discussions likely immediately."
  - "ESSENTIAL Phase 3 failure → thesis ends; Praxis restructures around PRAX-628 only; stock falls 60-80%."
  - "PRAX-628 Phase 2 positive readout → platform re-rating; Praxis becomes multi-asset CNS company; reduces single-asset binary risk."
  - "Partnership or licensing deal (large pharma CNS presence) → validates data and removes launch execution risk; upfront + milestone structure."
  - "Payer pre-approval signals (PBM formulary framework before NDA) → accelerates launch ramp; re-rates on commercialization expectations."
  - "Additional biomarker data: oscillation biomarker predicting ulixacaltamide response → could enable precision patient selection and improve responder rate."

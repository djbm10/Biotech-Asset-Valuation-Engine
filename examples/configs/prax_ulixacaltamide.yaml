# ---------------------------------------------------------------------------
monte_carlo:
  random_seed: 42
  peak_sales_cv: 0.45        # high uncertainty; first CNS drug in category; novel pricing
  discount_rate_std: 0.02
  years_to_peak_std: 2.0     # CNS launch trajectories more variable than oncology
  use_default_correlations: true

  phase_distributions:
    phase_3:
      mean: 0.48              # slightly below POS model; CNS Phase 3 historically disappointing
      ess: 10                 # low confidence; CNS heterogeneity
    nda_bla:

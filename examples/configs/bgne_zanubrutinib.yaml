# Historical Backtest: BeiGene / Zanubrutinib (BRUKINSA)
# =========================================================
# Analysis date: ~November 2018 (BLA filing for MCL)
# MAGNOLIA Phase 2 trial complete; BraVe Phase 1/2 complete; BGB-3111-206 supporting data
#
# PURPOSE: Run our model as of November 2018 (BLA submission for MCL)
#   Predicted:
#     P(approval) in MCL: model estimate (~72%)
#     Peak MCL-only net sales: model estimate
#     rNPV and NAV/share as of Nov 2018
#   Actual:
#     FDA approved zanubrutinib for relapsed/refractory MCL: November 14, 2019 (accelerated)
#     BRUKINSA 2020 US revenue: $57M (ramp; only ~2 quarters post-launch)
#     BRUKINSA 2021 US revenue: $291M (CLL/SLL broad approval added Oct 2021)
#     BRUKINSA 2022 US + Global: ~$1.0B (full year, global)
#     BRUKINSA 2023 US + Global: ~$2.9B (WM + CLL label expansion; ALPINE head-to-head ibrutinib)
#     WAC at launch: ~$257/day = ~$94K/yr; net price ~$170K/yr (specialty hematology G2N ~30%)
#     BGNE shares Nov 2018: ~$142 (pre-commercial; single MCL asset in US)
#
# What the model does/doesn't capture:
#   CAPTURES: Phase 2 POS in R/R MCL; BTK competitive dynamics (ibrutinib first mover);
#   class saturation dynamics; S-curve competitor ramps; specialty hematology economics
#   DOES NOT CAPTURE: CLL/SLL (second, far larger indication ~approved 2021);
#   WM, MZL, FL expansions; global OUS markets; biosimilar/generics competition post-LOE
#   Single-indication MCL understates lifetime BRUKINSA value by 15-20x.
#
# Data sources:
#   - MCL incidence/prevalence: ~10,000 new cases/yr US (SEER); treated ~4,000 R/R eligible
#   - BTK class: ibrutinib approved 2013; acalabrutinib approved 2017; zanubrutinib BLA Nov 2018
#   - BeiGene 20-F 2018: cash $1.85B; shares ~545M ADS-equivalent
#   - Pricing: 2019 WAC $94K/yr; specialty G2N 30% → net ~$66K; later blended with OUS ~$170K
#     (Model uses US-only net price, reflecting G2N-adjusted WAC)

asset:
  id: "zanubrutinib-mcl"
  name: "zanubrutinib (BRUKINSA)"
  indication: "Relapsed/Refractory Mantle Cell Lymphoma (MCL), US"
  therapeutic_area: "oncology"
  stage: "nda_bla"
  modality: "small_molecule"
  mechanism_of_action: "Covalent BTK inhibitor — optimized selectivity vs ibrutinib (lower off-target EGFR/ITK)"
  discount_rate: 0.12
  royalty_rate: 0.0
  net_ownership: 1.0
  upcoming_catalysts:
    - description: "PDUFA date / FDA accelerated approval decision for R/R MCL"
      expected_date: "2019-Q4"
      catalyst_type: "regulatory"
    - description: "BGB-3111-302 (ALPINE) Phase 3 vs ibrutinib in CLL readout"
      expected_date: "2021-Q4"
      catalyst_type: "readout"
    - description: "Broad CLL/SLL NDA approval decision"
      expected_date: "2021-Q4"
      catalyst_type: "regulatory"
  differentiation_notes: >
    Zanubrutinib offers improved BTK selectivity over ibrutinib: lower off-target
    EGFR (less rash/diarrhea), ITK (preserved NK cells), and TEC (less bleeding).
    ALPINE Phase 3 head-to-head vs ibrutinib in CLL showed superior PFS and lower AF rate.
    Second-generation BTK positioning after acalabrutinib, but with head-to-head data.

company:
  id: "bgne-2018"
  name: "BeiGene Ltd."
  ticker: "BGNE"
  cash_millions: 1850.0      # 20-F 2018: ~$1.85B cash + investments
  debt_millions: 0.0
  shares_outstanding_millions: 545.0   # ADS equivalent; ~$142/ADS Nov 2018
  burn_rate_millions_per_quarter: 280.0  # ~$1.1B annualized R&D + G&A (2018 10-F)
  current_price: 142.0

trials:
  - phase: "nda_bla"
    nct_id: "NCT02343120"
    success_probability: 0.50   # placeholder — POS model overrides
    duration_years: 0.75        # BLA submitted Oct 2018; PDUFA Nov 2019
    cost_millions: 12.0
    enrollment: null
    primary_endpoint: "Overall response rate in R/R MCL (accelerated approval)"
    endpoint_type: "surrogate_validated"
    notes: >
      Accelerated approval based on ORR 84% in BGB-3111-206 (105 pts); complete response 59%.
      FDA granting priority review for unmet need in BTK-inhibitor era MCL.

market_model:
  # MCL addressable population derivation:
  #   US MCL incidence: ~4,000-5,000/yr (SEER); prevalence ~30,000
  #   R/R MCL eligible for BTK (post-≥1 prior line): ~3,500-4,500/yr treated
  #   Using 4,000 as base case (conservative; not all R/R pts receive BTK)
  # Source: SEER 2018; Wang et al. 2018 Blood MCL treatment patterns
  addressable_patients_annual: 4000
  # Net price derivation:
  #   2019 WAC: ~$257/day = $93,805/yr (30mg twice daily)
  #   Specialty hematology G2N: ~30% (Medicare Part D + commercial mix)
  #   Net US price: $93,805 × 0.70 = ~$65,664
  # Source: IQVIA 2019; specialty hematology G2N benchmarks
  net_price_per_patient_usd: 65664
  peak_penetration: 0.35       # BTK class well established; 2nd-gen positioning; some ibrutinib/acala loyal
  years_to_peak: 3             # MCL is relatively small — KOL adoption faster than broad hematology
  patent_life_years: 10        # Approval 2019; BRUKINSA IP through ~2029 (composition of matter)
  compliance_rate: 0.85        # Oral daily dosing; BTK class has good compliance; some progression/toxicity
  cogs_rate: 0.15
  sgna_rate_launch: 0.50       # BeiGene building US commercial infrastructure from scratch
  sgna_rate_mature: 0.28

  competition_model:
    competitors:
      - name: "ibrutinib (IMBRUVICA)"
        status: "approved"
        launch_year_relative: -6   # Approved Nov 2013; 6 years before zanubrutinib
        peak_market_share: 0.50    # First mover in BTK class; dominant MCL share
        years_to_peak: 3
        approval_probability: 1.0
        use_s_curve: false
      - name: "acalabrutinib (CALQUENCE)"
        status: "approved"
        launch_year_relative: -2   # Approved Oct 2017; ~2 yrs before zanubrutinib
        peak_market_share: 0.20    # 2nd gen BTK; less dominant than ibrutinib in MCL
        years_to_peak: 4
        approval_probability: 1.0
        use_s_curve: true          # S-curve ramp: slow start vs ibrutinib-entrenched MDs
    first_mover_config:
      first_mover_bonus: 0.15      # ibrutinib 6yr head start → significant share protection
      late_entrant_penalty: 0.10   # 3rd BTK entrant in MCL sees modest penalty vs 2nd
    crowding_model:
      enabled: true
      crowding_threshold: 2        # 2+ approved BTK competitors before us → crowding
      decay_per_extra_competitor: 0.12
      floor_fraction: 0.15

pos_adjusters:
  apply_pos_model: true
  nda_bla:
    endpoint_type: "surrogate_validated"    # ORR; FDA precedent in BTK class (ibrutinib NDA)
    moa_precedent: "validated"             # ibrutinib + acalabrutinib approved in MCL
    sample_size_adequacy: "adequate"       # 105 pts; consistent with BTK accelerated approval comps
    safety_profile: "minor"               # Improved vs ibrutinib (less AF, less bleeding)
    competitive_pressure: "high"          # 2 approved BTK agents; FDA familiar but expects differentiation
    biomarker_selected_population: false  # All-comer R/R MCL (no BTK-mutation enrichment)
    strong_prior_phase_data: true         # Phase 1/2 ORR 84%, CR 59% — strong

sources:
  addressable_patients:
    confidence: "Medium"
    notes: "MCL R/R eligible population; SEER 2018 incidence + BTK penetration assumptions"
  net_price:
    confidence: "Medium"
    notes: "2019 WAC-derived; specialty hem G2N 30% applied"
  peak_penetration:
    confidence: "Low"
    notes: "Third BTK entrant with differentiation data; constrained by ibrutinib/acalabrutinib incumbency"

limitations:
  - "MCL indication only. CLL/SLL (~10x larger market, approved 2021) not modeled."
  - "US-only. OUS (China, EU) revenues, which are substantial for BeiGene, not captured."
  - "No WM, MZL, or FL label expansion modeled (each approved 2021-2023)."
  - "Assumes BTK-class penetration ceiling stable; non-covalent BTK (pirtobrutinib) competition not modeled."

thesis_changers:
  - "FDA rejects BLA or requires additional confirmatory data → 2-3 year delay."
  - "ALPINE Phase 3 vs ibrutinib in CLL fails non-inferiority → zanubrutinib loses differentiating claim."
  - "Ibrutinib generic erosion accelerates BTK class commoditization → pricing compression."
  - "Non-covalent BTK (pirtobrutinib) or BTK degrader shows superiority → class disruption."

analyst_notes: >
  HISTORICAL BACKTEST — November 2018 analysis (at time of BLA filing).
  This config models MCL-only zanubrutinib economics. The actual drug became a
  multi-billion franchise through label expansion (CLL, WM, MZL, FL) and head-to-head
  ibrutinib victory in ALPINE — none of which were knowable at BLA filing.

  Key modeling challenge: how to treat 3rd BTK entrant in a class where ibrutinib has
  6-year first-mover advantage and 50%+ MCL share. The FirstMoverConfig and crowding
  model capture this structural disadvantage.

  ACTUAL OUTCOMES (for comparison):
    Approval: November 14, 2019 (accelerated, R/R MCL)
    BRUKINSA 2022 global revenue: ~$1.0B
    BRUKINSA 2023 global revenue: ~$2.9B (post-ALPINE full CLL approval)
    MCL-only revenue was a fraction of total — underscoring how much value came from
    indications not modelable in Nov 2018.

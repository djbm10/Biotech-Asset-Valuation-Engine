polling_interval_seconds: 3600
state_path: outputs/watchlist/pipeline_state.json
knowledge_db_path: outputs/intelligence_phase2/knowledge.db
valuation_output_dir: outputs/intelligence_phase2/watchlist

schedule:
  enabled: true
  daily_ingestion_interval_hours: 24
  weekly_maintenance_weekday: 6
  weekly_replay_since: 7d

materiality:
  min_abs_delta_npv: 25.0
  min_relative_delta_npv_pct: 5.0
  min_diff_count: 1

extraction:
  backend: anthropic
  model: claude-sonnet-4-6

connectors:
  clinicaltrials_gov:
    enabled: true
    limit: 20
  sec_filing:
    enabled: true
    limit: 10
  press_release:
    enabled: true
    limit: 1

watchlist:

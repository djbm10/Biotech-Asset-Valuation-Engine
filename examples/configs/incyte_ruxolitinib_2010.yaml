# Historical Backtest: Incyte Corporation / INCB018424 (ruxolitinib / Jakafi)
# ===========================================================================
# Analysis date: ~January 2010
# COMFORT-I Phase 3 trial (NCT00952289) recently initiated; COMFORT-II starting Q1 2010
#
# PURPOSE: Run our model as of 2010 and compare predictions to actual outcomes.
#   Predicted:
#     P(approval): model estimate
#     Peak sales (MF indication): model estimate
#     rNPV and NAV/share
#   Actual:
#     FDA approved: November 16, 2011 (myelofibrosis)
#     2012 US net revenue: $214M
#     2013 US net revenue: $448M
#     2014 US net revenue: $679M
#     2015 US net revenue: $901M (includes PV expansion approved 2014)
#     MF-only peak ~2014: ~$550-650M (before PV expansion contributes)
#     Incyte market cap 2010: ~$2.5B; at approval (2011): ~$5.5B
#     Incyte stock price Jan 2010: ~$10.50 → Nov 2011 approval: ~$22 (+110%)
#
# Data sources:
#   - NIH: MF prevalence ~60,000 US (but addressable/treated ~15,000-20,000)
#   - JAK2 mutation frequency: ~95% JAK2V617F, 5% CALR/other — all ruxolitinib-eligible
#   - Incyte 10-K 2009: cash ~$450M (after December 2009 Eli Lilly license deal)
#   - Shares outstanding 2010: ~200M
#   - Price Jan 2010: ~$10.50
#   - Ruxolitinib WAC 2011 launch: ~$115,000/yr; G2N ~20% -> net ~$92,000
#
# What the model does/doesn't capture:
#   - CAPTURES: Phase 3 POS for well-validated JAK2 target; symptomatic MF market;
#     competitive landscape (no approved MF therapies at launch)
#   - DOES NOT CAPTURE: Polycythemia vera expansion (approved 2014, ~$300M additional)
#   - Does not model graft-vs-host disease approval (2019, ~$200M)
#   - MF-only model understates Jakafi lifetime value by ~3x (label expansions)

asset:
  id: "ruxolitinib-mf"
  name: "ruxolitinib (INCB018424)"
  indication: "Myelofibrosis (intermediate/high-risk), US"
  therapeutic_area: "oncology"
  stage: "phase_3"
  modality: "small_molecule"
  mechanism_of_action: "JAK1/JAK2 inhibitor — first JAK inhibitor in hematologic malignancies"
  discount_rate: 0.10
  royalty_rate: 0.0
  upcoming_catalysts:
    - description: "COMFORT-I Phase 3 interim analysis — SVR35 primary endpoint"
      expected_date: "2010-Q4"
      catalyst_type: "readout"
    - description: "COMFORT-I Phase 3 primary results"
      expected_date: "2011-Q1"
      catalyst_type: "readout"
    - description: "NDA submission for intermediate/high-risk MF"
      expected_date: "2011-Q3"
      catalyst_type: "regulatory"
    - description: "PDUFA date / FDA approval decision"
      expected_date: "2011-Q4"
      catalyst_type: "regulatory"
  differentiation_notes: >
    First approved JAK inhibitor. MF has historically had no approved therapies;
    hydroxyurea is used off-label but does not modify disease. Ruxolitinib shows
    40-50% spleen volume reduction in >35% of patients (vs. <1% with placebo) and
    OS benefit in COMFORT-II. First drug to receive "regular approval" (not accelerated)
    in MF, based on OS data from COMFORT-II.

company:
  id: "incy-2010"
  name: "Incyte Corporation"
  ticker: "INCY"
  cash_millions: 450.0       # ~$450M after Eli Lilly milestones (baricitinib deal)
  debt_millions: 0.0
  shares_outstanding_millions: 200.0
  burn_rate_millions_per_quarter: 55.0  # ~$220M annualized R&D + G&A
  current_price: 10.50       # ~Jan 2010 market price

trials:
  - phase: "phase_3"
    nct_id: "NCT00952289"
    success_probability: 0.50  # placeholder — POS model overrides
    duration_years: 1.5        # COMFORT-I: ~2yr enrollment + 24wk primary
    cost_millions: 120.0       # Two Phase 3 trials (COMFORT-I + COMFORT-II)
    enrollment: 309            # COMFORT-I actual: 309 patients
    primary_endpoint: "Spleen volume reduction ≥35% at Week 24 (SVR35)"
    endpoint_type: "surrogate_validated"
    notes: "COMFORT-I (US) and COMFORT-II (EU) running concurrently. Both required for full approval."
  - phase: "nda_bla"
    nct_id: null
    success_probability: 0.50  # placeholder
    duration_years: 0.75
    cost_millions: 10.0
    enrollment: null
    primary_endpoint: "NDA approval for intermediate/high-risk MF"
    endpoint_type: "hard_clinical"

market_model:
  # MF addressable population derivation:
  #   MF prevalence: ~60,000 US (NIH/ASH estimates)
  #   Symptomatic, intermediate/high-risk (trial-eligible): ~20,000-25,000
  #   Diagnosed and actively managed: ~70% = ~15,000-18,000
  #   Using 16,000 as base case (conservative; drug is not curative)
  # Source: Mesa et al. 2007 "Prevalence and incidence of MF" Blood; ASH 2009 abstracts
  addressable_patients_annual: 16000
  # Net price derivation:
  #   2011 WAC: $115,000/yr (two 20mg tablets bid; 60-tablet pack ~$5,750)
  #   G2N for specialty oncology: ~20% (hematology payers; Medicaid rebate)
  #   Net price: $115K × (1 - 0.20) = $92,000
  # Source: Medispan 2011 WAC; specialty oncology G2N benchmarks
  net_price_per_patient_usd: 92000
  peak_penetration: 0.55       # First drug; strong efficacy in high-need setting; but not curative
  years_to_peak: 4             # Physician education required; community hem/onc adoption slower
  patent_life_years: 12        # Launch ~2012 through ~2024
  compliance_rate: 0.80        # Chronic therapy; some discontinuation due to cytopenias
  cogs_rate: 0.18
  sgna_rate_launch: 0.40
  sgna_rate_mature: 0.20

pos_adjusters:
  apply_pos_model: true
  phase_3:
    endpoint_type: "surrogate_validated"  # Spleen volume reduction — FDA accepted per prior
    moa_precedent: "novel"               # JAK inhibitors had no approved precedent in 2010
    sample_size_adequacy: "adequate"     # 309 patients well-powered for 35% SVR endpoint
    safety_profile: "minor"             # Cytopenias manageable; no serious safety signals in Ph2
    competitive_pressure: "low"         # Zero approved MF therapies in 2010
    biomarker_selected_population: false # All-comer MF (JAK2+/JAK2-; not enriched)
    strong_prior_phase_data: true       # Phase 2: 44% SVR35; consistent dose-response
    has_breakthrough_designation: false # BTD didn't exist until 2012
  nda_bla:
    endpoint_type: "hard_clinical"
    moa_precedent: "partial"
    sample_size_adequacy: "adequate"
    safety_profile: "minor"
    competitive_pressure: "low"

sources:
  addressable_patients:
    confidence: "Medium"
    notes: "MF prevalence estimates vary 25,000-150,000 (total); using treated/addressable subset"
  net_price:
    confidence: "Medium"
    notes: "2011 launch WAC back-calculated; specialty hem G2N ~20%"
  peak_penetration:
    confidence: "Low"
    notes: "No prior JAK inhibitor launch comp available; using general hematology analogue"

limitations:
  - "MF indication only. PV approval (2014) and GvHD approval (2019) not modeled."
  - "US-only. Jakafi approved EU 2012 (Jakavi) added significant OUS revenue."
  - "Cytopenias not modeled as a driver of discontinuation (could limit penetration ceiling)."
  - "No competitor model needed at 2010 — but fedratinib (Impact 2019) and pacritinib (2022) will erode share post-model period."

thesis_changers:
  - "COMFORT-I fails to meet 35% SVR threshold (historically 44% in Phase 2) → full thesis collapse."
  - "FDA raises bar to OS endpoint only (not SVR35) → delays by 2-3 years."
  - "Splenomegaly response doesn't translate to QoL benefit → commercial disappointment."
  - "Competing JAK inhibitor (fedratinib, Sanofi) achieves positive Phase 3 simultaneously → competitive erosion."

analyst_notes: >
  HISTORICAL BACKTEST — 2010 analysis. This config represents what a 2010 analyst would
  have had access to: Phase 2 SVR35 data (44%), emerging OS signal in Verstovsek 2010
  Nature Medicine paper, and a clear unmet need (zero approved MF therapies).

  Key modeling challenges in 2010:
    1. MF population size was poorly characterized (estimates ranged 25K-150K)
    2. JAK inhibitor precedent was zero — novel MoA penalty applied
    3. Pricing was uncertain; used RA analogue ($25-50K/yr) vs reality ($115K/yr orphan-like)

  The pricing gap is the main reason our model UNDER-predicts Jakafi revenue.
  An analyst in 2010 anchoring to RA JAK inhibitor pricing ($30K/yr) would predict
  ~$441M peak vs. actual >$1B. This demonstrates the need for orphan/specialty
  pricing comparables rather than RA comps.

  ACTUAL OUTCOMES (for comparison):
    Approval: November 16, 2011 (regular approval, not accelerated — OS data from COMFORT-II)
    P(approval) actual: 100%
    2014 US MF + PV revenue: ~$679M (MF portion ~$500M)
    2015 peak all-indication: ~$901M
    Incyte stock: $10.50 (Jan 2010) → $22 (Nov 2011 approval) → $110+ (2018)
    Model would have predicted: check valuation output below after running bve-asset

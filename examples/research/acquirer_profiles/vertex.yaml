company: Vertex Pharmaceuticals
ticker: VRTX
profile_as_of: 2026-04-07
market_cap_billions: 108
cash_billions: 11.0
acquisition_capacity_millions: 15000

# ── Deal style (elite profile)  ──────────────────────────────────────────────
# Vertex is highly selective: only acquires assets with genetic/biomarker-defined
# patient populations, proven mechanism (human PoC), and transformative potential.
# It never does oncology, neuroscience, or cardiovascular.
# Typical deal range: $100M tuck-in to $5B strategic bolt-on. No mega-mergers.
# Pays franchise premiums (2–3× rNPV) for assets that slot into an existing platform.
deal_style: "asset_centric_precision_medicine"
therapeutic_area_exclusions:
  - oncology
  - neuroscience
  - cardiovascular
  - metabolic
indication_signals:
  # Explicit indication-level signals — any asset in these areas is Vertex-relevant
  - iga_nephropathy
  - igan
  - pkd
  - polycystic_kidney
  - ckd
  - aatd
  - alpha_1_antitrypsin
  - myotonic_dystrophy
  - dm1
  - sickle_cell
  - beta_thalassemia
  - cystic_fibrosis
  - pain_nav18
  - suzetrigine
  - autoimmune_b_cell
  - baff
  - april

pipeline_gaps:
  - therapeutic_area: rare_disease
    sub_area: ckd_pkd_renal
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [small_molecule, antibody, bispecific]
    budget_ceiling_millions: 12000
    notes: |
      Active IgA nephropathy program (povetacicept/ALPN-303, acquired via Alpine 2024)
      plus internal PKD and complement programs. Seeking bolt-on renal/immunology assets
      that extend the kidney franchise (FSGS, ANCA vasculitis, lupus nephritis, complement).
      Alpine acquisition at $4.9B ($65/share vs ~$26 NAV) demonstrates willingness to
      pay 2-3x strategic premium for franchise-completing assets.

  - therapeutic_area: rare_disease
    sub_area: pain_non_opioid_nav18
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [small_molecule]
    budget_ceiling_millions: 8000
    notes: |
      VX-548 (suzetrigine, NaV1.8) approved for acute pain Jan 2025.
      Seeking: NaV1.8 chronic pain extension, NaV1.7 assets, and combination-therapy
      partners. Target profile: Phase 2+, genetic/biomarker-defined, non-opioid MOA.

  - therapeutic_area: rare_disease
    sub_area: alpha1_antitrypsin_deficiency
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [small_molecule, RNA_therapy, gene_therapy]
    budget_ceiling_millions: 8000
    notes: |
      VX-634 in phase 2 AATD. Combination/backbone strategy mirrors CF corrector success.
      Attractive: any AATD asset in Phase 1/2 with PiZZ patient population, or gene
      therapy approaches with durable A1AT restoration.

  - therapeutic_area: immunology
    sub_area: autoimmune_b_t_cell
    gap_type: selective_gap
    urgency: medium
    preferred_modality: [antibody, bispecific, cell_therapy, gene_editing]
    budget_ceiling_millions: 12000
    notes: |
      Post-Alpine acquisition: autoimmune B-cell / T-cell co-stimulation adjacency now
      a priority. Looking for BAFF/APRIL pathway, complement, FcRn, or other
      precision-immunology assets that complement povetacicept and dazodalibep.
      Must have human PoC in autoimmune indication with genetic/biomarker-defined patients.

  - therapeutic_area: rare_disease
    sub_area: dm1_myotonic_dystrophy
    gap_type: selective_gap
    urgency: medium
    preferred_modality: [small_molecule, ASO, RNA_therapy]
    budget_ceiling_millions: 6000
    notes: |
      DM1 (myotonic dystrophy type 1) is a declared priority rare neuromuscular indication.
      DMPK-targeting small molecules and RNA therapies actively evaluated.

  - therapeutic_area: rare_disease
    sub_area: sickle_cell_beta_thal
    gap_type: franchise_extension
    urgency: low
    preferred_modality: [gene_therapy, gene_editing, cell_therapy]
    budget_ceiling_millions: 5000
    notes: |
      Casgevy (exa-cel, with CRISPR Tx) established gene editing platform.
      Opportunistic bolt-ons for hemoglobinopathies; lower urgency now that Casgevy
      is approved.


existing_partnerships:
  - target: CRISPR Therapeutics
    partnership_type: co_development
    therapeutic_area: rare_disease
    description: "Co-development of Casgevy (exa-cel) for sickle cell disease and beta-thalassemia. Casgevy approved Dec 2023 (FDA) and Feb 2024 (EU)."
    year_initiated: 2015
    acquisition_option: false

stated_priorities:
  - "Rare disease franchise diversification beyond CF is the explicit CEO-level priority: pain (NaV1.8), kidney disease (IgAN/PKD), AATD, DM1."
  - "Precision immunology entry via Alpine acquisition (2024) opens autoimmune adjacency with BAFF/APRIL and complement biology."
  - "Cell and gene therapy via CRISPR Therapeutics partnership and Casgevy approval establishes ex vivo gene editing platform."
  - "Never acquires oncology, CNS/neurology, or cardiovascular assets — these are explicit strategic exclusions confirmed by management."
  - "Pays franchise premiums (2-3x rNPV) for assets with biomarker-defined populations that slot into an existing program line."

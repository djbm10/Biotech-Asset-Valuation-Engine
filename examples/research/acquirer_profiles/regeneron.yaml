    partnership_type: co_development
    therapeutic_area: rare_disease
    description: "NTLA-2001 (ATTR amyloidosis) and hemophilia B in vivo gene editing co-development. Regeneron has rights to certain Intellia-discovered in vivo programs."
    year_initiated: 2016
    acquisition_option: false
  - target: Sanofi
    partnership_type: co_development
    therapeutic_area: immunology
    description: "Long-running Dupixent commercialization partnership. Sanofi books revenue globally; Regeneron has US co-promotion rights and receives royalties. Not acquisition-relevant but shapes combined portfolio synergies."
    year_initiated: 2014
    acquisition_option: false

stated_priorities:
  - "VelocImmune-derived bispecific oncology pipeline (PSMAxCD3, MUC16xCD3) is the primary new growth engine post-Eylea."
  - "Dupixent next-generation type-2 inflammation: IL-33, OX40L, and novel atopic mechanisms are internal and bolt-on priority."
  - "Ophthalmic franchise renewal post-Eylea LOE — geographic atrophy and gene therapy for inherited retinal disease are urgent."
  - "Decibel Therapeutics acquisition demonstrates interest in gene therapy for hearing loss and rare sensory disease."
  - "Strongly prefers antibody/bispecific modality via VelocImmune; rarely acquires small molecules or cell therapies independently."

company: Regeneron Pharmaceuticals
ticker: REGN
profile_as_of: 2026-04-07
market_cap_billions: 62
cash_billions: 14.3
acquisition_capacity_millions: 20000

# ── Deal style (elite profile)  ──────────────────────────────────────────────
# Regeneron acquires for PLATFORM or PIPELINE bolt-on that fits VelocImmune.
# Very antibody/bispecific-centric — rarely acquires small molecules.
# Prefers Phase 2+ with human antibody validation data.
# Historically low deal frequency, high scientific selectivity.
# Key franchise anchors: Dupixent (IL-4/IL-13, type-2 inflammation),
# Libtayo (PD-1 oncology), Eylea (VEGF ophthalmology).
deal_style: "platform_antibody_engineering_bolt_on"
platform_bias: "velocimmune_human_antibody"
indication_signals:
  # Dupixent next-wave type-2 inflammation
  - atopic_dermatitis
  - asthma
  - chronic_rhinosinusitis
  - eosinophilic_esophagitis
  - prurigo_nodularis
  - urticaria
  - type2_inflammation
  - il33
  - tslp
  - ox40l
  # Oncology bispecific
  - solid_tumor
  - psma
  - muc16
  - pd1
  - cemiplimab
  - bispecific_tcell_engager
  # Ophthalmology
  - amd
  - geographic_atrophy
  - retinal_vein_occlusion
  - diabetic_macular_edema
  - rare_retinal
  - vegf
  # Rare disease
  - familial_hypercholesterolemia
  - homozygous_fh
  - angioedema
  - rare_lipid

pipeline_gaps:
  - therapeutic_area: immunology
    sub_area: dupixent_next_wave_il33_ox40l
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [antibody, bispecific, biologic]
    budget_ceiling_millions: 15000
    notes: |
      Dupixent (dupilumab, $14B+ revenue 2025) dominates type-2 inflammation.
      Next wave: IL-33 (itepekimab internal), OX40L (amlitelimab from Sanofi JV),
      TSLP, and novel atopic mechanisms. Seeking: validated antibody/bispecific assets
      in type-2 inflammation adjacency (eczema, asthma, eosinophilic conditions,
      prurigo, urticaria). Must have human antibody data. Phase 2+ preferred.

  - therapeutic_area: oncology
    sub_area: bispecific_antibody_solid_tumor
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [bispecific, antibody, ADC]
    budget_ceiling_millions: 12000
    notes: |
      Libtayo (cemiplimab) PD-1 anchor. VelocImmune-derived bispecifics:
      PSMAxCD3 (Phase 2 prostate), MUC16xCD3 (Phase 2 ovarian), FLT3xCD3 (AML).
      Seeking: differentiated solid tumor bispecifics or T-cell engagers that
      complement cemiplimab combination strategy. ADCs evaluated opportunistically.

  - therapeutic_area: ophthalmology
    sub_area: dry_amd_geographic_atrophy_next
    gap_type: franchise_extension
    urgency: high
    preferred_modality: [antibody, gene_therapy, small_molecule]
    budget_ceiling_millions: 8000
    notes: |
      Eylea (aflibercept) LOE drives urgency. Eylea HD (2mg) buys time.
      Seeking: geographic atrophy (complement C3/C5, visual cycle), rare retinal
      disease, or novel ophthalmic mechanisms to anchor next ophthalmic franchise.
      Gene therapy for inherited retinal disease (IRD) is high priority.

  - therapeutic_area: neuroscience
    sub_area: alzheimers_neuroinflammation
    gap_type: selective_gap
    urgency: medium
    preferred_modality: [antibody, bispecific]
    budget_ceiling_millions: 8000
    notes: |
      Regeneron VelocImmune generates best-in-class antibodies for neuroinflammation.
      REGN4461 (leptin receptor) and REGN3500 (IL-33 brain) establish neuroscience.
      Interest: neuro-inflammation, microglial biology, Alzheimer's adjacent mechanisms
      where antibody engineering provides differentiated modality advantage.

  - therapeutic_area: rare_disease
    sub_area: lipodystrophy_rare_metabolic
    gap_type: selective_gap
    urgency: medium
    preferred_modality: [antibody, protein, gene_therapy]
    budget_ceiling_millions: 6000
    notes: |
      Evkeeza (evinacumab, ANGPTL3) for homozygous FH and severe hypertriglyceridemia.
      Precedent for rare lipid/metabolic disorders with antibody mechanism.
      Adjacent: lipoprotein(a), PCSK9 next-gen, other rare dyslipidemias.

  - therapeutic_area: immunology
    sub_area: hereditary_angioedema
    gap_type: selective_gap
    urgency: low
    preferred_modality: [antibody, small_molecule]
    budget_ceiling_millions: 4000
    notes: |
      CXCL10 and kallikrein-kinin system experience from internal programs.
      HAE (hereditary angioedema) fits complement/kinin biology antibody platform.
      Low urgency given no current LOE pressure in this space.

